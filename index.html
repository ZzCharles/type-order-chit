/* v3.9.2 (owner, 11 Oct 2026: "Sliced Swiss Browns" went back to its old
   name). With two copies of The Pass open at once (a Chrome tab and the
   home-screen app, say), each keeps its own list in memory, and the older
   copy's next save (even a +1 tap) wrote its old list over the newer one.
   Proven in the test browser. Now each copy remembers the list it last read
   or wrote (suppliersSeen):
   - it takes the newer list when the other copy writes one (the storage
     event) and whenever it comes back on screen;
   - a save that would still land on a list it hasn't seen is not made: it
     takes the newer list and asks for the change again, rather than undo
     the other copy's work without a word. */
let suppliersSeen = null;
function refreshSuppliersFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw || raw === suppliersSeen) return false;
    state.suppliers = JSON.parse(raw);
    suppliersSeen = raw;
    return true;
  }catch(e){ return false; }
}
function saveData(){
  try{
    const now = localStorage.getItem(STORAGE_KEY);
    if(suppliersSeen !== null && now !== null && now !== suppliersSeen){
      refreshSuppliersFromStorage();
      render();
      // a moment later, so a caller's own "Product updated" can't cover it
      setTimeout(()=>showToast('Your other The Pass window changed this list. Showing it now. Please do that again.'), 60);
      return;
    }
    const raw = JSON.stringify(state.suppliers);
    localStorage.setItem(STORAGE_KEY, raw);
    suppliersSeen = raw;
  }catch(e){ showToast('Not saved - storage unavailable'); }
  schedulePublish();
}
window.addEventListener('storage', (e)=>{
  if(e.key === STORAGE_KEY && refreshSuppliersFromStorage()) bgRender();
  // v3.9.4
  if((e.key === ROSTER_KEY || e.key === ROSTER_NEXT_KEY) && refreshRosterFromStorage()) bgRender();
  if(e.key === TS_SHEET_KEY && refreshTimesheetFromStorage()) bgRender();
  /* v3.11.13: Pluto's Almo room can add a prep item now, so another copy's
     change is read here too (else this copy's next save would drop it) */
  if(e.key === PREPITEMS_KEY){ loadPrepItems(); bgRender(); }
});

/* ===== Product catalogue -> staff app =====
   Every supplier product, flattened, pushed to the Worker so Almo Orders shows
   exactly what The Pass has. Fingerprinted so a stepper tap doesn't trigger a
   write: only names, units and increments count. */

function buildCatalogue(){
  const out = [];
  state.suppliers.forEach(s => (s.products||[]).forEach(p => {
    out.push({ id:p.id, name:p.name, unit:p.unit || '', inc: p.inc || 1, cat: p.cat || '' });
  }));
  return out;
}

function catalogueFingerprint(list){
  return list.map(p => p.id+'|'+p.name+'|'+p.unit+'|'+p.inc+'|'+p.cat).sort().join('~') + '||' + categories.join(',');
}

function schedulePublish(){
  clearTimeout(schedulePublish._t);
  schedulePublish._t = setTimeout(()=>{ publishCatalogue(false); }, 900);
}

async function publishCatalogue(force){
  if(syncHeld()) return true;           // v3.11.3: a starter or backup copy never sends its product list
  const list = buildCatalogue();
  const fp = catalogueFingerprint(list);
  let last = null;
  try{ last = localStorage.getItem(CATALOGUE_FP_KEY); }catch(e){}
  if(!force && last === fp && state.catalogueSynced !== false) return true;

  try{
    const res = await fetch(API + '/api/catalogue', {
      method:'POST', headers: chefHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ products: list, categories: categories })
    });
    if(!res.ok) throw new Error();
    try{ localStorage.setItem(CATALOGUE_FP_KEY, fp); }catch(e){}
    const was = state.catalogueSynced;
    state.catalogueSynced = true;
    if(was === false){ showToast('Staff app updated'); render(); }
    return true;
  }catch(e){
    state.catalogueSynced = false;
    if(state.view.name === 'list') render();
    return false;
  }
}

   Deliberately a separate key from the last-order map. Repeat Last Order reads
   that map and works today, so it doesn't get its shape changed for the sake of

   This records that the message was *handed to* the SMS or Mail app. The phone
   never tells a web page whether it was actually sent, so this can be wrong if
   an order is abandoned at the last step — which is what the undo is for.
   Clears on the 5am service-day boundary, same as functions. */
function lastSentKey(id){ return 'order-chit-lastsent-'+id; }

/* ===== Order history (v3.9.5) =====
   Every order handed to Messages or Mail is kept, so The Pass can learn the
   owner's patterns later (v3.10: "am I missing anything?", his usual for each
   day, things not ordered in a while). On the phone only, like the orders.
   Each entry: at (time sent), day (service day sent), sup (supplier id),
   mode + for (the date the ticket asked for: 'tomorrow', the next usual day,
   or one picked from the calendar), items ({product id: quantity}).
   The list is read fresh and written in one step, so two open copies of The
   Pass can't undo each other's entries. Entries older than 400 days drop off.
   Copy-to-clipboard isn't recorded: it doesn't mark an order sent either. */
const ORDER_HISTORY_KEY = 'order-chit-order-history';
const ORDER_HISTORY_DAYS = 400;
function readOrderHistory(){ const h = readStoredJSON(ORDER_HISTORY_KEY); return Array.isArray(h) ? h : []; }

function ticketForKey(s){
  if(ticketDateMode === 'nextday'){
    const d = nextWeekday((s.template && s.template.usualDay) || 'Tuesday');
    return d ? localDateKey(d) : null;
  }
  if(ticketDateMode === 'calendar'){
    const el = document.getElementById('date-input');
    return el && el.value ? el.value : null;
  }
  const d = new Date(); d.setDate(d.getDate() + 1);   // 'tomorrow', as the supplier reads it
  return localDateKey(d);
}

function recordOrderSent(s){
  const items = {};
  s.products.forEach(p => { if(p.qty > 0) items[p.id] = p.qty; });
  if(!Object.keys(items).length) return;
  const now = Date.now();
  const cutoff = now - ORDER_HISTORY_DAYS * 24 * 3600 * 1000;
  try{
    const h = readOrderHistory().filter(e => e && e.at >= cutoff);
    h.push({ at: now, day: serviceDateKey(), sup: s.id, mode: ticketDateMode, for: ticketForKey(s), items: items });
    localStorage.setItem(ORDER_HISTORY_KEY, JSON.stringify(h));
  }catch(e){}
}

/* "Marked as not sent": the order never went, so it isn't history either.
   Takes off that supplier's newest entry from this service day. */
function unrecordOrderSent(id){
  try{
    const h = readOrderHistory();
    const today = serviceDateKey();
    for(let i = h.length - 1; i >= 0; i--){
      if(h[i] && h[i].sup === id && h[i].day === today){
        h.splice(i, 1);
        localStorage.setItem(ORDER_HISTORY_KEY, JSON.stringify(h));
        return;
      }
    }
  }catch(e){}
}

/* Returns the record only if it belongs to the current service day, so the tick
   expires by itself with no clean-up job anywhere. */
function sentToday(id){
  try{
    const raw = localStorage.getItem(lastSentKey(id));
    if(!raw) return null;
    const rec = JSON.parse(raw);
    if(!rec || rec.day !== serviceDateKey()) return null;
    return rec;
  }catch(e){ return null; }
}

function sentTimeLabel(at){
  try{
    return new Date(at).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})
      .replace(/\s+/g,'').toLowerCase();
  }catch(e){ return ''; }
}

function shareText(text, areaId){
  try{
    if(!ROOM && window.PlutoRoomHost && typeof window.PlutoRoomHost.share === 'function'){ window.PlutoRoomHost.share(text); return 'app'; }
  }catch(e){}
  if(navigator.share){ navigator.share({text}).catch(()=>{}); return 'share'; }
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(()=>showToast('Copied - share sheet not available')).catch(()=>{
    const area = document.getElementById(areaId);
    if(area){ area.style.display='block'; area.value=text; area.select(); }
    showToast('Select & copy manually');
  });
  return 'copy';
}
/* v3.11.21 (his ask, 22 Oct: "be able to send as text or as image", ClockR's style "but a bit more
   polished", small icons per section; his picks: the "C · Night" style of Pluto's
   design/publish-mockup.html, today's text kept, one button then pick). The picture is drawn here on
   a canvas, 1080 px wide (three times the mock-up), no internet needed, and shared as a PNG: in the
   app through PlutoRoomHost.shareImage (Pluto app 1.24+), in Chrome through navigator.share with a
   file. Where neither can take a picture, the button shares the text as before (no question asked). */
function canSharePicture(){
  if(ROOM) return false;                                    // the room never shares
  try{ if(window.PlutoRoomHost) return typeof window.PlutoRoomHost.shareImage === 'function'; }catch(e){ return false; }   // in the Pluto app: only its own share sheet
  try{ return !!(navigator.canShare && navigator.canShare({ files: [new File([new Uint8Array(8)], 'x.png', { type: 'image/png' })] })); }catch(e){ return false; }
}
function sharePicture(canvas, name, text, areaId){
  try{
    if(!ROOM && window.PlutoRoomHost && typeof window.PlutoRoomHost.shareImage === 'function'){
      window.PlutoRoomHost.shareImage(canvas.toDataURL('image/png').split(',')[1], name);
      return 'app';
    }
  }catch(e){}
  canvas.toBlob(b=>{
    if(!b){ shareText(text, areaId); return; }
    navigator.share({ files: [new File([b], name + '.png', { type: 'image/png' })] }).catch(err=>{
      if(!err || err.name !== 'AbortError') showToast('Couldn\u2019t share the picture');
    });
  }, 'image/png');
  return 'share';
}
/* "Send the roster as": Picture (with the dates it shows) or Text. o: { what, range, picture(), text() } */
function chooseShare(o){
  if(!canSharePicture()){ o.text(); return 'text'; }
  closeShareSheet();
  const el = document.createElement('div');
  el.className = 'share-sheet'; el.id = 'share-sheet';
  el.innerHTML = '<div class="ss-back" data-ss="cancel"></div><div class="ss-card" role="dialog" aria-label="Send ' + escapeHtml(o.what) + ' as">'
    + '<div class="ss-title">Send ' + escapeHtml(o.what) + ' as</div>'
    + '<button class="btn btn-block" data-ss="picture">Picture<span class="ss-sub">' + escapeHtml(o.range) + '</span></button>'
    + '<button class="btn btn-ghost btn-block" data-ss="text">Text</button>'
    + '<button class="ss-cancel" data-ss="cancel">Cancel</button></div>';
  el.addEventListener('click', ev=>{
    const b = ev.target.closest('[data-ss]');
    if(!b) return;
    const a = b.dataset.ss;
    closeShareSheet();
    if(a === 'picture') o.picture(); else if(a === 'text') o.text();
  });
  (document.getElementById('app') || document.body).appendChild(el);   // a redraw of the screen takes it away
  return 'asked';
}

function picBox(ctx, x, y, w, h, r, fill, line){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function picFit(ctx, s, max){ s = String(s); if(ctx.measureText(s).width <= max) return s; while(s.length > 1 && ctx.measureText(s + '\u2026').width > max) s = s.slice(0, -1); return s + '\u2026'; }

  ctx.font = weight + ' ' + size + 'px ' + PIC.font; ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(max ? picFit(ctx, s, max) : s, x, y);
}
function picStart(h){
  const c = document.createElement('canvas'); c.width = PIC.W; c.height = Math.ceil(h);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#070c1d'; ctx.fillRect(0, 0, c.width, c.height);
  const g = ctx.createRadialGradient(PIC.W / 2, 0, 0, PIC.W / 2, 0, Math.min(PIC.W * 1.2, c.height * 0.6 + 400));
  g.addColorStop(0, '#14234d'); g.addColorStop(1, 'rgba(7,12,29,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
  return { c, ctx };
}
function picHead(ctx, y, title, sub){
  const x = PIC.pad, w = PIC.W - 2 * PIC.pad;
  picBox(ctx, x, y, w, 231, 42, PIC.head, PIC.headLine);
  picText(ctx, title, x + 48, y + 106, 75, 700, PIC.ink, 'left', w - 96);
  picText(ctx, sub, x + 48, y + 173, 39, 400, PIC.soft, 'left', w - 96);
  return y + 231 + 30;
}
const PIC_ROW = 121, PIC_DAYTOP = 79, PIC_DAYEND = 24;
function picIcon(ctx, cx, cy, station){
  const ic = PIC_ICON[station] || PIC_OTHER;
  ctx.save();
  ctx.shadowColor = ic[0]; ctx.shadowBlur = 27;
  ctx.beginPath(); ctx.arc(cx, cy, 36, 0, Math.PI * 2); ctx.fillStyle = picHex(ic[0], 0.22); ctx.fill();
  ctx.shadowBlur = 9;
  ctx.translate(cx - 22.5, cy - 22.5); ctx.scale(45 / 24, 45 / 24);
  ctx.lineWidth = 1.9; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ic[0];
  ctx.stroke(new Path2D(ic[1]));
  ctx.restore();
}

  const { c, ctx } = picStart(h);

/* Wraps a render in a View Transition where supported, so screens cross-fade
   instead of snapping. Falls through untouched everywhere else. */
function animate(fn){
  try{
    if(document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.startViewTransition(fn);
      return;
    }
  }catch(e){}
  fn();
}

function goto(view){
  if(view.name !== state.view.name){ state.move = null; state.broughtIn = false; }   // v3.11.3
  if(!(view.name === 'recipeEdit' && view.rid === 'new')) state.recipeDraft = null;
  if(view.name !== state.view.name && (view.name === 'recipeImport' || state.view.name === 'recipeImport')){ state.importPreview = null; state.importRaw = ''; }
  if(!(view.name === 'fnEdit' && view.fid === 'new')){ state.fnDraft = null; state.fnFromDoc = false; }
  // v3.11.42: the function as it was when its form opened, so Save can tell if it was changed elsewhere meanwhile
  if(view.name === 'fnEdit' && view.fid !== 'new' && !(state.view.name === 'fnEdit' && state.view.fid === view.fid)){ state.fnEditBase = fnSig(findFunction(view.fid)); }
  else if(view.name !== 'fnEdit') state.fnEditBase = '';
  if(view.name !== 'fnDoc'){ state.fnDocText = ''; state.fnDocRead = null; state.fnDocPicks = null; }   // v3.11.28
  if(INV_FLOW.indexOf(view.name) < 0){ state.invText = ''; state.invRead = null; state.invPicks = null; state.invMatchAt = -1; state.invMatchPick = null; state.invVia = ''; }   // v3.11.30
  if(view.name !== 'plPaste' && view.name !== 'plCheck'){ state.plText = ''; state.plRead = null; state.plPicks = null; state.plOpen = {}; }   // v3.11.32
  if(view.name !== 'invPrices'){ state.psEdit = ''; state.psText = null; }   // v3.11.34
  if(view.name !== 'invHist' || view.fid !== state.view.fid){ state.prEdit = null; state.prDraft = null; }   // v3.11.35
  state.view = view; try{ history.pushState({view}, ''); }catch(e){} animate(render);
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildMessage(supplier, items, dateWord){
  const t = supplier.template;
  if(t.mode === 'freeform'){
    const first = items[0] || {name:'', qty:0, unit:''};
    const itemLines = items.map(p=>`${p.name}: ${formatQty(p.qty)} ${p.unit}`).join('\n');
    return (t.body||'')
      .replaceAll('{date}', dateWord)
      .replaceAll('{items}', itemLines)
      .replaceAll('{qty}', formatQty(first.qty))
      .replaceAll('{unit}', first.unit)
      .replaceAll('{product}', first.name);
  }
  const lines = [];
  if(t.greeting) lines.push(t.greeting);
  if(t.orderLine) lines.push(t.orderLine.replaceAll('{date}', dateWord));
  lines.push('');
  items.forEach(p=> lines.push(`${p.name}: ${formatQty(p.qty)} ${p.unit}`));
  lines.push('');
  if(t.signoff) lines.push(t.signoff);
  return lines.join('\n');
}

function buildSendLink(supplier, message, subject){
  if(supplier.contactType === 'email'){
    return `mailto:${supplier.contact}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
  } else {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const sep = isIOS ? '&' : '?';
    return `sms:${supplier.contact}${sep}body=${encodeURIComponent(message)}`;
  }
}

/* ===== Move my data (v3.11.3; Pluto Stage 4) =====
   Copy: every saved item of The Pass but the chef key, as one piece of text
   (move-data.js). Bring in: paste it, see what's in it, then it replaces this
   copy's data, keeping what was here aside. A starter copy shows only the
   welcome screen (bring in, or start from the starter list); a backup copy
   says so on every screen and asks before Send Order. */
function moveStore(){
  return {
    keys(){ const a = []; for(let i = 0; i < localStorage.length; i++) a.push(localStorage.key(i)); return a; },
    get(k){ return localStorage.getItem(k); },
    set(k, v){ localStorage.setItem(k, v); },
    remove(k){ localStorage.removeItem(k); }
  };
}
function moveSize(n){ return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

function moveCopyText(text, done){
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); done(ok);
  }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
  else fallback();
}

function attachMoveHandlers(){
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener('click', fn));
  on('[data-move-copy]', () => {
    let text;
    try{ text = MoveData.pack(MoveData.collect(moveStore()), { version: APP_VERSION, from: IN_PLUTO ? 'Pluto' : 'Chrome', role: copyRole(), at: Date.now() }); }
    catch(e){ showToast('Couldn’t read this copy’s data'); return; }
    moveCopyText(text, ok => {
      if(!ok){ showToast('Couldn’t copy. Try again'); return; }
      state.move = { copied: true, size: moveSize(text.length) };
      render();
    });
  });
  on('[data-move-check]', () => {
    const box = document.getElementById('move-paste');
    const r = MoveData.unpack(box ? box.value : '');
    state.move = r.ok ? { found: r } : { why: r.why };
    render();
  });
  on('[data-move-cancel]', () => { state.move = null; render(); });
  on('[data-move-bring]', () => {
    const f = state.move && state.move.found;
    if(!f) return;
    const r = MoveData.bringIn(moveStore(), f.data, Date.now());
    if(!r.ok){ state.move = { why: r.why }; render(); return; }
    setCopyRole('');
    try{ sessionStorage.setItem('the-pass-brought-in', '1'); }catch(e){}
    location.reload();
  });
  on('[data-move-backup]', () => {
    if(!confirm('Make this copy the backup?\n\nIt stops sending lists to the staff app, and Send Order asks first. Real orders then go from ' + (IN_PLUTO ? 'Chrome' : 'Pluto') + '.')) return;
    setCopyRole('backup');
    goto({name:'home'});
    showToast('This is the backup copy now');
  });
  on('[data-move-real]', () => {
    if(!confirm('Use this copy for real orders again?\n\nThen stop using the other copy for orders, or something gets ordered twice.')) return;
    setCopyRole('');
    state.move = null;
    render();
    refreshFromServer();
    showToast('This is the real copy again');
  });
  on('[data-move-fresh]', () => {
    if(!confirm('Start from the starter list?\n\nOnly if your data is lost for good. This copy will send its starter product list to the staff app, in place of the one there.')) return;
    setCopyRole('');
    goto({name:'home'});
    refreshFromServer();
  });
}

/* Shows what the rule actually produces, so the maths isn't a guess. */
function fnPreview(item, pax){
  if(!item || !item.label) return '';
  const q = fnQty(item, pax || 0);
  const rounded = item.kind !== 'set' && roundedPax(pax) !== Number(pax||0)
    ? ' <span class="fni-dim">(counted as '+roundedPax(pax)+')</span>' : '';
  return '<strong>'+escapeHtml(q)+'</strong> &times; '+escapeHtml(item.label)
       + ' <span class="fni-dim">&middot; '+escapeHtml(fnRuleText(item))+'</span>' + rounded;
}

function tierLabel(id){
  const tr = state.tiers.find(x => x.id === id);
  return tr ? tr.label : id;
}

function renderFunction(id){
  const f = findFunction(id);
  if(!f) return `<div class="crumb"><button data-goto="functions">&larr; Functions</button></div><div class="empty">Function not found.</div>`;

  // v3.11.25 (his picks, 23 Oct): "Add-ons" where "Mezze" was: the mezze boards, the tiramisu, and one-offs for this function only
  const addonRows = (f.mezze ? `<div class="fn-item"><span class="fn-qty">${f.mezze} &times;</span><span class="fn-label">Mezze board</span></div>` : '')
    + (f.tiramisu ? `<div class="fn-item"><span class="fn-qty">${f.tiramisu} &times;</span><span class="fn-label">Tiramisu (${f.tiramisu === 1 ? 'batch' : 'batches'})</span></div>` : '')

  const courses = sortCourses(f.courses).map(c => {
    const items = (c.items||[]).map(i => {

      return `<div class="fn-item"><span class="fn-qty">${escapeHtml(q)} &times;</span><span class="fn-label">${escapeHtml(i.label)}</span></div>`;
    }).join('');
    return `
      <div class="section-label">${escapeHtml(c.name)}${c.time?` <span class="fn-time">${escapeHtml(c.time)}</span>`:''}</div>
      <div class="card tight">${items || '<div class="empty">Nothing listed.</div>'}</div>`;
  }).join('');

  const diet = (f.dietary||[]).length
    ? `<div class="section-label">Dietary requirements</div><div class="card tight">${f.dietary.map(d=>`<div class="fn-item"><span class="fn-label">${escapeHtml(d)}</span></div>`).join('')}</div>`
    : '';

      <div class="pill-row">
        <span class="pill">${f.pax} pax</span>
        ${f.tier?`<span class="pill">${escapeHtml(tierLabel(f.tier))}</span>`:''}
        ${f.startTime?`<span class="pill">Starts ${escapeHtml(f.startTime)}</span>`:''}

    </div>

/* v3.11.28: a new function from management's doc (his order's step 2; his pick 3A, the check list
   first). He pastes the doc's text; function-reader.js reads it by its labels (no AI: what it can't
   find it says, what it isn't sure of is marked "check"; a client's phone and email are never kept);
   his taps pick the name and the head count, leave notes out, set the add-ons; "Fill the form" opens
   the New Function form filled in, the tier's courses filled the usual way. Nothing is saved before
   Save, and the pasted text is dropped as soon as it's read. */
function fdRow(st, k, v, why, extra){
  const ic = st === 'ok' ? '<span class="rd-ic ok">&#10003;</span>' : st === 'check' ? '<span class="rd-ic warn">!</span>'
    : st === 'lock' ? '<span class="rd-ic lock">&#8856;</span>' : st === 'skip' ? '<span class="rd-ic lock">&ndash;</span>' : '<span class="rd-ic miss">?</span>';
  return `<div class="rd-row${st==='lock'||st==='skip'?' rd-left':''}">${ic}<div class="rd-body"><div class="rd-k">${k}</div>${v?`<div class="rd-v">${v}</div>`:''}${why?`<div class="rd-why">${escapeHtml(why)}</div>`:''}${extra||''}</div></div>`;
}
function renderFunctionDoc(){
  const crumb = `<div class="crumb"><button data-goto="functions">&larr; Functions</button></div>`;
  if(typeof FunctionReader === 'undefined') return crumb + `<div class="empty">The doc reader didn’t load. Reload The Pass.</div>`;
  const r = state.fnDocRead;
  if(!r){
    return crumb + `
    <div class="form-card">
      <div class="fd-title">New function from a doc</div>
      <ol class="rd-steps"><li>Open the function in Google Calendar and tap its doc.</li><li>In the doc, touch and hold a word &rarr; <b>Select all</b> &rarr; <b>Copy</b>.</li><li>Come back here and paste.</li></ol>
      <textarea id="fndoc-text" class="rd-paste" rows="12" placeholder="Paste the doc here">${escapeHtml(state.fnDocText||'')}</textarea>
      <div class="rd-note">A client’s phone number and email are never kept.</div>
    </div>
    <div class="oi-actions"><button class="btn btn-ghost" data-goto="functions">Cancel</button><button class="btn" id="fndoc-read">Read it</button></div>`;
  }
  const back = `<div class="crumb"><button data-fndoc-back="1">&larr; Back to the paste</button></div>`;
  if(!r.ok) return back + `<div class="move-why">${escapeHtml(r.why)}</div><div class="oi-actions"><button class="btn" data-fndoc-back="1">Paste again</button></div>`;
  const f = r.fields, p = state.fnDocPicks || {}, c = r.counts;
  const chips = (opts, on, attr) => opts.length > 1 ? `<div class="chip-row rd-chips">${opts.map(o => `<button type="button" class="chip cat-chip ${String(o)===String(on)?'chip-on':''}" ${attr}="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}</div>` : '';
  const tier = state.tiers.find(t => t.id === f.tier.value);
  const add = f.addons.value || {}, tira = p.tiramisu != null ? p.tiramisu : add.tiramisu, mezze = p.mezze != null ? p.mezze : add.mezze;
  const num = (id, val, unit, label) => `<div class="fd-add"><span class="fd-add-name">${label}</span><span class="fni-amt"><input class="fni-num" id="${id}" value="${val}" inputmode="numeric" aria-label="How many ${label}"><span class="fni-unit">${unit}</span></span></div>`;
  const off = p.notesOff || [];
  const notes = f.notes.value.map((n, i) => `<label class="fd-note"><input type="checkbox" data-fd-note="${i}" ${off.indexOf(i) > -1 ? '' : 'checked'}><span>${escapeHtml(n)}</span></label>`).join('');
  const LEFT = { phone: 'phone number', email: 'email', address: 'address' };
  const pills = `<span class="pill">${c.ok + c.check} found</span>${c.check ? `<span class="pill pill-check">${c.check} to check</span>` : ''}${c.missing ? `<span class="pill pill-miss">${c.missing} couldn’t find</span>` : ''}`;
  return back + `
    <div class="recipe-head"><div class="recipe-eyebrow">From the doc</div><h2 class="recipe-title">${escapeHtml(p.name || 'New function')}</h2><div class="pill-row">${pills}</div></div>
    ${r.cut ? `<div class="rd-banner">This paste was very long: only the first 60,000 letters were read. Check nothing’s missing.</div>` : ''}
    <div class="card tight">
      ${fdRow(f.name.status, 'Name', escapeHtml(p.name || ''), f.name.why, chips(f.name.options || [], p.name, 'data-fd-name'))}
      ${fdRow(f.date.status, 'Date', f.date.value ? escapeHtml(FunctionReader.niceDate(f.date.value)) : '', f.date.why)}
      ${fdRow(f.startTime.status, 'Start time', escapeHtml(f.startTime.value || ''), f.startTime.why)}
      ${fdRow(f.pax.status, 'Head count', p.pax ? escapeHtml(String(p.pax)) + (f.pax.said && f.pax.said !== String(p.pax) ? ` <span class="rd-from">the doc: ${escapeHtml(f.pax.said)}</span>` : '') : '', f.pax.why, chips(f.pax.options || [], p.pax, 'data-fd-pax'))}
      ${fdRow(f.tier.status, 'Menu tier', tier ? escapeHtml(tier.label) + (f.tier.said ? ` <span class="rd-from">“${escapeHtml(f.tier.said)}”</span>` : '') : '', f.tier.why)}
      ${fdRow(f.dietary.status, 'Dietary', escapeHtml((f.dietary.value || []).join(' · ')), f.dietary.why)}
      ${fdRow(f.notes.status, 'Notes', '', f.notes.value.length ? 'Untick any you don’t want in the notes.' : f.notes.why, notes ? `<div class="fd-notes">${notes}</div>` : '')}
      ${fdRow(f.addons.status, 'Add-ons', '', f.addons.why, (tira ? num('fd-tira', tira, 'batches', 'Tiramisu') : '') + (mezze ? num('fd-mezze', mezze, 'boards', 'Mezze boards') : ''))}
      ${r.left.length ? fdRow('lock', 'Left out', `<span class="rd-small">A client’s ${r.left.map(k => LEFT[k] || k).join(' and ')}: never kept.</span>`, '') : ''}
      ${r.notRead.length ? fdRow('skip', 'Not read', `<span class="rd-small">${escapeHtml(r.notRead.join(', '))}</span>`, '') : ''}
    </div>
    <div class="oi-actions"><button class="btn btn-ghost" data-goto="functions">Cancel</button><button class="btn" id="fndoc-fill">Fill the form</button></div>`;
}

function blankFunction(){
  return { id:'', date: addDaysKey(7), name:'', pax:0, tier:'', startTime:'', dietary:[], notes:'', mezze:0, tiramisu:0, extras:[], courses:[] };
}
/* v3.11.25: a function's one-off add-ons with a name, each with a whole number (1 at least) */
function fnExtras(f){
  return (Array.isArray(f && f.extras) ? f.extras : []).filter(x => x && String(x.label||'').trim())
    .map(x => ({ id: String(x.id||''), label: String(x.label).trim(), qty: Math.max(1, parseInt(x.qty, 10) || 1) }));
}
/* v3.11.25: an add-on's row on the edit form: a switch, and its number when it's on (the mezze row's way) */
/* v3.11.36 (his ask, 24 Oct): the tiramisu add-on is in batches, about 45 portions each. A count that looks low for
   the head count is asked about on Save; his OK keeps it (a complimentary one is often less). */
const TIRA_PORTIONS = 45;
function tiraLowAsk(batches, pax){
  return batches > 0 && pax > 0 && batches * TIRA_PORTIONS < pax ? batches + (batches === 1 ? ' batch' : ' batches') + ' for ' + pax + ' people? That sounds less than usual (a batch is about ' + TIRA_PORTIONS + ' portions). Keep ' + batches + '?' : '';
}

}

/* ===== Prep screens (chef) ===== */

function renderPrep(){
  const lines = state.prepLines || [];
  const todo = lines.filter(l => !l.done);
  const done = lines.filter(l => l.done);

  const row = (l) => `
    <div class="prep-item ${l.done?'is-done':''}">
      <button class="prep-check ${l.done?'on':''}" data-tick="${escapeHtml(l.id)}" data-done="${l.done?'1':'0'}" aria-label="${l.done?'Mark not done':'Mark done'}">&#10003;</button>
      <div class="prep-body">
        <div class="prep-text">${escapeHtml(l.text)}</div>
        <div class="prep-meta">${l.done
          ? 'Completed by '+escapeHtml(l.doneBy||'someone')+(l.doneAt?' &middot; '+timeAgo(l.doneAt):'')
          : 'Added by '+escapeHtml(l.by||'someone')}</div>
      </div>
      ${l.recipe && findRecipe(l.recipe) ? `<button class="chev-btn" data-open-recipe="${escapeHtml(l.recipe)}" data-from="prep" aria-label="Open ${escapeHtml(l.text)} recipe">&rsaquo;</button>` : ''}
      ${l.done ? '' : `<button class="del-x" data-prep-remove="${escapeHtml(l.id)}" aria-label="Remove ${escapeHtml(l.text)}">&times;</button>`}
    </div>`;

  const group = (list) => {
    let out = '', lastSec = null;
    list.forEach(l => {
      const sec = l.section || 'Other';
      if(!sameSection(sec, lastSec)){ lastSec = sec; out += `<div class="sec-head">${escapeHtml(sec)}</div>`; }
      out += row(l);
    });
    return out;
  };

  /* Same ordering rule as the add screen, so a section sits in the same place
     in both and never splits into repeated headings. */
  const order = state.recipeSections;
  const todoSorted = todo.slice().sort((a,b)=>{
    const sa = a.section || 'Other', sb = b.section || 'Other';
    const ia = order.indexOf(a.section), ib = order.indexOf(b.section);
    const ra = ia < 0 ? 999 : ia, rb = ib < 0 ? 999 : ib;
    if(ra !== rb) return ra - rb;
    if(ra === 999 && !sameSection(sa, sb)) return sa.localeCompare(sb,'en',{sensitivity:'base'});
    return String(a.text||'').localeCompare(String(b.text||''),'en',{sensitivity:'base'});
  });

  return `
    <div class="crumb"><button data-goto="home">&larr; Home</button> / Prep</div>
    <div class="pub-head"><span>Prep List</span><span class="pub-meta">${todo.length} to do${done.length?' &middot; '+done.length+' done':''}</span></div>
    <div class="card tight">${todo.length ? group(todoSorted) : '<div class="empty">Nothing on the list.<br>Add something below.</div>'}</div>
    <div class="add-row"><button class="btn" data-goto="prepAdd">+ Add prep</button></div>

    ${done.length ? `
      <div class="section-label">Completed</div>
      <div class="card tight">${done.slice().reverse().map(row).join('')}</div>
      <div class="add-row"><button class="btn btn-danger" id="prep-clear-done">Clear completed</button></div>
    ` : ''}

    <div class="sync-line"><button data-goto="prepItems">Manage prep items</button></div>
  `;
}


/* The draft is a plain list of lines. Staff requests arrive pre-ticked so the
   default action is to publish what was asked for. */
function renderPrepAdd(){
  const cat = buildPrepCatalogue();
  const q = state.prepSearch.trim().toLowerCase();
  const list = q ? cat.filter(c => c.name.toLowerCase().indexOf(q) > -1) : cat;
  const onList = {};
  (state.prepLines||[]).forEach(l => { if(!l.done) onList[String(l.text).toLowerCase()] = true; });
  const picked = Object.keys(state.prepPick||{}).filter(k => state.prepPick[k]).length;

  let rows = '', lastSec = null;
  if(list.length === 0){
    rows = `<div class="empty">${cat.length ? 'Nothing matches that.' : 'No prep items yet.'}</div>`;
  } else {
    list.forEach(c => {
      const sec = c.section || 'Other';
      if(!q && !sameSection(sec, lastSec)){ lastSec = sec; rows += `<div class="sec-head">${escapeHtml(sec)}</div>`; }
      const already = onList[c.name.toLowerCase()];
      rows += `
        <div class="pick-row ${state.prepPick[c.id]?'on':''} ${already?'already':''}" ${already?'':`data-pick="${escapeHtml(c.id)}"`}>
          <span class="pick-box">&#10003;</span>
          <span class="pick-name">${escapeHtml(c.name)}</span>
          ${already?'<span class="pick-note">on the list</span>':''}
        </div>`;
    });
  }

  return `
    <div class="crumb"><button data-goto="prep">&larr; Prep</button></div>
    <h2 class="screen-title">Add prep</h2>
    <p class="screen-sub">Goes straight on the list for everyone.</p>
    <div class="search-wrap ${state.prepSearch?'filled':''}">
      <input type="text" id="prep-search" placeholder="Search prep items" value="${escapeHtml(state.prepSearch)}" autocomplete="off">
      <button class="search-clear" id="prep-search-clear" aria-label="Clear">&times;</button>

}

const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function renderPrepItems(){
  /* One list instead of two. Recipe-backed rows are read-only here and open the
     recipe; your own rows stay editable in place. */
  const own = state.prepItems.map(i => ({ kind:'own', id:i.id, name:i.name||'', section:i.section||'' }));
  const fromRecipes = state.recipes.filter(r => r.active)
    .map(r => ({ kind:'recipe', id:r.id, name:r.name||'', section:r.section||'' }));
  const all = own.concat(fromRecipes);

  const order = state.recipeSections;
  all.sort((a,b)=>{
    const sa = a.section || 'Other', sb = b.section || 'Other';
    const ia = order.indexOf(a.section), ib = order.indexOf(b.section);
    const ra = ia < 0 ? 999 : ia, rb = ib < 0 ? 999 : ib;
    if(ra !== rb) return ra - rb;
    if(ra === 999 && !sameSection(sa, sb)) return sa.localeCompare(sb,'en',{sensitivity:'base'});
    return String(a.name).localeCompare(String(b.name),'en',{sensitivity:'base'});
  });

  const ownRow = (i) => `

/* ===== Recipe import: add & update =====
   Replace-all wipes the book, and with it every hide/show setting, handy hint
   and edit made in the app - and it can change the ids the prep list points at.
   This path only adds or updates, shows every change first, and keeps each
   matched recipe's id, name, section and staff setting. */
function normRecipeName(s){ return String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,''); }

function cleanIncomingRecipe(r){
  r = r || {};
  return {
    id: String(r.id||'').trim(),
    name: String(r.name||'').trim(),
    section: String(r.section||'').trim(),
    active: r.active !== false,
    batch: String(r.batch || r.yield || '').trim(),
    ingredients: Array.isArray(r.ingredients) ? r.ingredients.map(i => ({
      qty: isFinite(Number(i && i.qty)) ? Number(i.qty) : 0,
      unit: String((i && i.unit) || 'g').trim(),
      item: String((i && i.item) || '').trim()
    })).filter(i => i.item) : [],
    method: Array.isArray(r.method) ? r.method.map(s=>String(s).trim()).filter(Boolean) : [],
    notes: String(r.notes||'').trim(),
    allergens: Array.isArray(r.allergens) ? r.allergens.map(s=>String(s).trim()).filter(Boolean) : [],
    aliases: Array.isArray(r.aliases) ? r.aliases.map(s=>String(s).trim()).filter(Boolean) : []
  };
}

function ingKey(r){
  return JSON.stringify((r.ingredients||[]).map(i =>
    [Number(i.qty)||0, String(i.unit||'').trim().toLowerCase(), String(i.item||'').trim().toLowerCase()]));
}
function methodKey(r){ return JSON.stringify((r.method||[]).map(s => String(s).trim())); }
function importSame(ex, inc){
  return ingKey(ex) === ingKey(inc) && methodKey(ex) === methodKey(inc) && (!inc.notes || inc.notes === (ex.notes||''));
}

/* Matches each incoming recipe to one already in the book: same id, then same
   name, then any alias the file lists. One book recipe can only be claimed once. */
function buildImportPreview(data){
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.recipes) ? data.recipes : []);
  const incoming = list.map(cleanIncomingRecipe).filter(r => r.name);
  const byId = {}, byName = {};
  state.recipes.forEach(r => { byId[r.id] = r; const k = normRecipeName(r.name); if(!byName[k]) byName[k] = r; });
  const claimed = {};
  const rows = incoming.map(inc => {
    let hit = null;
    const tryOne = r => { if(!hit && r && !claimed[r.id]) hit = r; };
    if(inc.id) tryOne(byId[inc.id]);
    tryOne(byName[normRecipeName(inc.name)]);
    inc.aliases.forEach(a => tryOne(byName[normRecipeName(a)]));
    if(hit) claimed[hit.id] = true;
    return { recipe: inc, target: hit ? hit.id : '', on: !(hit && importSame(hit, inc)) };
  });
  const order = (data && Array.isArray(data.sections)) ? data.sections.map(s => String(s).trim()).filter(Boolean) : [];
  return { rows: rows, sectionOrder: order };
}

function importClashes(p){
  const count = {};
  p.rows.forEach(r => { if(r.on && r.target) count[r.target] = (count[r.target]||0) + 1; });
  return count;
}

function importRowInfo(row, clashes){
  const inc = row.recipe;
  const ex = row.target ? findRecipe(row.target) : null;
  if(!ex) return { tag:'new', label:'New', text: inc.section ? 'Goes in ' + inc.section : 'New recipe' };
  if(row.on && clashes[ex.id] > 1) return { tag:'upd', label:'Clash', warn:true, text:'Another ticked row also updates "' + ex.name + '" \u2014 pick one' };
  if(importSame(ex, inc)) return { tag:'same', label:'Same', text:'Already matches "' + ex.name + '" \u2014 nothing to change' };
  const parts = [];
  if(ingKey(ex) !== ingKey(inc)) parts.push('ingredients');
  if(methodKey(ex) !== methodKey(inc)) parts.push('method');
  if(inc.notes && inc.notes !== (ex.notes||'')) parts.push(ex.notes ? 'handy hints (yours get replaced)' : 'handy hints');
  const named = normRecipeName(ex.name) === normRecipeName(inc.name) ? '' : ', keeps the name "' + ex.name + '"';
  return { tag:'upd', label:'Update', text:'Updates "' + ex.name + '"' + (parts.length ? ': ' + parts.join(', ') : '') + named };
}

  }

  const clashes = importClashes(p);
  const opts = state.recipes.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'en',{sensitivity:'base'}));
  let nNew = 0, nUpd = 0, nSame = 0, nOff = 0, nClash = 0;
  const rows = p.rows.map((row, idx) => {
    const info = importRowInfo(row, clashes);
    if(!row.on){ nOff++; if(info.tag === 'same') nSame++; }
    else if(info.warn) nClash++;
    else if(info.tag === 'new') nNew++;
    else if(info.tag === 'upd') nUpd++;
    const sel = `<select class="imp-target" data-imp-target="${idx}" aria-label="What ${escapeHtml(row.recipe.name)} does">
        <option value="" ${row.target?'':'selected'}>Add as a new recipe</option>
        ${opts.map(r => `<option value="${escapeHtml(r.id)}" ${row.target===r.id?'selected':''}>Update: ${escapeHtml(r.name)}</option>`).join('')}
      </select>`;
    return `

        <input type="checkbox" data-imp-on="${idx}" ${row.on?'checked':''} aria-label="Include ${escapeHtml(row.recipe.name)}">

          ${sel}
        </div>
      </div>`;
  }).join('');
  const todo = nNew + nUpd;
  const summary = [nNew ? nNew + ' new' : '', nUpd ? nUpd + ' to update' : '',
    nSame ? nSame + ' already the same' : '', (nOff - nSame) ? (nOff - nSame) + ' unticked' : '',
    nClash ? nClash + ' clashing' : ''].filter(Boolean).join(' \u00b7 ');

  return head + `
    <p class="screen-sub">Tick what should go in. Unticked recipes, and everything else in the book, stay exactly as they are. Updated recipes keep their name, section and staff setting.</p>
    <div class="imp-summary">${escapeHtml(p.rows.length + ' in the file: ' + (summary || 'nothing to do'))}</div>
    <div class="card tight">${rows || '<div class="empty">No recipes found in that file.</div>'}</div>
    <div class="oi-actions">
      <button class="btn btn-ghost" id="import-cancel">Cancel</button>
      <button class="btn" id="import-apply" ${todo && !nClash ? '' : 'disabled style="opacity:.45"'}>${nClash ? 'Fix clashes first' : 'Apply ' + todo + ' change' + (todo===1?'':'s')}</button>
    </div>
  `;
}

function applyImportPreview(){
  const p = state.importPreview;
  if(!p) return;
  if(Object.values(importClashes(p)).some(c => c > 1)){ showToast('Two rows update the same recipe'); return; }
  const today = localDateKey(new Date());
  let added = 0, updated = 0;
  p.rows.forEach(row => {
    if(!row.on) return;
    const inc = row.recipe;
    const ings = inc.ingredients.map(i => ({ qty: i.qty, unit: i.unit, item: i.item }));
    const ex = row.target ? findRecipe(row.target) : null;
    if(ex){
      if(importSame(ex, inc)) return;
      ex.ingredients = ings;
      ex.method = inc.method.slice();
      if(inc.notes) ex.notes = inc.notes;
      if(inc.batch) ex.batch = inc.batch;
      if(inc.allergens.length) ex.allergens = inc.allergens.slice();
      ex.updated = today;
      updated++;
    } else {
      const id = (inc.id && !findRecipe(inc.id)) ? inc.id : recipeSlug(inc.name);
      state.recipes.push({ id: id, name: inc.name, section: inc.section, active: inc.active, batch: inc.batch,
        ingredients: ings, method: inc.method.slice(), notes: inc.notes, allergens: inc.allergens.slice(), updated: today });
      added++;
    }
  });
  /* Sections the book doesn't have yet go on the end, in the file's order. */
  const missing = [];
  state.recipes.forEach(r => { if(r.section && state.recipeSections.indexOf(r.section) < 0 && missing.indexOf(r.section) < 0) missing.push(r.section); });
  const order = p.sectionOrder || [];
  missing.sort((a,b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia<0?999:ia) - (ib<0?999:ib); });
  missing.forEach(s => state.recipeSections.push(s));
  state.importPreview = null;
  state.importRaw = '';
  state.recipesLoaded = true;
  saveRecipes();
  goto({name:'recipes'});
  const bits = [added ? added + ' added' : '', updated ? updated + ' updated' : ''].filter(Boolean).join(', ');
  showToast(bits || 'Nothing changed');
}

function senderSummary(){
  const names = [];
  state.orders.forEach(o => {
    const s = (o.sender || 'Kitchen').trim();
    if(names.indexOf(s) < 0) names.push(s);
  });
  if(names.length === 0) return '';
  if(names.length === 1) return names[0];
  if(names.length === 2) return names[0] + ' and ' + names[1];
  return names.slice(0,-1).join(', ') + ' and ' + names[names.length-1];
}

function timeAgo(ts){
  const mins = Math.floor((Date.now() - ts) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return days + (days === 1 ? ' day ago' : ' days ago');
}

function lookupProduct(pid){
  for(const s of state.suppliers){
    const p = s.products.find(x => x.id === pid);
    if(p) return { product:p, supplier:s };
  }
  return null;
}

  const cards = state.orders.slice().reverse().map(o => {
    const grouped = {};
    let unknown = 0;
    Object.entries(o.items || {}).forEach(([pid, qty]) => {
      const hit = lookupProduct(pid);
      const key = hit ? hit.supplier.name : 'Not on file';
      if(!hit) unknown++;
      if(!grouped[key]) grouped[key] = [];
      grouped[key].push({ name: hit ? hit.product.name : pid, unit: hit ? hit.product.unit : '', qty: qty });
    });

    const order = state.suppliers.map(s => s.name);
    const keys = Object.keys(grouped).sort((a,b)=>{
      const ia = a === 'Not on file' ? 999 : order.indexOf(a);
      const ib = b === 'Not on file' ? 999 : order.indexOf(b);
      return ia - ib;
    });

    const body = keys.map(sup => `

        <div class="oi-group-label">${escapeHtml(sup)}</div>

    return `

  let lines = s.products.map(p => { const pl = priceLinesFor(s.id, p.id, pc); return `
    <div class="product-line">
      <div class="product-info">
        <div class="product-name">${escapeHtml(p.name)}${fresh.has(p.id) ? '<span class="pl-new">NEW</span>' : ''}</div>

        ${pl.other ? `<div class="product-else${pl.cheaper ? ' cheaper' : ''}">${escapeHtml(pl.other)}</div>` : ''}
      </div>
      <div class="stepper">
        <button data-qty-dec="${p.id}">&minus;</button>

      <button class="del-x" data-del-product="${p.id}" title="remove item">&times;</button>
    </div>
  `; }).join('');
  if(s.products.length===0) lines = `<div class="empty">No products yet for this supplier.</div>`;
  const hasQty = s.products.some(p=>p.qty>0);
  const sent = sentToday(s.id);
  const sentBanner = sent
    ? `<div class="sent-banner">
         <span><span class="sent-tick">&#10003;</span>Sent ${sentTimeLabel(sent.at)} today</span>
         <button data-unsend="${s.id}">Didn't send? Undo</button>
       </div>`
    : '';
  return `
    <div class="supplier-head">
      <div class="crumb"><button data-goto="list">&larr; Suppliers</button> / ${escapeHtml(s.name)}</div>
      ${hasQty ? `<button class="clear-btn" data-clear="${s.id}">Clear</button>` : ''}
    </div>
    ${sentBanner}
    <div class="card">${lines}</div>
    <div style="margin-top:10px;"><button class="btn btn-block" data-repeat="${s.id}">&#8635; Repeat Last Order</button></div>
    <div class="add-row"><button class="btn btn-ghost" data-goto="addProduct" data-supplier="${s.id}">+ Add Product</button></div>
    <div style="margin-top:10px;"><button class="btn btn-ghost btn-block" data-goto="supplierSettings" data-supplier="${s.id}">Settings</button></div>
    <div style="margin-top:10px;"><button class="btn btn-block" data-goto="ticket" data-supplier="${s.id}" ${hasQty?'':'disabled style="opacity:0.4"'}>Review Order &rarr;</button></div>
  `;
}

function attachHandlers(){
  document.querySelectorAll('[data-open-supplier]').forEach(el=>{
    el.addEventListener('click', ()=> goto({name:"supplier", id:el.dataset.openSupplier}));
  });
  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=>{ goto({name:el.dataset.goto, id:el.dataset.supplier, rid:el.dataset.rid, fid:el.dataset.fid}); });
  });
  document.querySelectorAll('[data-qty-inc]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = state.suppliers.find(s=>s.products.some(p=>p.id===el.dataset.qtyInc));
      const p = s.products.find(p=>p.id===el.dataset.qtyInc);
      p.qty = Math.round((p.qty+(p.inc||1))*100)/100; saveData(); render();
    });
  });
  document.querySelectorAll('[data-qty-dec]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = state.suppliers.find(s=>s.products.some(p=>p.id===el.dataset.qtyDec));
      const p = s.products.find(p=>p.id===el.dataset.qtyDec);
      p.qty = Math.max(0, Math.round((p.qty-(p.inc||1))*100)/100); saveData(); render();
    });
  });
  document.querySelectorAll('[data-qty-input]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const s = state.suppliers.find(s=>s.products.some(p=>p.id===el.dataset.qtyInput));
      const p = s.products.find(p=>p.id===el.dataset.qtyInput);
      let v = parseFloat(el.value);
      if(isNaN(v)||v<0) v = 0;
      p.qty = Math.round(v*100)/100;
      saveData(); render();
    });
  });
  document.querySelectorAll('[data-del-product]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = state.suppliers.find(s=>s.products.some(p=>p.id===el.dataset.delProduct));
      s.products = s.products.filter(p=>p.id!==el.dataset.delProduct);
      saveData(); render();
    });
  });
  document.querySelectorAll('[data-repeat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = findSupplier(el.dataset.repeat);
      const last = getLastOrder(s.id) || {};
      if(Object.keys(last).length===0){ showToast('No saved order for '+s.name+' yet'); return; }
      s.products.forEach(p=>{ p.qty = last[p.id] ? last[p.id] : 0; });
      saveData(); render(); showToast('Last order loaded');
    });
  });
  document.querySelectorAll('[data-clear]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = findSupplier(el.dataset.clear);
      s.products.forEach(p=>{ p.qty = 0; });
      saveData(); render(); showToast('Order cleared');
    });
  });
  /* Undo only removes the tick. The order itself is still in Repeat Last Order,
     which is how you get the quantities back before sending again. */
  document.querySelectorAll('[data-unsend]').forEach(el=>{
    el.addEventListener('click', ()=>{
      clearLastSent(el.dataset.unsend);
      unrecordOrderSent(el.dataset.unsend);   // v3.9.5
      render(); showToast('Marked as not sent');
    });
  });
  document.querySelectorAll('[data-cat-chip]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const field = document.getElementById('p-cat');
      if(field) field.value = el.dataset.catChip;
      document.querySelectorAll('[data-cat-chip]').forEach(c=>c.classList.remove('chip-on'));
      el.classList.add('chip-on');
    });
  });
  const catNew = document.querySelector('[data-cat-new]');
  if(catNew){
    catNew.addEventListener('click', ()=>{
      const name = (prompt('Name the new section') || '').trim().slice(0,30);
      if(!name) return;
      if(categories.indexOf(name) < 0){ categories.push(name); saveCategories(); }
      const field = document.getElementById('p-cat');
      if(field) field.value = name;
      render();
    });
  }
  document.querySelectorAll('[data-ep-sup]').forEach(el => el.addEventListener('click', ()=>{ document.querySelectorAll('[data-ep-sup]').forEach(x => x.classList.toggle('chip-on', x === el)); }));   // v3.11.33
  document.querySelectorAll('[data-unit-chip]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = document.getElementById('np-unit') || document.getElementById('ep-unit');
      if(t) t.value = el.dataset.unitChip;
    });
  });
  document.querySelectorAll('[data-edit-product]').forEach(el=>{
    el.addEventListener('click', ()=> goto({name:'editProduct', id: el.dataset.supplier, pid: el.dataset.editProduct}));
  });
  const saveEditBtn = document.querySelector('[data-save-edit]');
  if(saveEditBtn){
    saveEditBtn.addEventListener('click', ()=>{
      const s = findSupplier(saveEditBtn.dataset.supplier);
      const p = s && s.products.find(x=>x.id===saveEditBtn.dataset.saveEdit);
      if(!p) return;
      const name = document.getElementById('ep-name').value.trim();
      if(!name){ showToast('Product name required'); return; }
      p.name = name;
      p.unit = document.getElementById('ep-unit').value.trim() || 'kg';
      let inc = parseFloat(document.getElementById('ep-inc').value);
      if(!isNaN(inc) && inc > 0) p.inc = Math.round(inc*100)/100;
      const catField = document.getElementById('p-cat');
      p.cat = catField ? catField.value : (p.cat || '');
      // v3.11.33: moved to another supplier: the same item (its id), so its prices, matches and the staff app's list follow
      const toBtn = document.querySelector('[data-ep-sup].chip-on'), to = (toBtn && findSupplier(toBtn.dataset.epSup)) || s;
      if(to !== s){ s.products = s.products.filter(x => x !== p); to.products.push(p); }
      plUnmark(p.id);   // looked at: no longer NEW
      saveData();
      goto({name:'supplier', id: to.id});
      showToast(to !== s ? 'Moved to ' + to.name + (p.qty > 0 ? ', with its ' + formatQty(p.qty) + ' ' + p.unit + ' on the order' : '') : 'Product updated');
    });
  }
  document.querySelectorAll('[data-staff-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sid, day] = el.dataset.staffDay.split(':');
      const st = findStaff(sid);
      if(st){ if(!st.avail) st.avail = {}; st.avail[day] = !st.avail[day]; saveStaff(); render(); }
    });
  });
  document.querySelectorAll('[data-del-staff]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(confirm('Remove this staff member?')){
        state.staff = state.staff.filter(s=>s.id!==el.dataset.delStaff);
        saveStaff(); render();
      }
    });
  });
  const saveStaffBtn = document.querySelector('[data-save-staff]');
  if(saveStaffBtn){
    saveStaffBtn.addEventListener('click', ()=>{
      const name = document.getElementById('nst-name').value.trim();
      if(!name){ showToast('Name required'); return; }
      state.staff.push({ id: uid(), name, avail:{wed:true,thu:true,fri:true,sat:true,sun:true} });
      saveStaff(); goto({name:'staff'});
    });
  }
  document.querySelectorAll('[data-soon]').forEach(el=>{
    el.addEventListener('click', ()=> showToast('Coming in the next update'));
  });
  const rerenderKeepScroll = ()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };

  /* ---- Time boxes ----
     A phone picker hands over a whole time at once. A laptop types it a digit
     at a time and every digit counts as a change, so redrawing the screen on
     each one threw the box away after the first key. The text now follows
     every keystroke, and any redraw waits until the box is left. */
  document.querySelectorAll('.tf input[type=time]').forEach(el=>{
    el.addEventListener('keydown', ()=>{ el.dataset.typing = '1'; });
    el.addEventListener('input', ()=> syncTimeField(el));
    /* Cleared after the box's own blur handlers have had their look. */
    el.addEventListener('blur', ()=>{ setTimeout(()=>{ el.dataset.typing = ''; }, 0); });
  });
  /* Half-typed times read as blank on a laptop (the "0" of "09"), so a blank
     only counts as clearing the box once the box is left. The browser can
     report focus as elsewhere while it hops between hour and minute, so the
     key presses are what say someone is typing, not where focus sits. */
  const typingIn = (el)=> el.dataset.typing === '1';
  /* A laptop's picker stays open while the hour, minutes and am/pm are chosen
     one after another, so a redraw mid-way would shut it after the first pick.
     While the box still has focus on a laptop, the redraw waits for it to be
     left - the same as typing. */
  const laptopPicking = (el)=> !!(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches) && document.activeElement === el;
  const redrawAfterTime = (el)=>{
    if(typingIn(el) || laptopPicking(el)){
      if(el.dataset.redrawOnBlur !== '1'){
        el.dataset.redrawOnBlur = '1';
        el.addEventListener('blur', ()=> rerenderKeepScroll(), {once:true});
      }
      return;
    }
    rerenderKeepScroll();
  };
  document.querySelectorAll('[data-rweek]').forEach(el=>{
    el.addEventListener('click', ()=>{ rosterWeek = el.dataset.rweek === 'next' ? 'next' : 'this'; rosterShowAll = false; render(); });
  });
  document.querySelectorAll('[data-rday]').forEach(el=>{
    el.addEventListener('click', ()=>{ rosterDay = el.dataset.rday; rosterShowAll = false; render(); });
  });
  /* Every edit goes to whichever week is on screen. */
  const rosterDayObj = ()=>{
    const r = rosterFor(rosterWeek);
    if(!r[rosterDay]) r[rosterDay] = {};
    return r[rosterDay];
  };
  document.querySelectorAll('[data-rstart]').forEach(el=>{
    el.addEventListener('blur', ()=>{
      if(el.dataset.typing === '1' && !el.value){
        const day = rosterDayObj();
        if(day[el.dataset.rstart]){ delete day[el.dataset.rstart]; saveRoster(); }
      }
    });
    el.addEventListener('change', ()=>{
      const sid = el.dataset.rstart;
      const day = rosterDayObj();
      if(!el.value){ if(!typingIn(el)) delete day[sid]; }
      else { if(!day[sid]) day[sid] = {start:'',end:'',station:''}; day[sid].start = el.value; }
      saveRoster(); syncTimeField(el); redrawAfterTime(el);
    });
  });
  document.querySelectorAll('[data-rend]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const sid = el.dataset.rend; const day = rosterDayObj();
      if(day[sid]){ day[sid].end = el.value; saveRoster(); }
      syncTimeField(el);
    });
  });
  document.querySelectorAll('[data-rstation]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const sid = el.dataset.rstation; const day = rosterDayObj();
      if(day[sid]){ day[sid].station = el.value; saveRoster(); }
    });
  });
  document.querySelectorAll('[data-rclear]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const sid = el.dataset.rclear;
      delete rosterDayObj()[sid];
      saveRoster(); rerenderKeepScroll();
    });
  });
  const rtoggle = document.querySelector('[data-rtoggle-all]');
  if(rtoggle) rtoggle.addEventListener('click', ()=>{ rosterShowAll = !rosterShowAll; rerenderKeepScroll(); });

/* ===== Worker calls ===== */

async function fetchOrders(){
  try{
    const res = await fetch(API + '/api/orders', {cache:'no-store'});
    const data = await res.json();
    state.orders = Array.isArray(data.orders) ? data.orders : [];
    bgRender();
  }catch(e){ /* keep whatever we already had */ }
}

async function clearOrder(id, silent){
  const before = state.orders;
  state.orders = state.orders.filter(o => o.id !== id);
  try{
    const res = await fetch(API + '/api/orders/clear', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: id })
    });
    if(!res.ok) throw new Error();
    return true;
  }catch(e){
    state.orders = before;
    render();
    if(!silent) showToast('No connection. Order is still waiting.');
    else showToast('No connection. Order is still waiting.');
    return false;
  }
}

   Only in the app's tab: never in a room, never in Chrome. */
const TAB_IN_APP = !ROOM && /[?&]pluto=tab(&|$)/.test(location.search) && (function(){ try{ return !!(window.PlutoRoomHost && typeof window.PlutoRoomHost.openPluto === 'function'); }catch(e){ return false; } })();
const UPDATE_EVERY = 5 * 60 * 1000, UPDATE_RETRY = 30 * 60 * 1000;
let updateAskedAt = 0, updateTo = '', visibleAt = 0, touchedAt = 0;
function passReload(){ location.reload(); }
if(TAB_IN_APP) ['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, ()=>{ touchedAt = Date.now(); }, { capture: true, passive: true }));
function updateIdle(){
  if(document.visibilityState !== 'visible' || state.view.name !== 'home' || isEditing() || touchedAt > visibleAt) return false;
  const a = document.activeElement;
  return !(a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable));
}
async function checkForUpdate(){
  if(!TAB_IN_APP) return 'not the tab';
  if(!updateTo){
    if(Date.now() - updateAskedAt < UPDATE_EVERY) return 'asked lately';
    updateAskedAt = Date.now();
    let v = '';
    try{
      /* the address the tab opens, past the offline copy (asked as a page),
         checked with the server ("no-cache": a few bytes when nothing
         changed), so the reload then finds the copy just checked */
      const res = await fetch(location.href, { cache: 'no-cache', headers: { Accept: 'text/html' } });
      if(!res.ok) return 'no page';
      v = ((await res.text()).match(/APP_VERSION\s*=\s*'(v\d+\.\d+\.\d+)'/) || [])[1] || '';
    }catch(e){ return 'offline'; }
    if(!v || v === APP_VERSION) return 'same';
    try{ const t = JSON.parse(sessionStorage.getItem('the-pass-update-tried') || 'null'); if(t && t.to === v && Date.now() - t.at < UPDATE_RETRY) return 'tried'; }catch(e){}
    updateTo = v;
  }
  if(!updateIdle()) return 'waiting';
  try{ sessionStorage.setItem('the-pass-update-tried', JSON.stringify({ to: updateTo, at: Date.now() })); }catch(e){}
  passReload();
  return 'reloading';
}

document.addEventListener('visibilitychange', ()=>{
  if(ROOM || document.visibilityState !== 'visible') return;   // v3.11.4: a room does nothing on its own
  visibleAt = Date.now();   // v3.11.15
  // v3.9.2: another copy of The Pass may have changed the list meanwhile
  if(refreshSuppliersFromStorage()) bgRender();
  // v3.9.4: and the roster and timesheet, before the Monday roll below
  const rosterNew = refreshRosterFromStorage(), timesheetNew = refreshTimesheetFromStorage();
  if(rosterNew || timesheetNew) bgRender();
  /* A phone can keep the app alive in the background from Sunday night to
     Tuesday, so the Monday roll can't only happen on a cold start. */
  if(rollRosterWeek()) bgRender();
  refreshFromServer();
  checkForUpdate();   // v3.11.15: the app's tab only
});

if('serviceWorker' in navigator && !ROOM){   // v3.11.4: the Almo tab keeps the offline copy, not the room
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
