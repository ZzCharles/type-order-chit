<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Pass</title>
<meta name="theme-color" content="#F1EFE6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Pass">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--paper:#EDF0E1;--paper-dark:#E1E5D2;--ink:#24261F;--ink-soft:#4A4C3F;--muted:#6B6B5D;--stamp:#8B2E2E;--stamp-dark:#6E2222;--mustard:#C98A2C;--line:#c9cdb9;--card:#F7F8EF;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--paper);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,0.02) 0px,rgba(0,0,0,0.02) 1px,transparent 1px,transparent 3px);font-family:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;color:var(--ink);min-height:100vh;display:flex;justify-content:center;}
#app{width:100%;max-width:460px;min-height:100vh;padding:18px 16px 40px;position:relative;}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--ink);}
.brand h1{font-size:15px;letter-spacing:3px;text-transform:uppercase;margin:0;font-weight:700;}
.brand .tag{font-size:10px;color:var(--muted);letter-spacing:1px;}
.crumb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;flex-wrap:wrap;}
.crumb button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:2px 0;text-decoration:underline;}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 14px;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,0.04);}
.supplier-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.supplier-row:active{background:var(--paper-dark);}
.supplier-name{font-size:14px;font-weight:700;letter-spacing:0.5px;}
.supplier-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.chev{color:var(--muted);font-size:14px;}
.badge{display:inline-block;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:10px;color:var(--muted);margin-left:6px;vertical-align:middle;}
.badge.sms{border-color:var(--mustard);color:var(--mustard);}
.badge.email{border-color:var(--ink-soft);color:var(--ink-soft);}
.btn{font-family:inherit;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:9px 14px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;border-radius:2px;cursor:pointer;}
.btn:active{background:var(--ink);color:var(--paper);}
.btn-block{width:100%;}
.btn-ghost{border-color:var(--line);color:var(--muted);}
.btn-danger{border-color:var(--stamp);color:var(--stamp);}
.btn-danger:active{background:var(--stamp);color:#fff;}
.add-row{display:flex;justify-content:center;margin-top:14px;}
.product-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);}
.product-line:last-child{border-bottom:none;}
.product-info{flex:1;min-width:0;}
.product-name{font-size:13px;font-weight:600;}
.product-unit{font-size:10px;color:var(--muted);letter-spacing:0.5px;}
.stepper{display:flex;align-items:center;gap:0;}
.stepper button{width:28px;height:28px;border:1px solid var(--ink);background:var(--card);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.stepper button:first-child{border-radius:2px 0 0 2px;}
.stepper button:last-child{border-radius:0 2px 2px 0;}
.stepper button:active{background:var(--ink);color:var(--paper);}
.stepper .qty-input{width:38px;text-align:center;font-size:14px;font-weight:700;border:none;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);height:28px;background:#fff;font-family:inherit;padding:0;-webkit-appearance:none;appearance:none;border-radius:0;}
.del-x{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 4px;font-family:inherit;margin-left:4px;}
.ticket{background:var(--card);border:1px solid var(--line);padding:0;position:relative;margin-bottom:16px;clip-path:polygon(0% 0%,3% 2%,6% 0%,9% 2%,12% 0%,15% 2%,18% 0%,21% 2%,24% 0%,27% 2%,30% 0%,33% 2%,36% 0%,39% 2%,42% 0%,45% 2%,48% 0%,51% 2%,54% 0%,57% 2%,60% 0%,63% 2%,66% 0%,69% 2%,72% 0%,75% 2%,78% 0%,81% 2%,84% 0%,87% 2%,90% 0%,93% 2%,96% 0%,100% 0%,100% 100%,0% 100%);padding-top:14px;}
.ticket-inner{padding:0 16px 16px;}
.ticket-head{text-align:center;padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:10px;}
.ticket-head .who{font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;}
.ticket-head .when{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:1px;}
.ticket-line{display:flex;align-items:baseline;gap:6px;font-size:12.5px;padding:4px 0;}
.ticket-line .name{white-space:nowrap;}
.ticket-line .leader{flex:1;border-bottom:1px dotted var(--muted);margin:0 4px;transform:translateY(-3px);}
.ticket-line .qty{font-weight:700;white-space:nowrap;}
.ticket-total{display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--ink);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.date-row{display:flex;align-items:center;gap:8px;margin:4px 0 14px;font-size:12px;}
.date-row label{white-space:nowrap;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;font-size:10.5px;}
.date-row input{flex:1;font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--ink);border-radius:2px;background:#fff;}
.preview-box{background:#fff;border:1px solid var(--line);border-radius:2px;padding:10px;margin-bottom:14px;font-size:11.5px;white-space:pre-wrap;color:var(--ink-soft);max-height:180px;overflow-y:auto;}
.stamp-wrap{display:flex;justify-content:center;margin:10px 0 6px;}
.stamp{width:120px;height:120px;border:3px double var(--stamp);border-radius:50%;color:var(--stamp);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;transform:rotate(-8deg);background:transparent;cursor:pointer;transition:transform 0.15s ease;line-height:1.3;text-decoration:none;}
.stamp:active{transform:rotate(-8deg) scale(0.92);}
.stamp.sent{border-color:var(--stamp-dark);color:var(--stamp-dark);animation:thump 0.35s ease;}
@keyframes thump{0%{transform:rotate(-8deg) scale(1);}40%{transform:rotate(-8deg) scale(1.15);opacity:0.6;}100%{transform:rotate(-8deg) scale(1);}}
.fallback-note{font-size:10.5px;color:var(--muted);text-align:center;margin-top:8px;letter-spacing:0.5px;}
.form-card{background:var(--card);border:1.5px dashed var(--ink);padding:14px;margin-bottom:10px;border-radius:3px;}
.form-card label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:3px;margin-top:8px;}
.form-card input,.form-card textarea{width:100%;font-family:inherit;font-size:13px;padding:8px;border:1px solid var(--ink);border-radius:2px;background:#fff;resize:vertical;}
.hint{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);}
.toggle-row{display:flex;gap:8px;margin-top:4px;}
.toggle-btn{flex:1;font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:8px;border:1px solid var(--ink);background:var(--card);color:var(--muted);border-radius:2px;cursor:pointer;}
.toggle-btn.active{background:var(--ink);color:var(--paper);}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{font-family:inherit;font-size:10.5px;padding:5px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink-soft);cursor:pointer;}
.settings-section{margin-top:18px;padding-top:14px;border-top:1px dashed var(--ink);}
.settings-section .sec-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.form-actions{display:flex;gap:8px;margin-top:12px;}
.form-actions .btn{flex:1;}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:12px;letter-spacing:0.5px;}
textarea.copybox{width:100%;font-family:inherit;font-size:11px;padding:8px;border:1px solid var(--line);border-radius:2px;margin-top:8px;background:#fff;height:90px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:3px;font-size:11px;letter-spacing:1px;text-transform:uppercase;z-index:50;opacity:0;pointer-events:none;transition:opacity 0.2s ease;}
.toast.show{opacity:1;}
.brand-right{display:flex;align-items:center;gap:12px;}
.home-btn{background:none;border:none;color:var(--ink);cursor:pointer;padding:0;display:flex;align-items:center;font-family:inherit;}
.home-btn svg{width:20px;height:20px;display:block;}
.home-btn:active{opacity:0.5;}
.clear-btn{background:none;border:1px solid var(--stamp);color:var(--stamp);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:5px 11px;border-radius:2px;white-space:nowrap;}
.clear-btn:active{background:var(--stamp);color:#fff;}
.supplier-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.date-pick{margin:6px 0 14px;}
.date-current{font-size:10.5px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;}
.date-current span{color:var(--ink);font-weight:700;text-transform:none;font-size:13px;letter-spacing:0;}
.date-btns{display:flex;gap:8px;}
.date-btn{flex:1;font-family:inherit;font-size:10.5px;letter-spacing:0.5px;text-transform:uppercase;padding:9px 4px;border:1px solid var(--ink);background:var(--card);color:var(--ink-soft);border-radius:2px;cursor:pointer;text-align:center;position:relative;overflow:hidden;}
.date-btn.active{background:var(--ink);color:var(--paper);}
.date-btn-cal input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;cursor:pointer;}
a.btn-block{display:block;text-decoration:none;text-align:center;box-sizing:border-box;}
.home-tabs{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
.tab-card{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px 18px;cursor:pointer;font-family:inherit;box-shadow:0 1px 0 rgba(0,0,0,0.04);}
.tab-card:active{background:var(--paper-dark);}
.tab-title{font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink);}
.tab-sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:0.3px;}
.menu-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.menu-row:active{background:var(--paper-dark);}
.menu-soon{opacity:0.55;}
.soon-tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:3px 9px;white-space:nowrap;}
.staff-legend{font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.45;}
.staff-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.day-toggles{display:flex;gap:7px;}
.day-tog{flex:1;font-family:inherit;font-size:13px;font-weight:700;padding:11px 0;border:1px solid var(--ink);background:var(--card);color:var(--muted);border-radius:3px;cursor:pointer;}
.day-tog.active{background:var(--ink);color:var(--paper);}
.rday-tabs{display:flex;gap:6px;margin-bottom:14px;}
.rday-tab{flex:1;font-family:inherit;font-size:12px;font-weight:700;padding:9px 0;border:1px solid var(--ink);background:var(--card);color:var(--muted);border-radius:3px;cursor:pointer;}
.rday-tab.active{background:var(--ink);color:var(--paper);}
.rday-title{font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);margin-bottom:10px;}
.rstaff{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 13px;margin-bottom:9px;}
.rstaff-off{opacity:0.72;border-style:dashed;}
.rstaff-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.rstaff-name{font-size:14px;font-weight:700;}
.off-badge{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mustard);border:1px solid var(--mustard);border-radius:8px;padding:1px 6px;margin-left:4px;}
.rstaff-clear{background:none;border:none;color:var(--stamp);font-family:inherit;font-size:11px;text-decoration:underline;cursor:pointer;}
.rstaff-controls{display:flex;gap:10px;}
.rfield{flex:1;display:flex;flex-direction:column;gap:3px;}
.rfield span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.rfield input[type=time]{font-family:inherit;font-size:14px;padding:8px;border:1px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);}
.rstation{width:100%;margin-top:9px;font-family:inherit;font-size:13px;padding:9px 8px;border:1px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);}
.roff-divider{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;padding-top:10px;border-top:1px dashed var(--line);text-align:center;}
.ts-day{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 13px;margin-bottom:9px;}
.ts-day-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.ts-day-name{font-size:14px;font-weight:700;}
.ts-hours{font-size:12px;font-weight:700;color:var(--stamp);letter-spacing:0.3px;}
.ts-controls{display:flex;gap:10px;}
.ts-total{margin-top:14px;padding:12px 14px;background:var(--paper-dark);border:1px solid var(--ink);border-radius:4px;font-size:14px;letter-spacing:0.5px;text-align:center;text-transform:uppercase;}
.ts-total strong{color:var(--stamp);}
/* Invoices UI */
.invoice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.invoice-header .supplier-name{flex:1;min-width:0;}
.invoice-form-inline{display:flex;gap:6px;align-items:center;}
.invoice-form-inline input[type=number]{width:90px;font-family:inherit;font-size:13px;padding:6px;border:1px solid var(--ink);border-radius:4px;background:#fff;}
.invoice-entry{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;font-size:13px;}
.invoice-amount{font-weight:600;}
.invoice-del{color:var(--muted);background:none;border:none;font-size:16px;cursor:pointer;padding:0 4px;}
.invoice-supplier-total{margin-top:6px;font-weight:700;font-size:14px;border-top:1px dashed var(--line);padding-top:6px;}
.grand-total-card{padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:4px;text-align:center;margin-top:16px;font-size:15px;font-weight:700;}
.receive-order-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-top:20px; text-align:center; }
.receive-summary{ text-align:left; font-size:13px; margin:12px 0; max-height:180px; overflow-y:auto; }
.receive-actions{ display:flex; gap:8px; }
.receive-actions .btn{ flex:1; }
/* Bell icon */
.bell-btn{position:relative;background:none;border:none;color:var(--ink);cursor:pointer;padding:0;display:flex;align-items:center;font-family:inherit;}
.bell-btn svg{width:22px;height:22px;}
.bell-badge{position:absolute;top:-4px;right:-6px;width:14px;height:14px;background:var(--stamp);border-radius:50%;border:2px solid var(--paper);display:none;}
.bell-badge.show{display:block;}

/* ===== Motion =====
   View Transitions handles screen changes on browsers that have it; anywhere
   else the screen just changes instantly, which is the right fallback. */
@media (prefers-reduced-motion: no-preference){
  /* A straight cross-fade. The earlier version also slid the page, which read
     as a jerk because old and new moved in opposite directions at once. */
  ::view-transition-old(root),::view-transition-new(root){
    animation-duration:.26s;animation-timing-function:cubic-bezier(.33,0,.2,1);mix-blend-mode:normal;}
  ::view-transition-old(root){animation-name:vt-out;}
  ::view-transition-new(root){animation-name:vt-in;}
  @keyframes vt-out{to{opacity:0;}}
  @keyframes vt-in{from{opacity:0;}}
}
.btn,.tile,.tab-card,.sub-card,.icon-btn,.filter-chip,.chip,.pick-row,.recipe-row,.prep-check,.chev-btn{
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s cubic-bezier(.25,.8,.35,1),opacity .18s ease;}
.btn:active,.tile:active,.tab-card:active,.recipe-row:active{transform:scale(.99);}
.icon-btn:active,.chip:active{transform:scale(.94);}
.pick-row .pick-box{transition:background .16s ease,border-color .16s ease,color .16s ease;}
.toast{transition:opacity .2s ease,transform .2s cubic-bezier(.2,.7,.3,1);transform:translateX(-50%) translateY(6px);}
.toast.show{transform:translateX(-50%) translateY(0);}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;}
}
</style>

:root{--paper:#F1EFE6;--paper-dark:#E7E4D6;--ink:#262319;--ink-soft:#4C483D;--muted:#8A8677;--stamp:#A5372F;--stamp-dark:#8B2E2E;--mustard:#B07A22;--line:#E7E4D7;--card:#FFFFFF;}
body{font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--paper);background-image:none;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
#app{padding:16px 16px 46px;}
.brand{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;align-items:center;}
.brand h1{font-size:20px;letter-spacing:-0.3px;text-transform:none;font-weight:800;}
.brand .tag{font-size:10px;color:var(--muted);letter-spacing:0.2px;text-transform:none;}
.home-btn{color:var(--ink);}
.crumb{color:var(--muted);text-transform:none;letter-spacing:0.2px;font-size:12px;}
.crumb button{text-decoration:none;color:var(--ink-soft);font-weight:600;text-transform:none;letter-spacing:0.2px;font-size:12px;}
.crumb button:active{color:var(--stamp);}
.card,.form-card,.rstaff,.ts-day,.tab-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(38,35,25,.04),0 8px 22px rgba(38,35,25,.05);}
.supplier-row:active,.menu-row:active,.tab-card:active{background:#FBFAF4;}
.supplier-name{font-size:15px;font-weight:700;letter-spacing:0;}
.supplier-meta{color:var(--muted);}
.btn{border:none;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;letter-spacing:0.6px;padding:13px 20px;text-transform:uppercase;font-size:11px;}
.btn:active{background:#000;color:#fff;}
a.btn-block{display:block;}
.btn-ghost{background:#EDEBDF;color:#5B584C;border:none;}
.btn-ghost:active{background:#E3E0D2;color:var(--ink);}
.btn-danger{background:var(--stamp);color:#fff;border:none;}
.btn-danger:active{background:var(--stamp-dark);color:#fff;}
.clear-btn{border-radius:999px;border:1px solid var(--stamp);color:var(--stamp);padding:6px 14px;}
.clear-btn:active{background:var(--stamp);color:#fff;}
.stepper button{border:1px solid var(--line);background:#F6F5EE;color:var(--ink);}
.stepper button:first-child{border-radius:11px 0 0 11px;}
.stepper button:last-child{border-radius:0 11px 11px 0;}
.stepper button:active{background:var(--ink);color:#fff;}
.stepper .qty-input{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;font-weight:700;}
.del-x{color:var(--muted);}
.tab-title{text-transform:none;letter-spacing:0;font-size:20px;font-weight:800;}
.tab-sub{color:var(--muted);}
.badge{border-radius:999px;padding:3px 10px;border:1px solid var(--line);}
.badge.sms{border-color:#E3C79A;color:#9A6A1B;background:#FBF3E2;}
.badge.email{border-color:#DCD8C8;color:#5B584C;background:#F4F2E8;}
.day-tog,.rday-tab,.date-btn,.toggle-btn{border:1px solid var(--line);background:#F6F5EE;color:var(--ink-soft);border-radius:12px;}
.day-tog.active,.rday-tab.active,.date-btn.active,.toggle-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.chip{border:1px solid var(--line);background:#F6F5EE;color:var(--ink-soft);border-radius:999px;}
.form-card input,.form-card textarea,.rfield input[type=time],.rstation,.date-row input,.qty-input{border:1px solid var(--line);border-radius:11px;background:#fff;}
.form-card input:focus,.form-card textarea:focus,.rstation:focus,.form-card input:focus-visible{outline:none;border-color:var(--ink);}
.form-card label,.rfield span,.settings-section .sec-title,.date-current{color:var(--muted);}
.preview-box{border:1px solid var(--line);border-radius:12px;background:#FCFBF6;}
.date-current span{color:var(--ink);}
.ticket{border:1px solid var(--line);}
.ts-total{border:none;border-radius:14px;background:#EDEBDF;text-transform:none;letter-spacing:0;font-size:14px;}
.ts-day-name,.rstaff-name{font-weight:700;}
.staff-legend,.fallback-note,.empty{color:var(--muted);}
.soon-tag{border-radius:999px;}
.roff-divider{color:var(--muted);}
.toast{border-radius:999px;background:var(--ink);}
.settings-section{border-top:1px solid var(--line);}

/* ===== Orders in from staff ===== */
.bell-badge{top:-6px;right:-8px;width:auto;height:auto;min-width:17px;padding:1px 4px;border-radius:999px;background:var(--stamp);border:2px solid var(--paper);color:#fff;font-size:9.5px;font-weight:800;line-height:13px;text-align:center;}
.tab-card.tab-alert{border-color:#E8C9C4;background:#FDF5F3;}
.tab-card.tab-alert .tab-title{color:var(--stamp);}
.waiting-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FDF5F3;border:1px solid #E8C9C4;color:var(--stamp);border-radius:14px;padding:13px 16px;margin-bottom:12px;font-size:13px;font-weight:700;cursor:pointer;}
.waiting-strip:active{background:#F9E9E5;}
.waiting-strip .chev{color:var(--stamp);}
.order-in{padding:16px 16px 14px;}
.oi-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px;}
.oi-who{font-size:17px;font-weight:800;letter-spacing:-0.2px;}
.oi-when{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.oi-group{margin-top:10px;}
.oi-group-label{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding-bottom:5px;border-bottom:1px solid var(--line);}
.oi-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #F5F3EA;font-size:14px;}
.oi-line:last-child{border-bottom:none;}
.oi-qty{font-weight:700;white-space:nowrap;}
.oi-warn{margin-top:10px;font-size:12px;color:var(--stamp);line-height:1.4;}
.oi-actions{display:flex;gap:8px;margin-top:14px;}
.oi-actions .btn{flex:1;}

/* ===== Shared prep list ===== */
.prep-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #F1EFE4;}
.prep-item:last-child{border-bottom:none;}
.prep-check{flex:0 0 auto;width:26px;height:26px;margin-top:1px;border:1.5px solid var(--line);background:#F6F5EE;border-radius:8px;font-family:inherit;font-size:14px;color:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.prep-check:active{background:var(--ink);border-color:var(--ink);color:#fff;}
.prep-body{flex:1;min-width:0;}
.prep-text{font-size:15px;font-weight:600;line-height:1.35;white-space:pre-wrap;word-break:break-word;}
.prep-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.form-card textarea#prep-text{min-height:76px;font-size:15px;}
.sync-line{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px;}
.sync-line.sync-bad{color:var(--stamp);}
.sync-line .sync-warn{color:var(--mustard);font-weight:700;}
.invoice-date{font-size:11.5px;color:var(--muted);margin-left:auto;padding-right:10px;}
.key-blurb{font-size:12.5px;color:var(--muted);line-height:1.45;margin:8px 0 2px;}

/* ===== Recipes ===== */
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap input{width:100%;font-family:inherit;font-size:16px;padding:13px 40px 13px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);}
.search-wrap input:focus{outline:none;border-color:var(--ink);}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;font-family:inherit;font-size:20px;color:var(--muted);width:32px;height:32px;cursor:pointer;display:none;}
.search-wrap.filled .search-clear{display:block;}
.sec-head{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:16px 2px 7px;border-bottom:1px solid var(--line);}
.sec-head:first-child{padding-top:10px;}
.filter-row{display:flex;gap:7px;overflow-x:auto;padding:0 16px 12px;margin:0 -16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{flex:0 0 auto;font-family:inherit;font-size:12px;font-weight:700;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:6px;}
.filter-chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.fc-dot{background:#EDEBDF;color:var(--ink-soft);border-radius:999px;font-size:10px;font-weight:800;min-width:16px;padding:1px 5px;text-align:center;}
.filter-chip.on .fc-dot{background:rgba(255,255,255,.22);color:#fff;}
.card.tight{padding:4px 16px;}

.recipe-row{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid #F5F3EA;cursor:pointer;}
.recipe-row:last-child{border-bottom:none;}
.recipe-row:active{background:#FBFAF4;}
.recipe-row-main{flex:1;min-width:0;}
.recipe-row-name{font-size:15px;font-weight:600;}
.recipe-row-name.is-off{color:var(--muted);}
.off-tag{font-size:10px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--mustard);border:1px solid var(--mustard);border-radius:999px;padding:1px 6px;margin-left:4px;vertical-align:1px;}
.recipe-row-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

.recipe-head{margin-bottom:14px;}
.recipe-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px;}
.recipe-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.recipe-title{font-size:29px;font-weight:800;letter-spacing:-0.8px;margin:0;line-height:1.12;}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.pill{font-size:10.5px;font-weight:800;letter-spacing:0.7px;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:#EDEBDF;color:var(--ink-soft);}
.pill.warn{background:#F6EBDC;color:#8A5A16;}

/* switch */
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;flex:0 0 auto;}
.switch input{position:absolute;opacity:0;width:0;height:0;}
.switch-track{width:38px;height:22px;border-radius:999px;background:#DEDBCC;position:relative;transition:background .2s ease;flex:0 0 auto;}
.switch-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(38,35,25,.28);transition:transform .22s cubic-bezier(.2,.7,.3,1);}

<script>
const STORAGE_KEY = "order-chit-suppliers";
const VERSION_KEY = "order-chit-seedver";
const SEED_VERSION = "2026-07-29b";
const INVOICES_KEY = "order-chit-invoices";
const API = 'https://orders.charlesbobby253.workers.dev';
const CATALOGUE_FP_KEY = 'order-chit-catalogue-fp';
const CATS_KEY = 'order-chit-categories';
const CHEF_KEY_STORE = 'order-chit-chef-key';
const INVOICES_DIRTY_KEY = 'order-chit-invoices-dirty';
const RECIPES_KEY = 'order-chit-recipes';
const RECIPES_DIRTY_KEY = 'order-chit-recipes-dirty';
const PREPITEMS_KEY = 'order-chit-prep-items';
const HINTS_CLEARED_KEY = 'order-chit-hints-cleared';
const CAT_MIGRATION_KEY = 'order-chit-cat-migrated';

/* Categories only exist so the staff app can group its list. They show up on
   the product form, nowhere else. Edit the seed here or add one from the form. */
const CATS_SEED = ['Veggies','Protein','Dry Goods'];
let categories = CATS_SEED.slice();

/* One-time backfill for the products that already existed before categories.
   Keyed on its own flag, not SEED_VERSION, so nothing gets wiped. */
const CAT_BACKFILL = {
  p1:'Protein', p2:'Protein', p3:'Protein', p4:'Protein', p5:'Protein', p6:'Protein',
  p7:'Protein', p8:'Protein', p9:'Protein', p10:'Protein', p11:'Protein', p35:'Protein', p40:'Protein',
  p12:'Veggies', p13:'Veggies', p14:'Veggies', p15:'Veggies', p16:'Veggies', p17:'Veggies',
  p18:'Veggies', p19:'Veggies', p20:'Veggies', p21:'Veggies', p22:'Veggies', p23:'Veggies',
  p24:'Veggies', p25:'Veggies', p26:'Veggies', p27:'Veggies', p28:'Veggies', p29:'Veggies',
  p30:'Veggies', p31:'Veggies', p32:'Veggies', p33:'Veggies', p34:'Veggies',
  p36:'Dry Goods', p37:'Dry Goods', p38:'Dry Goods', p39:'Dry Goods'
};

function saveCategories(){ try{ localStorage.setItem(CATS_KEY, JSON.stringify(categories)); }catch(e){} }
function loadCategories(){
  try{
    const raw = localStorage.getItem(CATS_KEY);
    const list = raw ? JSON.parse(raw) : null;
    categories = (Array.isArray(list) && list.length) ? list : CATS_SEED.slice();
  }catch(e){ categories = CATS_SEED.slice(); }
}
function backfillCategories(){
  let done = false;
  try{ done = localStorage.getItem(CAT_MIGRATION_KEY) === '1'; }catch(e){}
  if(done) return;
  state.suppliers.forEach(s => (s.products||[]).forEach(p => {
    if(!p.cat && CAT_BACKFILL[p.id]) p.cat = CAT_BACKFILL[p.id];
  }));
  try{ localStorage.setItem(CAT_MIGRATION_KEY, '1'); }catch(e){}
  saveData();
}
function uncategorisedCount(){
  let n = 0;
  state.suppliers.forEach(s => (s.products||[]).forEach(p => { if(!p.cat) n++; }));
  return n;
}
function categoryChipsHTML(selected){
  const chips = categories.map(c =>
    `<button type="button" class="chip cat-chip ${c===selected?'chip-on':''}" data-cat-chip="${escapeHtml(c)}">${escapeHtml(c)}</button>`
  ).join('');
  return `
    <label>Section <span class="hint">— how staff see it grouped</span></label>
    <input type="hidden" id="p-cat" value="${escapeHtml(selected || '')}">
    <div class="chip-row">${chips}<button type="button" class="chip cat-chip cat-new" data-cat-new="1">+ New section</button></div>
  `;
}
let state = {
  suppliers: [], staff: [], roster: {}, timesheet: {}, invoices: {},
  orders: [],
  catalogueSynced: null,
  invoiceSync: null,
  homeOpen: null,
  recipes: [], recipeSections: [], recipeSync: null, recipesLoaded: false,
  recipeSearch: '', recipeFilter: null,
  prepItems: [],            // standalone prep items, not backed by a recipe
  prepSubs: [], published: null, prepDraft: null, prepSearch: '',
  view: {name:"home"}
};
let ticketDateWord = 'tomorrow';
let ticketDateMode = 'tomorrow';
let rosterDay = 'wed';
let rosterShowAll = false;
const ROSTER_KEY = 'order-chit-roster';
const STATIONS = ['Oven','Dough','Pasta','Toppings','KH'];
const ROSTER_DAY_KEYS = ['wed','thu','fri','sat','sun'];
const ROSTER_DAY_FULL = {wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};

/* Week runs Wednesday 00:00 to Tuesday 23:59, local time.
   Built from local date parts on purpose: toISOString() converts to UTC, which
   in Sydney means anything logged before ~10am lands in the previous week. */
function localDateKey(d){
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}
function getCurrentWeekStart(){
  const now = new Date();
  const diff = (now.getDay() - 3 + 7) % 7;
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diff);
  return localDateKey(start);
}
function todayLabel(){
  return new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
}

function saveInvoices(){
  pruneInvoiceWeeks();
  try{ localStorage.setItem(INVOICES_KEY, JSON.stringify(state.invoices)); }catch(e){}
  setDirty(true);
  scheduleInvoicePush();
}

/* Marks that this phone holds a change the cloud hasn't got yet. Without it,
   anything logged offline would be wiped by the older cloud copy on next open. */
function setDirty(v){ try{ localStorage.setItem(INVOICES_DIRTY_KEY, v ? '1' : '0'); }catch(e){} }
function isDirty(){ try{ return localStorage.getItem(INVOICES_DIRTY_KEY) === '1'; }catch(e){ return false; } }

/* Only this week and last are kept. Everything older is archived outside the
   app, so holding it here is just clutter waiting to go stale. */
function pruneInvoiceWeeks(){
  const weeks = Object.keys(state.invoices).sort();
  weeks.slice(0, -2).forEach(w => { delete state.invoices[w]; });
}

/* ---- Chef key ---- */
function getChefKey(){ try{ return localStorage.getItem(CHEF_KEY_STORE) || ''; }catch(e){ return ''; } }
function setChefKey(k){ try{ localStorage.setItem(CHEF_KEY_STORE, k); }catch(e){} }
function chefHeaders(extra){
  const h = Object.assign({}, extra || {});
  const k = getChefKey();
  if(k) h['X-Chef-Key'] = k;
  return h;
}

/* ---- Invoices in the cloud ---- */
function scheduleInvoicePush(){
  clearTimeout(scheduleInvoicePush._t);
  scheduleInvoicePush._t = setTimeout(pushInvoices, 700);
}

async function pushInvoices(){
  if(!getChefKey()){ state.invoiceSync = 'nokey'; return false; }
  const week = getCurrentWeekStart();
  try{
    const res = await fetch(API + '/api/invoices', {
      method:'POST',
      headers: chefHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ week: week, entries: state.invoices[week] || {} })
    });
    if(res.status === 401){ state.invoiceSync = 'badkey'; if(state.view.name==='invoices') render(); return false; }
    if(!res.ok) throw new Error();
    setDirty(false);
    state.invoiceSync = 'ok';
    if(state.view.name === 'invoices') render();
    return true;
  }catch(e){
    state.invoiceSync = 'offline';
    if(state.view.name === 'invoices') render();
    return false;
  }
}

async function fetchInvoices(){
  if(!getChefKey()){ state.invoiceSync = 'nokey'; return; }
  const week = getCurrentWeekStart();
  try{
    const res = await fetch(API + '/api/invoices?week=' + encodeURIComponent(week), {
      cache:'no-store', headers: chefHeaders()
    });
    if(res.status === 401){ state.invoiceSync = 'badkey'; render(); return; }
    if(res.status === 503){ state.invoiceSync = 'noworkerkey'; render(); return; }
    if(!res.ok) throw new Error();
    const data = await res.json();
    if(isDirty()){
      // this phone has unsynced changes, so it wins rather than the cloud copy
      await pushInvoices();
      return;
    }
    if(data.entries && Object.keys(data.entries).length){
      state.invoices[week] = data.entries;
      pruneInvoiceWeeks();
      try{ localStorage.setItem(INVOICES_KEY, JSON.stringify(state.invoices)); }catch(e){}
    } else if(state.invoices[week] && Object.keys(state.invoices[week]).length){
      // nothing in the cloud but something on this phone: push it up
      await pushInvoices();
      return;
    }
    state.invoiceSync = 'ok';
    render();
  }catch(e){
    state.invoiceSync = 'offline';
  }
}

/* ===== Recipes =====
   Chef-only for now: every endpoint needs the chef key, so recipes are not
   readable by anyone holding the staff app URL. Cached locally so the book
   still opens with no signal. */

function saveRecipesLocal(){
  try{ localStorage.setItem(RECIPES_KEY, JSON.stringify({recipes:state.recipes, sections:state.recipeSections})); }catch(e){}
}
function loadRecipesLocal(){
  try{
    const raw = localStorage.getItem(RECIPES_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(Array.isArray(d.recipes)) state.recipes = d.recipes;
    if(Array.isArray(d.sections)) state.recipeSections = d.sections;
    state.recipesLoaded = true;
  }catch(e){}
}
function setRecipesDirty(v){ try{ localStorage.setItem(RECIPES_DIRTY_KEY, v?'1':'0'); }catch(e){} }
function recipesDirty(){ try{ return localStorage.getItem(RECIPES_DIRTY_KEY)==='1'; }catch(e){ return false; } }

function saveRecipes(){
  sortRecipes();
  saveRecipesLocal();
  setRecipesDirty(true);
  schedulePrepCatalogue();
  clearTimeout(saveRecipes._t);
  saveRecipes._t = setTimeout(pushRecipes, 700);
}

function sortRecipes(){
  const order = state.recipeSections;
  state.recipes.sort((a,b)=>{
    const ia = order.indexOf(a.section), ib = order.indexOf(b.section);
    const sa = ia < 0 ? 999 : ia, sb = ib < 0 ? 999 : ib;
    if(sa !== sb) return sa - sb;
    return String(a.name).localeCompare(String(b.name),'en',{sensitivity:'base'});
  });
}

async function pushRecipes(){
  if(!getChefKey()){ state.recipeSync = 'nokey'; return false; }
  try{
    const res = await fetch(API + '/api/recipes', {
      method:'POST', headers: chefHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ recipes: state.recipes, sections: state.recipeSections })
    });
    if(res.status === 401){ state.recipeSync = 'badkey'; render(); return false; }
    if(!res.ok) throw new Error();
    setRecipesDirty(false);
    state.recipeSync = 'ok';
    if(state.view.name && state.view.name.indexOf('recipe') === 0) render();
    return true;
  }catch(e){
    state.recipeSync = 'offline';
    if(state.view.name && state.view.name.indexOf('recipe') === 0) render();
    return false;
  }
}

async function fetchRecipes(){
  if(!getChefKey()){ state.recipeSync = 'nokey'; return; }
  try{
    const res = await fetch(API + '/api/recipes', {cache:'no-store', headers: chefHeaders()});
    if(res.status === 401){ state.recipeSync = 'badkey'; return; }
    if(res.status === 503){ state.recipeSync = 'noworkerkey'; return; }
    if(!res.ok) throw new Error();
    if(recipesDirty()){ await pushRecipes(); return; }
    const data = await res.json();

      state.recipeSections = Array.isArray(data.sections) ? data.sections : [];

function buildPrepCatalogue(){
  const items = state.recipes.filter(r => r.active).map(r => ({
    id: 'r:' + r.id, name: r.name, section: r.section || '', recipe: r.id
  }));
  state.prepItems.forEach(i => items.push({ id: i.id, name: i.name, section: i.section || '', recipe: '' }));
  const order = state.recipeSections;
  items.sort((a,b)=>{
    const ia = order.indexOf(a.section), ib = order.indexOf(b.section);
    const sa = ia < 0 ? 999 : ia, sb = ib < 0 ? 999 : ib;
    if(sa !== sb) return sa - sb;
    return String(a.name).localeCompare(String(b.name),'en',{sensitivity:'base'});
  });
  return items;
}

/* KV can take a moment to report a tick that was only just written, so a
   background refresh could otherwise undo what you just ticked. Recent local
   ticks win over the server for a short window. */
const recentTicks = {};
/* Long enough to cover KV catching up, short enough that if someone else
   changes the same line it wins almost straight away. */
const TICK_GRACE = 12000;
function rememberTick(id, done, by){ recentTicks[id] = { done: done, by: by, at: Date.now() }; }
function applyRecentTicks(lines){
  const cutoff = Date.now() - TICK_GRACE;
  return (lines||[]).map(l => {
    const r = recentTicks[l.id];
    if(!r) return l;
    if(r.at < cutoff){ delete recentTicks[l.id]; return l; }
    if(l.done === r.done) { delete recentTicks[l.id]; return l; }
    return Object.assign({}, l, { done: r.done, doneBy: r.done ? r.by : '', doneAt: r.done ? r.at : 0 });
  });
}

async function tickPrepLine(lineId, done){
  if(!state.published) return;
  const line = state.published.lines.find(l => l.id === lineId);
  if(!line) return;
  const before = JSON.parse(JSON.stringify(state.published.lines));
  line.done = done;
  line.doneBy = done ? 'Rabindra' : '';
  line.doneAt = done ? Date.now() : 0;
  rememberTick(lineId, done, 'Rabindra');
  render();
  try{
    const res = await fetch(API + '/api/prep/published/tick', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: lineId, by: 'Rabindra', done: done })
    });
    if(!res.ok) throw new Error();
    // the optimistic update already shows the truth; don't overwrite it with a
    // read-back that KV may not have caught up with yet
    await res.json().catch(()=>({}));
  }catch(e){
    state.published.lines = before;
    render();
    showToast('No connection. Not saved.');
  }
}

async function publishPrep(lines){
  try{
    const res = await fetch(API + '/api/prep/published', {
      method:'POST', headers: chefHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ lines: lines })
    });
    if(!res.ok) throw new Error();
    // published, so the submissions it came from are done with
    await fetch(API + '/api/prep/submissions/clear', {
      method:'POST', headers: chefHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ all: true })
    }).catch(()=>{});
    state.prepDraft = null;

    showToast('No connection. Nothing was published.');
  }
}

/* An ingredient that is itself a recipe becomes a link. Garlic Blitzed is an
   ingredient in ten others, so this is the difference between "make pizza
   sauce" and "make pizza sauce, oh, first make the garlic". */
function recipeByName(name){
  const n = String(name||'').trim().toLowerCase();
  if(!n) return null;
  return state.recipes.find(r => String(r.name).trim().toLowerCase() === n) || null;
}
function subRecipesOf(r){
  const out = [];
  (r.ingredients||[]).forEach(i => {
    const hit = recipeByName(i.item);
    if(hit && hit.id !== r.id && !out.some(x => x.id === hit.id)) out.push(hit);
  });
  return out;
}
function usedByRecipes(r){
  return state.recipes.filter(x => x.id !== r.id &&
    (x.ingredients||[]).some(i => String(i.item).trim().toLowerCase() === String(r.name).trim().toLowerCase()));

function recipeSlug(name){
  const base = String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'recipe';
  let id = base, n = 2;
  while(findRecipe(id)){ id = base + '-' + n; n++; }
  return id;
}

/* Data stays in grams; this is display only. 4 kg reads better than 4000 g. */
function fmtAmount(qty, unit){
  const q = Number(qty);
  if(!isFinite(q)) return '';
  if(unit === 'g' && q >= 1000){
    const kg = q / 1000;
    return { amount: (Math.round(kg*1000)/1000).toString(), unit: 'kg' };
  }
  return { amount: (Math.round(q*1000)/1000).toString(), unit: unit || '' };
}

  used.forEach(s => { if(ordered.indexOf(s) < 0) ordered.push(s); });

}

function fmtTime(hhmm, spaced){
  if(!hhmm) return '';
  const parts = String(hhmm).split(':');
  const h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  if(isNaN(h)||isNaN(m)) return '';
  const ampm = h>=12 ? 'pm' : 'am';
  let h12 = h%12; if(h12===0) h12=12;
  const sep = spaced ? ' ' : '';
  return m===0 ? `${h12}${sep}${ampm}` : `${h12}:${String(m).padStart(2,'0')}${sep}${ampm}`;
}
function fmtTime12(hhmm){ const s = fmtTime(hhmm, true); return s.replace('am','AM').replace('pm','PM'); }
function timeFieldHTML(label, attr, id, val){
  const disp = val ? fmtTime12(val) : 'Set';
  return `<div class="rfield"><span>${label}</span><div class="tf"><span class="tf-val ${val?'':'tf-empty'}">${disp}</span><input type="time" ${attr}="${id}" value="${val||''}"></div></div>`;
}
function stationRank(s){ const i = STATIONS.indexOf(s); return i<0 ? 99 : i; }
function buildRosterText(){
  const blocks = [];
  ROSTER_DAY_KEYS.forEach(k=>{
    const entries = state.roster[k] || {};
    let scheduled = state.staff.filter(st=> entries[st.id] && entries[st.id].start);
    if(scheduled.length===0) return;
    scheduled = scheduled.slice().sort((a,b)=>{
      const ra = stationRank(entries[a.id].station), rb = stationRank(entries[b.id].station);
      if(ra!==rb) return ra-rb;
      return (entries[a.id].start||'').localeCompare(entries[b.id].start||'');
    });
    const lines = [ROSTER_DAY_FULL[k]];
    scheduled.forEach(st=>{
      const e = entries[st.id];
      const t = e.end ? `${fmtTime(e.start)} - ${fmtTime(e.end)}` : fmtTime(e.start);
      const prefix = e.station ? `${e.station}: ` : '';
      lines.push(`${prefix}${st.name} (${t})`);
    });
    blocks.push(lines.join('\n'));
  });
  return blocks.join('\n\n');
}

function rabindraId(){

  if(r) return r.id;
  return state.staff[0] ? state.staff[0].id : null;

function hoursBetween(startHHMM, endHHMM){
  if(!startHHMM || !endHHMM) return 0;
  const [sh,sm] = startHHMM.split(':').map(Number);
  const [eh,em] = endHHMM.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins < 0) mins += 24*60;
  return mins/60;
}
function fmtNum(x){ return String(parseFloat(x.toFixed(2))); }
function effectiveTs(day, rid){
  const ov = state.timesheet && state.timesheet[day];
  if(ov) return { start: ov.start||'', end: ov.end||'' };
  const rs = (state.roster[day] && rid && state.roster[day][rid] && state.roster[day][rid].start) || '';
  return { start: rs, end: rs ? '21:00' : '' };
}
function buildTimesheetText(){
  const rid = rabindraId();
  const meObj = state.staff.find(s=>s.id===rid);
  const name = meObj ? meObj.name : 'Rabindra';
  const dayLabels = [['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];
  const lines = [name+':', ''];
  let total = 0, any = false;
  dayLabels.forEach(([k,lbl])=>{
    const e = effectiveTs(k, rid);
    if(!e.start) return;
    any = true;
    if(e.end){
      const h = hoursBetween(e.start, e.end);
      total += h;
      lines.push(`${lbl}: ${fmtTime(e.start,true)} - ${fmtTime(e.end,true)} (${fmtNum(h)})`);
    } else {
      lines.push(`${lbl}: ${fmtTime(e.start,true)}`);
    }
  });
  if(!any) return '';
  lines.push('');
  lines.push(`Total hours: ${fmtNum(total)} hrs`);
  return lines.join('\n');
}

function ordinal(day){
  const suf = (day>3 && day<21) ? 'th' : ['th','st','nd','rd'][day%10 > 3 ? 0 : day%10];
  return day + suf;
}
function formatDate(d){
  return ordinal(d.getDate()) + ' ' + d.toLocaleString('en-AU', {month:'long'});
}
function nextWeekday(name){
  const names = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const target = names.indexOf(String(name||'').toLowerCase());
  if(target < 0) return null;
  const now = new Date();
  let diff = (target - now.getDay() + 7) % 7;
  if(diff === 0) diff = 7;
  const d = new Date(now);
  d.setDate(now.getDate() + diff);
  return d;
}

  const out = [];
  state.suppliers.forEach(s => (s.products||[]).forEach(p => {
    out.push({ id:p.id, name:p.name, unit:p.unit || '', inc: p.inc || 1, cat: p.cat || '' });
  }));
  return out;
}

function catalogueFingerprint(list){
  return list.map(p => p.id+'|'+p.name+'|'+p.unit+'|'+p.inc+'|'+p.cat).sort().join('~') + '||' + categories.join(',');
}

function schedulePublish(){
  clearTimeout(schedulePublish._t);
  schedulePublish._t = setTimeout(()=>{ publishCatalogue(false); }, 900);
}

async function publishCatalogue(force){
  const list = buildCatalogue();
  const fp = catalogueFingerprint(list);
  let last = null;
  try{ last = localStorage.getItem(CATALOGUE_FP_KEY); }catch(e){}
  if(!force && last === fp && state.catalogueSynced !== false) return true;

  try{
    const res = await fetch(API + '/api/catalogue', {
      method:'POST', headers: chefHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ products: list, categories: categories })
    });
    if(!res.ok) throw new Error();
    try{ localStorage.setItem(CATALOGUE_FP_KEY, fp); }catch(e){}
    const was = state.catalogueSynced;
    state.catalogueSynced = true;
    if(was === false){ showToast('Staff app updated'); render(); }
    return true;
  }catch(e){
    state.catalogueSynced = false;
    if(state.view.name === 'list') render();
    return false;
  }
}

function lastOrderKey(id){ return 'order-chit-lastorder-'+id; }
function getLastOrder(id){
  try{ const r = localStorage.getItem(lastOrderKey(id)); return r ? JSON.parse(r) : null; }
  catch(e){ return null; }
}
function saveLastOrder(supplier){
  const map = {};
  supplier.products.forEach(p=>{ if(p.qty>0) map[p.id] = p.qty; });
  try{ localStorage.setItem(lastOrderKey(supplier.id), JSON.stringify(map)); }catch(e){}
}

function showToast(msg){
  const t = document.getElementById('toast');

/* Wraps a render in a View Transition where supported, so screens cross-fade
   instead of snapping. Falls through untouched everywhere else. */
function animate(fn){
  try{
    if(document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.startViewTransition(fn);
      return;
    }
  }catch(e){}
  fn();
}

function goto(view){

  state.view = view; try{ history.pushState({view}, ''); }catch(e){} animate(render);
}
function findSupplier(id){ return state.suppliers.find(s=>s.id===id); }

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildMessage(supplier, items, dateWord){
  const t = supplier.template;
  if(t.mode === 'freeform'){
    const first = items[0] || {name:'', qty:0, unit:''};
    const itemLines = items.map(p=>`${p.name}: ${formatQty(p.qty)} ${p.unit}`).join('\n');
    return (t.body||'')
      .replaceAll('{date}', dateWord)
      .replaceAll('{items}', itemLines)
      .replaceAll('{qty}', formatQty(first.qty))
      .replaceAll('{unit}', first.unit)
      .replaceAll('{product}', first.name);
  }
  const lines = [];
  if(t.greeting) lines.push(t.greeting);
  if(t.orderLine) lines.push(t.orderLine.replaceAll('{date}', dateWord));
  lines.push('');
  items.forEach(p=> lines.push(`${p.name}: ${formatQty(p.qty)} ${p.unit}`));
  lines.push('');
  if(t.signoff) lines.push(t.signoff);
  return lines.join('\n');
}

function buildSendLink(supplier, message, subject){
  if(supplier.contactType === 'email'){
    return `mailto:${supplier.contact}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
  } else {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const sep = isIOS ? '&' : '?';
    return `sms:${supplier.contact}${sep}body=${encodeURIComponent(message)}`;
  }
}

function invoiceDate(e){
  if(e.date) return e.date;
  if(!e.timestamp) return '';
  const d = new Date(e.timestamp);

}

function prepSubSummary(){
  const names = [];
  state.prepSubs.forEach(s => { const n = (s.by||'Kitchen').trim(); if(names.indexOf(n) < 0) names.push(n); });
  if(names.length <= 1) return names[0] || '';
  if(names.length === 2) return names[0]+' and '+names[1];
  return names.slice(0,-1).join(', ')+' and '+names[names.length-1];
}

/* The draft is a plain list of lines. Staff requests arrive pre-ticked so the
   default action is to publish what was asked for. */
function ensurePrepDraft(){
  if(state.prepDraft) return state.prepDraft;
  const chosen = {};
  const extras = [];
  const cat = buildPrepCatalogue();
  const byName = {};
  cat.forEach(c => { byName[c.name.trim().toLowerCase()] = c; });

  if(state.published && state.published.lines.length){
    state.published.lines.forEach(l => {
      const hit = byName[l.text.trim().toLowerCase()];
      if(hit) chosen[hit.id] = true; else extras.push(l.text);
    });
  }
  state.prepSubs.forEach(s => {
    (s.items||[]).forEach(txt => {
      const hit = byName[String(txt).trim().toLowerCase()];
      if(hit) chosen[hit.id] = true;
      else if(extras.indexOf(txt) < 0) extras.push(txt);
    });
    if(s.note && extras.indexOf(s.note) < 0) extras.push(s.note);
  });
  state.prepDraft = { chosen: chosen, extras: extras };
  return state.prepDraft;
}

function renderPrepBuild(){
  const d = ensurePrepDraft();

  const q = state.prepSearch.trim().toLowerCase();

        <div class="form-actions"><button class="btn" id="chef-key-save">Unlock recipes</button></div>
      </div>
    `;
  }

  const q = state.recipeSearch.trim().toLowerCase();
  let list = state.recipes;
  if(q){
    list = list.filter(r => String(r.name).toLowerCase().indexOf(q) > -1);
  } else if(state.recipeFilter){
    list = list.filter(r => (r.section || 'Unsorted') === state.recipeFilter);
  }

  const secs = recipeSectionsInUse();
  const chips = secs.length > 1 && !q ? `<div class="filter-row">
      <button type="button" class="filter-chip ${state.recipeFilter?'':'on'}" data-rfilter="">All</button>
      ${secs.map(s => {
        const n = state.recipes.filter(r => (r.section||'Unsorted') === s).length;
        return `<button type="button" class="filter-chip ${state.recipeFilter===s?'on':''}" data-rfilter="${escapeHtml(s)}">${escapeHtml(s)}<span class="fc-dot">${n}</span></button>`;
      }).join('')}
    </div>` : '';

  let body;
  if(state.recipes.length === 0){
    body = `<div class="empty">No recipes yet.<br>Import them below to get started.</div>`;
  } else if(list.length === 0){
    body = `<div class="empty">Nothing matches "${escapeHtml(state.recipeSearch.trim())}".</div>`;
  } else {
    let out = '', lastSec = null;
    list.forEach(r => {
      const sec = r.section || 'Unsorted';
      if(!q && !state.recipeFilter && sec !== lastSec){ lastSec = sec; out += `<div class="sec-head">${escapeHtml(sec)}</div>`; }
      out += `
        <div class="recipe-row" data-open-recipe="${escapeHtml(r.id)}">
          <div class="recipe-row-main">
            <div class="recipe-row-name ${r.active?'':'is-off'}">${escapeHtml(r.name)}${r.active?'':' <span class="off-tag">Hidden</span>'}</div>
            ${(r.allergens||[]).length ? `<div class="recipe-row-sub">${escapeHtml(r.allergens.join(', '))}</div>` : ''}
          </div>
          <div class="chev">&rsaquo;</div>
        </div>`;
    });
    body = out;
  }

  let banner = '';
  if(state.recipeSync === 'badkey') banner = `<div class="sync-line sync-bad">That chef key was rejected. <button data-chef-reset="1">Enter it again</button></div>`;
  else if(state.recipeSync === 'noworkerkey') banner = `<div class="sync-line sync-bad">No chef key is set on the Worker yet, so nothing can sync.</div>`;
  else if(state.recipeSync === 'offline') banner = `<div class="sync-line sync-bad">Offline. Saved on this phone, not yet in the cloud.</div>`;

  const active = state.recipes.filter(r => r.active).length;

  return `
    <div class="crumb"><button data-goto="home">&larr; Home</button> / Recipes</div>
    ${banner}
    <div class="search-wrap ${state.recipeSearch?'filled':''}">
      <input type="text" id="recipe-search" placeholder="Search recipes or ingredients" value="${escapeHtml(state.recipeSearch)}" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="search-clear" id="recipe-search-clear" aria-label="Clear search">&times;</button>
    </div>
    ${chips}
    <div class="card tight">${body}</div>
    <div class="add-row"><button class="btn" data-goto="recipeEdit" data-rid="new">+ New Recipe</button></div>
    <div class="sync-line">${state.recipes.length} recipe${state.recipes.length===1?'':'s'} &middot; ${active} showing to staff once they have access &middot; <button data-goto="recipeImport">Import</button></div>
  `;
}

    const sub = recipeByName(i.item);
    const cell = sub && sub.id !== r.id
      ? `<button class="ri-link" data-open-recipe="${escapeHtml(sub.id)}" data-from="${escapeHtml(state.view.from||'recipes')}">${escapeHtml(i.item)}<span class="ri-arrow">&rsaquo;</span></button>`
      : escapeHtml(i.item);
    return `<tr><td class="ri-amt">${escapeHtml(f.amount)}<span class="ri-unit">${escapeHtml(f.unit)}</span></td><td class="ri-item">${cell}</td></tr>`;

  const subs = subRecipesOf(r);
  const subNote = subs.length
    ? `<div class="sub-note">Make first: ${subs.map(s => `<button class="sub-link" data-open-recipe="${escapeHtml(s.id)}" data-from="${escapeHtml(state.view.from||'recipes')}">${escapeHtml(s.name)}</button>`).join(' &middot; ')}</div>`

    const e = entries[st.id] || {};
    const scheduled = !!e.start;
    const stationOpts = ['<option value="">No station</option>']
      .concat(STATIONS.map(s=>`<option value="${s}" ${e.station===s?'selected':''}>${s}</option>`)).join('');

  let offHtml = '';

/* ===== Staff orders & shared prep list ===== */

function senderSummary(){
  const names = [];
  state.orders.forEach(o => {
    const s = (o.sender || 'Kitchen').trim();
    if(names.indexOf(s) < 0) names.push(s);
  });
  if(names.length === 0) return '';
  if(names.length === 1) return names[0];
  if(names.length === 2) return names[0] + ' and ' + names[1];
  return names.slice(0,-1).join(', ') + ' and ' + names[names.length-1];
}

function timeAgo(ts){
  const mins = Math.floor((Date.now() - ts) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return days + (days === 1 ? ' day ago' : ' days ago');
}

function lookupProduct(pid){
  for(const s of state.suppliers){
    const p = s.products.find(x => x.id === pid);
    if(p) return { product:p, supplier:s };
  }
  return null;
}

function renderNotifications(){
  if(state.orders.length === 0){
    return `
      <div class="crumb"><button data-goto="home">&larr; Home</button> / Orders In</div>
      <div class="empty">Nothing waiting.<br>Orders sent from Almo Orders land here.</div>
    `;
  }

  const cards = state.orders.slice().reverse().map(o => {
    const grouped = {};
    let unknown = 0;
    Object.entries(o.items || {}).forEach(([pid, qty]) => {
      const hit = lookupProduct(pid);
      const key = hit ? hit.supplier.name : 'Not on file';
      if(!hit) unknown++;
      if(!grouped[key]) grouped[key] = [];
      grouped[key].push({ name: hit ? hit.product.name : pid, unit: hit ? hit.product.unit : '', qty: qty });
    });

    const order = state.suppliers.map(s => s.name);
    const keys = Object.keys(grouped).sort((a,b)=>{
      const ia = a === 'Not on file' ? 999 : order.indexOf(a);
      const ib = b === 'Not on file' ? 999 : order.indexOf(b);
      return ia - ib;
    });

    const body = keys.map(sup => `
      <div class="oi-group">
        <div class="oi-group-label">${escapeHtml(sup)}</div>
        ${grouped[sup].map(l => `<div class="oi-line"><span>${escapeHtml(l.name)}</span><span class="oi-qty">${l.qty} ${escapeHtml(l.unit)}</span></div>`).join('')}
      </div>`).join('');

    return `
      <div class="card order-in">
        <div class="oi-head">
          <div class="oi-who">${escapeHtml(o.sender || 'Kitchen')}'s order</div>
          <div class="oi-when">${timeAgo(o.timestamp || Date.now())}</div>
        </div>
        ${body}
        ${unknown ? `<div class="oi-warn">${unknown} item${unknown===1?'':'s'} not on file — add ${unknown===1?'it':'them'} to a supplier first.</div>` : ''}
        <div class="oi-actions">
          <button class="btn btn-ghost" data-order-clear="${escapeHtml(o.id)}">Clear</button>
          <button class="btn" data-order-apply="${escapeHtml(o.id)}">Add to cart</button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="crumb"><button data-goto="home">&larr; Home</button> / Orders In</div>

  `;
}

function bindContactToggle(){
  document.querySelectorAll('[data-contact-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll('[data-contact-toggle]').forEach(b=>b.classList.remove('active'));
      el.classList.add('active');
      const type = el.dataset.contactToggle;
      const label = document.getElementById('contact-label');
      const input = document.getElementById('ns-contact') || document.getElementById('es-contact');
      if(label && input){
        if(type==='sms'){ label.textContent='Phone number'; input.placeholder='+61412345678'; input.setAttribute('inputmode','tel'); }
        else { label.textContent='Order email'; input.placeholder='orders@supplier.com.au'; input.setAttribute('inputmode','email'); }
      }
      const subjWrap = document.getElementById('subject-wrap');
      if(subjWrap) subjWrap.style.display = type==='email' ? 'block' : 'none';
    });
  });
}

function attachHandlers(){
  document.querySelectorAll('[data-open-supplier]').forEach(el=>{
    el.addEventListener('click', ()=> goto({name:"supplier", id:el.dataset.openSupplier}));
  });
  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=>{ goto({name:el.dataset.goto, id:el.dataset.supplier, rid:el.dataset.rid}); });
  });
  document.querySelectorAll('[data-qty-inc]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = state.suppliers.find(s=>s.products.some(p=>p.id===el.dataset.qtyInc));
      const p = s.products.find(p=>p.id===el.dataset.qtyInc);
      p.qty = Math.round((p.qty+(p.inc||1))*100)/100; saveData(); render();
    });
  });
  document.querySelectorAll('[data-qty-dec]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = state.suppliers.find(s=>s.products.some(p=>p.id===el.dataset.qtyDec));
      const p = s.products.find(p=>p.id===el.dataset.qtyDec);
      p.qty = Math.max(0, Math.round((p.qty-(p.inc||1))*100)/100); saveData(); render();
    });
  });
  document.querySelectorAll('[data-qty-input]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const s = state.suppliers.find(s=>s.products.some(p=>p.id===el.dataset.qtyInput));
      const p = s.products.find(p=>p.id===el.dataset.qtyInput);
      let v = parseFloat(el.value);
      if(isNaN(v)||v<0) v = 0;
      p.qty = Math.round(v*100)/100;
      saveData(); render();
    });
  });
  document.querySelectorAll('[data-del-product]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = state.suppliers.find(s=>s.products.some(p=>p.id===el.dataset.delProduct));
      s.products = s.products.filter(p=>p.id!==el.dataset.delProduct);
      saveData(); render();
    });
  });
  document.querySelectorAll('[data-repeat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = findSupplier(el.dataset.repeat);
      const last = getLastOrder(s.id) || {};
      if(Object.keys(last).length===0){ showToast('No saved order for '+s.name+' yet'); return; }
      s.products.forEach(p=>{ p.qty = last[p.id] ? last[p.id] : 0; });
      saveData(); render(); showToast('Last order loaded');
    });
  });
  document.querySelectorAll('[data-clear]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = findSupplier(el.dataset.clear);
      s.products.forEach(p=>{ p.qty = 0; });
      saveData(); render(); showToast('Order cleared');
    });
  });
  document.querySelectorAll('[data-cat-chip]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const field = document.getElementById('p-cat');
      if(field) field.value = el.dataset.catChip;
      document.querySelectorAll('[data-cat-chip]').forEach(c=>c.classList.remove('chip-on'));
      el.classList.add('chip-on');
    });
  });
  const catNew = document.querySelector('[data-cat-new]');
  if(catNew){
    catNew.addEventListener('click', ()=>{
      const name = (prompt('Name the new section') || '').trim().slice(0,30);
      if(!name) return;
      if(categories.indexOf(name) < 0){ categories.push(name); saveCategories(); }
      const field = document.getElementById('p-cat');
      if(field) field.value = name;
      render();
    });
  }
  document.querySelectorAll('[data-unit-chip]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = document.getElementById('np-unit') || document.getElementById('ep-unit');
      if(t) t.value = el.dataset.unitChip;
    });
  });
  document.querySelectorAll('[data-edit-product]').forEach(el=>{
    el.addEventListener('click', ()=> goto({name:'editProduct', id: el.dataset.supplier, pid: el.dataset.editProduct}));
  });
  const saveEditBtn = document.querySelector('[data-save-edit]');
  if(saveEditBtn){
    saveEditBtn.addEventListener('click', ()=>{
      const s = findSupplier(saveEditBtn.dataset.supplier);
      const p = s && s.products.find(x=>x.id===saveEditBtn.dataset.saveEdit);
      if(!p) return;
      const name = document.getElementById('ep-name').value.trim();
      if(!name){ showToast('Product name required'); return; }
      p.name = name;
      p.unit = document.getElementById('ep-unit').value.trim() || 'kg';
      let inc = parseFloat(document.getElementById('ep-inc').value);
      if(!isNaN(inc) && inc > 0) p.inc = Math.round(inc*100)/100;
      const catField = document.getElementById('p-cat');
      p.cat = catField ? catField.value : (p.cat || '');
      saveData();
      goto({name:'supplier', id: s.id});
      showToast('Product updated');
    });
  }
  document.querySelectorAll('[data-staff-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [sid, day] = el.dataset.staffDay.split(':');
      const st = findStaff(sid);
      if(st){ if(!st.avail) st.avail = {}; st.avail[day] = !st.avail[day]; saveStaff(); render(); }
    });
  });
  document.querySelectorAll('[data-del-staff]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(confirm('Remove this staff member?')){
        state.staff = state.staff.filter(s=>s.id!==el.dataset.delStaff);
        saveStaff(); render();
      }
    });
  });
  const saveStaffBtn = document.querySelector('[data-save-staff]');
  if(saveStaffBtn){
    saveStaffBtn.addEventListener('click', ()=>{
      const name = document.getElementById('nst-name').value.trim();
      if(!name){ showToast('Name required'); return; }
      state.staff.push({ id: uid(), name, avail:{wed:true,thu:true,fri:true,sat:true,sun:true} });
      saveStaff(); goto({name:'staff'});
    });
  }
  document.querySelectorAll('[data-soon]').forEach(el=>{
    el.addEventListener('click', ()=> showToast('Coming in the next update'));
  });
  const rerenderKeepScroll = ()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };
  document.querySelectorAll('[data-rday]').forEach(el=>{
    el.addEventListener('click', ()=>{ rosterDay = el.dataset.rday; rosterShowAll = false; render(); });
  });
  document.querySelectorAll('[data-rstart]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const sid = el.dataset.rstart;
      if(!state.roster[rosterDay]) state.roster[rosterDay] = {};
      const day = state.roster[rosterDay];
      if(!el.value){ delete day[sid]; }
      else { if(!day[sid]) day[sid] = {start:'',end:'',station:''}; day[sid].start = el.value; }
      saveRoster(); rerenderKeepScroll();
    });
  });
  document.querySelectorAll('[data-rend]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const sid = el.dataset.rend; const day = state.roster[rosterDay];
      if(day && day[sid]){ day[sid].end = el.value; saveRoster(); }
    });
  });
  document.querySelectorAll('[data-rstation]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const sid = el.dataset.rstation; const day = state.roster[rosterDay];
      if(day && day[sid]){ day[sid].station = el.value; saveRoster(); }
    });
  });
  document.querySelectorAll('[data-rclear]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const sid = el.dataset.rclear;
      if(state.roster[rosterDay]) delete state.roster[rosterDay][sid];
      saveRoster(); rerenderKeepScroll();
    });
  });
  const rtoggle = document.querySelector('[data-rtoggle-all]');
  if(rtoggle) rtoggle.addEventListener('click', ()=>{ rosterShowAll = !rosterShowAll; rerenderKeepScroll(); });
  const rpub = document.getElementById('roster-publish');
  if(rpub) rpub.addEventListener('click', ()=>{
    const text = buildRosterText();
    if(!text){ showToast('Roster is empty'); return; }
    if(navigator.share){ navigator.share({text}).catch(()=>{}); }
    else {
      navigator.clipboard.writeText(text).then(()=>showToast('Copied - share sheet not available')).catch(()=>{
        const area = document.getElementById('roster-copy-area');
        if(area){ area.style.display='block'; area.value=text; area.select(); }
        showToast('Select & copy manually');
      });
    }
  });
  const rcopy = document.getElementById('roster-copy');
  if(rcopy) rcopy.addEventListener('click', ()=>{
    const text = buildRosterText();
    if(!text){ showToast('Roster is empty'); return; }
    navigator.clipboard.writeText(text).then(()=>showToast('Roster copied')).catch(()=>{
      const area = document.getElementById('roster-copy-area');
      if(area){ area.style.display='block'; area.value=text; area.select(); }
      showToast('Select & copy manually');
    });
  });
  const rid = rabindraId();

      const day = el.dataset.tsStart;

      saveTimesheet(); rerenderKeepScroll();
    });

  document.querySelectorAll('[data-ts-end]').forEach(el=>{

      const day = el.dataset.tsEnd;
      const cur = effectiveTs(day, rid);
      state.timesheet[day] = { start: cur.start, end: el.value };
      saveTimesheet(); rerenderKeepScroll();

      navigator.clipboard.writeText(text).then(()=>showToast('Copied - share sheet not available')).catch(()=>{
        const area = document.getElementById('ts-copy-area');
        if(area){ area.style.display='block'; area.value=text; area.select(); }
        showToast('Select & copy manually');
      });

    const text = buildTimesheetText();

      const area = document.getElementById('ts-copy-area');
      if(area){ area.style.display='block'; area.value=text; area.select(); }
      showToast('Select & copy manually');
    });
  });
  const tsReset = document.getElementById('ts-reset');
  if(tsReset) tsReset.addEventListener('click', ()=>{
    if(confirm('Reset the timesheet to match your current roster? This clears your adjustments.')){
      state.timesheet = {}; saveTimesheet(); render(); showToast('Reset to roster');
    }
  });
  bindContactToggle();

  const saveSupBtn = document.querySelector('[data-save-supplier]');
  if(saveSupBtn){
    saveSupBtn.addEventListener('click', ()=>{
      const name = document.getElementById('ns-name').value.trim();
      const contact = document.getElementById('ns-contact').value.trim();
      const address = document.getElementById('ns-address').value.trim();
      const activeToggle = document.querySelector('[data-contact-toggle].active');
      const contactType = activeToggle ? activeToggle.dataset.contactToggle : 'sms';

      saveData();
      goto({name:"list"});

  function refreshTicket(){
    const s = findSupplier(state.view.id);
    if(!s) return;
    const items = s.products.filter(p=>p.qty>0);
    const msg = buildMessage(s, items, ticketDateWord);
    const disp = document.getElementById('date-word-display');
    if(disp) disp.textContent = ticketDateWord;
    const prev = document.getElementById('msg-preview');
    if(prev) prev.textContent = msg;
    const stamp = document.getElementById('send-stamp');
    if(stamp){
      const subject = (s.template.subject||'').replaceAll('{date}', ticketDateWord);
      stamp.setAttribute('href', buildSendLink(s, msg, subject));
    }
    document.querySelectorAll('[data-date-mode]').forEach(b=>{
      b.classList.toggle('active', b.dataset.dateMode===ticketDateMode);
    });
  }
  const tomBtn = document.querySelector('[data-date-mode="tomorrow"]');
  if(tomBtn) tomBtn.addEventListener('click', ()=>{

  if(nextBtn) nextBtn.addEventListener('click', ()=>{
