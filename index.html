<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Pass</title>
<meta name="theme-color" content="#F1EFE6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Pass">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--paper:#EDF0E1;--paper-dark:#E1E5D2;--ink:#24261F;--ink-soft:#4A4C3F;--muted:#6B6B5D;--stamp:#8B2E2E;--stamp-dark:#6E2222;--mustard:#C98A2C;--line:#c9cdb9;--card:#F7F8EF;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--paper);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,0.02) 0px,rgba(0,0,0,0.02) 1px,transparent 1px,transparent 3px);font-family:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;color:var(--ink);min-height:100vh;display:flex;justify-content:center;}
#app{width:100%;max-width:460px;min-height:100vh;padding:18px 16px 40px;position:relative;}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--ink);}
.brand h1{font-size:15px;letter-spacing:3px;text-transform:uppercase;margin:0;font-weight:700;}
.brand .tag{font-size:10px;color:var(--muted);letter-spacing:1px;}
.crumb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;flex-wrap:wrap;}
.crumb button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:2px 0;text-decoration:underline;}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 14px;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,0.04);}
.supplier-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.supplier-row:active{background:var(--paper-dark);}
.supplier-name{font-size:14px;font-weight:700;letter-spacing:0.5px;}
.supplier-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.chev{color:var(--muted);font-size:14px;}
.badge{display:inline-block;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:10px;color:var(--muted);margin-left:6px;vertical-align:middle;}
.badge.sms{border-color:var(--mustard);color:var(--mustard);}
.badge.email{border-color:var(--ink-soft);color:var(--ink-soft);}
.btn{font-family:inherit;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:9px 14px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;border-radius:2px;cursor:pointer;}
.btn:active{background:var(--ink);color:var(--paper);}
.btn-block{width:100%;}
.btn-ghost{border-color:var(--line);color:var(--muted);}
.btn-danger{border-color:var(--stamp);color:var(--stamp);}
.btn-danger:active{background:var(--stamp);color:#fff;}
.add-row{display:flex;justify-content:center;margin-top:14px;}
.product-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);}
.product-line:last-child{border-bottom:none;}
.product-info{flex:1;min-width:0;}
.product-name{font-size:13px;font-weight:600;}
.product-unit{font-size:10px;color:var(--muted);letter-spacing:0.5px;}
.stepper{display:flex;align-items:center;gap:0;}
.stepper button{width:28px;height:28px;border:1px solid var(--ink);background:var(--card);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.stepper button:first-child{border-radius:2px 0 0 2px;}
.stepper button:last-child{border-radius:0 2px 2px 0;}
.stepper button:active{background:var(--ink);color:var(--paper);}
.stepper .qty-input{width:38px;text-align:center;font-size:14px;font-weight:700;border:none;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);height:28px;background:#fff;font-family:inherit;padding:0;-webkit-appearance:none;appearance:none;border-radius:0;}
.del-x{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 4px;font-family:inherit;margin-left:4px;}
.ticket{background:var(--card);border:1px solid var(--line);padding:0;position:relative;margin-bottom:16px;clip-path:polygon(0% 0%,3% 2%,6% 0%,9% 2%,12% 0%,15% 2%,18% 0%,21% 2%,24% 0%,27% 2%,30% 0%,33% 2%,36% 0%,39% 2%,42% 0%,45% 2%,48% 0%,51% 2%,54% 0%,57% 2%,60% 0%,63% 2%,66% 0%,69% 2%,72% 0%,75% 2%,78% 0%,81% 2%,84% 0%,87% 2%,90% 0%,93% 2%,96% 0%,100% 0%,100% 100%,0% 100%);padding-top:14px;}
.ticket-inner{padding:0 16px 16px;}
.ticket-head{text-align:center;padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:10px;}
.ticket-head .who{font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;}
.ticket-head .when{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:1px;}
.ticket-line{display:flex;align-items:baseline;gap:6px;font-size:12.5px;padding:4px 0;}
.ticket-line .name{white-space:nowrap;}
.ticket-line .leader{flex:1;border-bottom:1px dotted var(--muted);margin:0 4px;transform:translateY(-3px);}
.ticket-line .qty{font-weight:700;white-space:nowrap;}
.ticket-total{display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--ink);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.date-row{display:flex;align-items:center;gap:8px;margin:4px 0 14px;font-size:12px;}
.date-row label{white-space:nowrap;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;font-size:10.5px;}
.date-row input{flex:1;font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--ink);border-radius:2px;background:#fff;}
.preview-box{background:#fff;border:1px solid var(--line);border-radius:2px;padding:10px;margin-bottom:14px;font-size:11.5px;white-space:pre-wrap;color:var(--ink-soft);max-height:180px;overflow-y:auto;}
.stamp-wrap{display:flex;justify-content:center;margin:10px 0 6px;}
.stamp{width:120px;height:120px;border:3px double var(--stamp);border-radius:50%;color:var(--stamp);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;transform:rotate(-8deg);background:transparent;cursor:pointer;transition:transform 0.15s ease;line-height:1.3;text-decoration:none;}
.stamp:active{transform:rotate(-8deg) scale(0.92);}
.stamp.sent{border-color:var(--stamp-dark);color:var(--stamp-dark);animation:thump 0.35s ease;}
@keyframes thump{0%{transform:rotate(-8deg) scale(1);}40%{transform:rotate(-8deg) scale(1.15);opacity:0.6;}100%{transform:rotate(-8deg) scale(1);}}
.fallback-note{font-size:10.5px;color:var(--muted);text-align:center;margin-top:8px;letter-spacing:0.5px;}
.form-card{background:var(--card);border:1.5px dashed var(--ink);padding:14px;margin-bottom:10px;border-radius:3px;}
.form-card label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:3px;margin-top:8px;}
.form-card input,.form-card textarea{width:100%;font-family:inherit;font-size:13px;padding:8px;border:1px solid var(--ink);border-radius:2px;background:#fff;resize:vertical;}
.hint{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);}
.toggle-row{display:flex;gap:8px;margin-top:4px;}
.toggle-btn{flex:1;font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:8px;border:1px solid var(--ink);background:var(--card);color:var(--muted);border-radius:2px;cursor:pointer;}
.toggle-btn.active{background:var(--ink);color:var(--paper);}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{font-family:inherit;font-size:10.5px;padding:5px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink-soft);cursor:pointer;}
.settings-section{margin-top:18px;padding-top:14px;border-top:1px dashed var(--ink);}
.settings-section .sec-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.form-actions{display:flex;gap:8px;margin-top:12px;}
.form-actions .btn{flex:1;}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:12px;letter-spacing:0.5px;}
textarea.copybox{width:100%;font-family:inherit;font-size:11px;padding:8px;border:1px solid var(--line);border-radius:2px;margin-top:8px;background:#fff;height:90px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:3px;font-size:11px;letter-spacing:1px;text-transform:uppercase;z-index:50;opacity:0;pointer-events:none;transition:opacity 0.2s ease;}
.toast.show{opacity:1;}
.brand-right{display:flex;align-items:center;gap:12px;}
.home-btn{background:none;border:none;color:var(--ink);cursor:pointer;padding:0;display:flex;align-items:center;font-family:inherit;}
.home-btn svg{width:20px;height:20px;display:block;}
.home-btn:active{opacity:0.5;}
.clear-btn{background:none;border:1px solid var(--stamp);color:var(--stamp);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:5px 11px;border-radius:2px;white-space:nowrap;}
.clear-btn:active{background:var(--stamp);color:#fff;}
.supplier-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.date-pick{margin:6px 0 14px;}
.date-current{font-size:10.5px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;}
.date-current span{color:var(--ink);font-weight:700;text-transform:none;font-size:13px;letter-spacing:0;}
.date-btns{display:flex;gap:8px;}
.date-btn{flex:1;font-family:inherit;font-size:10.5px;letter-spacing:0.5px;text-transform:uppercase;padding:9px 4px;border:1px solid var(--ink);background:var(--card);color:var(--ink-soft);border-radius:2px;cursor:pointer;text-align:center;position:relative;overflow:hidden;}
.date-btn.active{background:var(--ink);color:var(--paper);}
.date-btn-cal input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;cursor:pointer;}
a.btn-block{display:block;text-decoration:none;text-align:center;box-sizing:border-box;}
.home-tabs{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
.tab-card{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px 18px;cursor:pointer;font-family:inherit;box-shadow:0 1px 0 rgba(0,0,0,0.04);}
.tab-card:active{background:var(--paper-dark);}
.tab-title{font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink);}
.tab-sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:0.3px;}
.menu-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.menu-row:active{background:var(--paper-dark);}
.menu-soon{opacity:0.55;}
.soon-tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:3px 9px;white-space:nowrap;}
.staff-legend{font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.45;}
.staff-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.day-toggles{display:flex;gap:7px;}
.day-tog{flex:1;font-family:inherit;font-size:13px;font-weight:700;padding:11px 0;border:1px solid var(--ink);background:var(--card);color:var(--muted);border-radius:3px;cursor:pointer;}
.day-tog.active{background:var(--ink);color:var(--paper);}
.rday-tabs{display:flex;gap:6px;margin-bottom:14px;}
.rday-tab{flex:1;font-family:inherit;font-size:12px;font-weight:700;padding:9px 0;border:1px solid var(--ink);background:var(--card);color:var(--muted);border-radius:3px;cursor:pointer;}
.rday-tab.active{background:var(--ink);color:var(--paper);}
.rday-title{font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);margin-bottom:10px;}
.rstaff{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 13px;margin-bottom:9px;}
.rstaff-off{opacity:0.72;border-style:dashed;}
.rstaff-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.rstaff-name{font-size:14px;font-weight:700;}
.off-badge{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mustard);border:1px solid var(--mustard);border-radius:8px;padding:1px 6px;margin-left:4px;}
.rstaff-clear{background:none;border:none;color:var(--stamp);font-family:inherit;font-size:11px;text-decoration:underline;cursor:pointer;}
.rstaff-controls{display:flex;gap:10px;}
.rfield{flex:1;display:flex;flex-direction:column;gap:3px;}
.rfield span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.rfield input[type=time]{font-family:inherit;font-size:14px;padding:8px;border:1px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);}
.rstation{width:100%;margin-top:9px;font-family:inherit;font-size:13px;padding:9px 8px;border:1px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);}
.roff-divider{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;padding-top:10px;border-top:1px dashed var(--line);text-align:center;}
.ts-day{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 13px;margin-bottom:9px;}
.ts-day-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.ts-day-name{font-size:14px;font-weight:700;}
.ts-hours{font-size:12px;font-weight:700;color:var(--stamp);letter-spacing:0.3px;}
.ts-controls{display:flex;gap:10px;}
.ts-total{margin-top:14px;padding:12px 14px;background:var(--paper-dark);border:1px solid var(--ink);border-radius:4px;font-size:14px;letter-spacing:0.5px;text-align:center;text-transform:uppercase;}
.ts-total strong{color:var(--stamp);}
/* Invoices UI */
.invoice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.invoice-header .supplier-name{flex:1;min-width:0;}
.invoice-form-inline{display:flex;gap:6px;align-items:center;}
.invoice-form-inline input[type=number]{width:90px;font-family:inherit;font-size:13px;padding:6px;border:1px solid var(--ink);border-radius:4px;background:#fff;}
.invoice-entry{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;font-size:13px;}
.invoice-amount{font-weight:600;}
.invoice-del{color:var(--muted);background:none;border:none;font-size:16px;cursor:pointer;padding:0 4px;}
.invoice-supplier-total{margin-top:6px;font-weight:700;font-size:14px;border-top:1px dashed var(--line);padding-top:6px;}
.grand-total-card{padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:4px;text-align:center;margin-top:16px;font-size:15px;font-weight:700;}
.receive-order-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-top:20px; text-align:center; }
.receive-summary{ text-align:left; font-size:13px; margin:12px 0; max-height:180px; overflow-y:auto; }
.receive-actions{ display:flex; gap:8px; }
.receive-actions .btn{ flex:1; }
/* Bell icon */
.bell-btn{position:relative;background:none;border:none;color:var(--ink);cursor:pointer;padding:0;display:flex;align-items:center;font-family:inherit;}
.bell-btn svg{width:22px;height:22px;}
.bell-badge{position:absolute;top:-4px;right:-6px;width:14px;height:14px;background:var(--stamp);border-radius:50%;border:2px solid var(--paper);display:none;}
.bell-badge.show{display:block;}

/* ===== Motion =====
   View Transitions handles screen changes on browsers that have it; anywhere
   else the screen just changes instantly, which is the right fallback. */
@media (prefers-reduced-motion: no-preference){
  /* A straight cross-fade. The earlier version also slid the page, which read
     as a jerk because old and new moved in opposite directions at once. */
  ::view-transition-old(root),::view-transition-new(root){
    animation-duration:.26s;animation-timing-function:cubic-bezier(.33,0,.2,1);mix-blend-mode:normal;}
  ::view-transition-old(root){animation-name:vt-out;}
  ::view-transition-new(root){animation-name:vt-in;}
  @keyframes vt-out{to{opacity:0;}}
  @keyframes vt-in{from{opacity:0;}}
}
.btn,.tile,.tab-card,.sub-card,.icon-btn,.filter-chip,.chip,.pick-row,.recipe-row,.prep-check,.chev-btn{
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s cubic-bezier(.25,.8,.35,1),opacity .18s ease;}
.btn:active,.tile:active,.tab-card:active,.recipe-row:active{transform:scale(.99);}
.icon-btn:active,.chip:active{transform:scale(.94);}
.pick-row .pick-box{transition:background .16s ease,border-color .16s ease,color .16s ease;}
.toast{transition:opacity .2s ease,transform .2s cubic-bezier(.2,.7,.3,1);transform:translateX(-50%) translateY(6px);}
.toast.show{transform:translateX(-50%) translateY(0);}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;}
}
</style>

<style>
/* ===== The Pass - v2.0 Soft Paper ===== */
:root{--paper:#F1EFE6;--paper-dark:#E7E4D6;--ink:#262319;--ink-soft:#4C483D;--muted:#8A8677;--stamp:#A5372F;--stamp-dark:#8B2E2E;--mustard:#B07A22;--line:#E7E4D7;--card:#FFFFFF;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--paper);background-image:none;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
#app{padding:16px 16px 46px;}

.brand h1{font-size:20px;letter-spacing:-0.3px;text-transform:none;font-weight:800;}
.brand .tag{font-size:10px;color:var(--muted);letter-spacing:0.2px;text-transform:none;}
.home-btn{color:var(--ink);}

.supplier-row:active,.menu-row:active,.tab-card:active{background:#FBFAF4;}
.supplier-name{font-size:15px;font-weight:700;letter-spacing:0;}

.btn{border:none;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;letter-spacing:0.6px;padding:13px 20px;text-transform:uppercase;font-size:11px;}
.btn:active{background:#000;color:#fff;}
a.btn-block{display:block;}
.btn-ghost{background:#EDEBDF;color:#5B584C;border:none;}
.btn-ghost:active{background:#E3E0D2;color:var(--ink);}
.btn-danger{background:var(--stamp);color:#fff;border:none;}
.btn-danger:active{background:var(--stamp-dark);color:#fff;}
.clear-btn{border-radius:999px;border:1px solid var(--stamp);color:var(--stamp);padding:6px 14px;}
.clear-btn:active{background:var(--stamp);color:#fff;}
.stepper button{border:1px solid var(--line);background:#F6F5EE;color:var(--ink);}
.stepper button:first-child{border-radius:11px 0 0 11px;}
.stepper button:last-child{border-radius:0 11px 11px 0;}
.stepper button:active{background:var(--ink);color:#fff;}
.stepper .qty-input{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;font-weight:700;}
.del-x{color:var(--muted);}
.tab-title{text-transform:none;letter-spacing:0;font-size:20px;font-weight:800;}
.tab-sub{color:var(--muted);}
.badge{border-radius:999px;padding:3px 10px;border:1px solid var(--line);}
.badge.sms{border-color:#E3C79A;color:#9A6A1B;background:#FBF3E2;}
.badge.email{border-color:#DCD8C8;color:#5B584C;background:#F4F2E8;}
.day-tog,.rday-tab,.date-btn,.toggle-btn{border:1px solid var(--line);background:#F6F5EE;color:var(--ink-soft);border-radius:12px;}
.day-tog.active,.rday-tab.active,.date-btn.active,.toggle-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.chip{border:1px solid var(--line);background:#F6F5EE;color:var(--ink-soft);border-radius:999px;}
.form-card input,.form-card textarea,.rfield input[type=time],.rstation,.date-row input,.qty-input{border:1px solid var(--line);border-radius:11px;background:#fff;}
.form-card input:focus,.form-card textarea:focus,.rstation:focus,.form-card input:focus-visible{outline:none;border-color:var(--ink);}
.form-card label,.rfield span,.settings-section .sec-title,.date-current{color:var(--muted);}
.preview-box{border:1px solid var(--line);border-radius:12px;background:#FCFBF6;}
.date-current span{color:var(--ink);}
.ticket{border:1px solid var(--line);}
.ts-total{border:none;border-radius:14px;background:#EDEBDF;text-transform:none;letter-spacing:0;font-size:14px;}
.ts-day-name,.rstaff-name{font-weight:700;}
.staff-legend,.fallback-note,.empty{color:var(--muted);}
.soon-tag{border-radius:999px;}
.roff-divider{color:var(--muted);}
.toast{border-radius:999px;background:var(--ink);}
.settings-section{border-top:1px solid var(--line);}

/* ===== Orders in from staff ===== */
.bell-badge{top:-6px;right:-8px;width:auto;height:auto;min-width:17px;padding:1px 4px;border-radius:999px;background:var(--stamp);border:2px solid var(--paper);color:#fff;font-size:9.5px;font-weight:800;line-height:13px;text-align:center;}
.tab-card.tab-alert{border-color:#E8C9C4;background:#FDF5F3;}
.tab-card.tab-alert .tab-title{color:var(--stamp);}
.waiting-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FDF5F3;border:1px solid #E8C9C4;color:var(--stamp);border-radius:14px;padding:13px 16px;margin-bottom:12px;font-size:13px;font-weight:700;cursor:pointer;}
.waiting-strip:active{background:#F9E9E5;}
.waiting-strip .chev{color:var(--stamp);}
.order-in{padding:16px 16px 14px;}
.oi-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px;}
.oi-who{font-size:17px;font-weight:800;letter-spacing:-0.2px;}
.oi-when{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.oi-group{margin-top:10px;}
.oi-group-label{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding-bottom:5px;border-bottom:1px solid var(--line);}
.oi-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #F5F3EA;font-size:14px;}
.oi-line:last-child{border-bottom:none;}
.oi-qty{font-weight:700;white-space:nowrap;}
.oi-warn{margin-top:10px;font-size:12px;color:var(--stamp);line-height:1.4;}
.oi-actions{display:flex;gap:8px;margin-top:14px;}
.oi-actions .btn{flex:1;}

/* ===== Shared prep list ===== */
.prep-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #F1EFE4;}
.prep-item:last-child{border-bottom:none;}
.prep-check{flex:0 0 auto;width:26px;height:26px;margin-top:1px;border:1.5px solid var(--line);background:#F6F5EE;border-radius:8px;font-family:inherit;font-size:14px;color:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.prep-check:active{background:var(--ink);border-color:var(--ink);color:#fff;}
.prep-body{flex:1;min-width:0;}
.prep-text{font-size:15px;font-weight:600;line-height:1.35;white-space:pre-wrap;word-break:break-word;}
.prep-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.form-card textarea#prep-text{min-height:76px;font-size:15px;}
.sync-line{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px;}
.sync-line.sync-bad{color:var(--stamp);}
.sync-line .sync-warn{color:var(--mustard);font-weight:700;}
.invoice-date{font-size:11.5px;color:var(--muted);margin-left:auto;padding-right:10px;}
.key-blurb{font-size:12.5px;color:var(--muted);line-height:1.45;margin:8px 0 2px;}

/* ===== Recipes ===== */
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap input{width:100%;font-family:inherit;font-size:16px;padding:13px 40px 13px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);}
.search-wrap input:focus{outline:none;border-color:var(--ink);}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;font-family:inherit;font-size:20px;color:var(--muted);width:32px;height:32px;cursor:pointer;display:none;}
.search-wrap.filled .search-clear{display:block;}
.sec-head{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:16px 2px 7px;border-bottom:1px solid var(--line);}
.sec-head:first-child{padding-top:10px;}
.filter-row{display:flex;gap:7px;overflow-x:auto;padding:0 16px 12px;margin:0 -16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{flex:0 0 auto;font-family:inherit;font-size:12px;font-weight:700;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:6px;}
.filter-chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.fc-dot{background:#EDEBDF;color:var(--ink-soft);border-radius:999px;font-size:10px;font-weight:800;min-width:16px;padding:1px 5px;text-align:center;}
.filter-chip.on .fc-dot{background:rgba(255,255,255,.22);color:#fff;}
.card.tight{padding:4px 16px;}

.recipe-row{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid #F5F3EA;cursor:pointer;}
.recipe-row:last-child{border-bottom:none;}
.recipe-row:active{background:#FBFAF4;}
.recipe-row-main{flex:1;min-width:0;}
.recipe-row-name{font-size:15px;font-weight:600;}
.recipe-row-name.is-off{color:var(--muted);}
.off-tag{font-size:10px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--mustard);border:1px solid var(--mustard);border-radius:999px;padding:1px 6px;margin-left:4px;vertical-align:1px;}
.recipe-row-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

.recipe-head{margin-bottom:14px;}
.recipe-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px;}
.recipe-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.recipe-title{font-size:29px;font-weight:800;letter-spacing:-0.8px;margin:0;line-height:1.12;}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.pill{font-size:10.5px;font-weight:800;letter-spacing:0.7px;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:#EDEBDF;color:var(--ink-soft);}
.pill.warn{background:#F6EBDC;color:#8A5A16;}

/* switch */
/* Written as a <label>, so it has to beat `.form-card label{display:block}`
   further up — that override was collapsing the track onto its own text. */
.switch,.form-card label.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;flex:0 0 auto;
  font-size:11px;text-transform:none;letter-spacing:0;margin:0;}
.switch input{position:absolute;opacity:0;width:0;height:0;}
.switch-track{width:38px;height:22px;border-radius:999px;background:#DEDBCC;position:relative;transition:background .2s ease;flex:0 0 auto;}
.switch-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(38,35,25,.28);transition:transform .22s cubic-bezier(.2,.7,.3,1);}
.switch input:checked + .switch-track{background:var(--stamp);}
.switch input:checked + .switch-track .switch-knob{transform:translateX(16px);}
.switch-label{font-size:11px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);}
.switch input:checked ~ .switch-label{color:var(--stamp);}
.switch.inline{margin:4px 0 10px;}

.ri-table{width:100%;border-collapse:collapse;}
.ri-table td{padding:12px 0;border-bottom:1px solid #F5F3EA;font-size:15px;vertical-align:baseline;}
.ri-table tr:last-child td{border-bottom:none;}
.ri-amt{font-weight:800;white-space:nowrap;width:1%;padding-right:16px!important;font-variant-numeric:tabular-nums;font-size:16px;}
.ri-unit{color:var(--muted);font-weight:600;font-size:12px;margin-left:3px;}
.ri-item{font-weight:600;line-height:1.35;}

.rm-list{list-style:none;margin:0;padding:0;}
.rm-list li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #F5F3EA;}
.rm-list li:last-child{border-bottom:none;}
.rm-n{flex:0 0 auto;width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.rm-t{flex:1;font-size:15px;line-height:1.5;}
.rm-list li{padding:11px 0;}
.rn-text{font-size:14px;line-height:1.5;white-space:pre-wrap;}
.ri-link{font-family:inherit;font-size:14.5px;font-weight:700;color:var(--stamp);background:none;border:none;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px;display:inline-flex;align-items:center;gap:3px;}
.ri-link:active{color:var(--stamp-dark);}
.ri-arrow{text-decoration:none;font-size:15px;}
.sub-note{font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
.sub-link{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--stamp);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

/* ===== Prep ===== */
.group{margin-bottom:12px;}
.group .tab-card{margin-bottom:0;}
.group-chev{transition:transform .22s cubic-bezier(.2,.7,.3,1);}
.group.open .group-chev{transform:rotate(90deg);}
/* One grid row only. With several children, extras land in implicit auto rows
   that never collapse, which is what left a gap under a closed group. */
.group-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.25,.8,.35,1);}
.group.open .group-body{grid-template-rows:1fr;}
.group-inner{overflow:hidden;min-height:0;}
.sub-card{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;font-family:inherit;
  background:none;border:none;border-bottom:1px solid var(--line);padding:15px 6px 15px 18px;cursor:pointer;opacity:0;
  transition:opacity .22s ease .06s;}
.group.open .sub-card{opacity:1;}
.sub-card:last-child{border-bottom:none;}
.sub-card:active{background:rgba(38,35,25,.04);}
.sub-name{font-size:15.5px;font-weight:700;}
.sub-hint{font-size:12px;color:var(--muted);margin-top:2px;}
.fn-row{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid #F5F3EA;cursor:pointer;}
.fn-row:last-child{border-bottom:none;}
.fn-row:active{background:#FBFAF4;}
.fn-date{flex:0 0 auto;width:52px;text-align:center;background:#EDEBDF;border-radius:11px;padding:7px 4px;}
.fn-dow{font-size:10px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--stamp);}
.fn-day{font-size:13px;font-weight:800;margin-top:1px;}
.fn-main{flex:1;min-width:0;}
.fn-name{font-size:15.5px;font-weight:700;}
.fn-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.fn-none{padding:12px 2px;color:var(--muted);font-size:12px;letter-spacing:0.3px;}
.fn-item{display:flex;gap:11px;align-items:baseline;padding:10px 0;border-bottom:1px solid #F5F3EA;}
.fn-item:last-child{border-bottom:none;}
.fn-qty{flex:0 0 auto;min-width:34px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--stamp);}
.fn-label{flex:1;font-size:15px;font-weight:600;line-height:1.35;}
.fn-time{font-weight:800;color:var(--stamp);letter-spacing:0;text-transform:none;font-size:11px;}
.fn-note{font-size:11px;color:var(--muted);font-weight:600;}
.fnc-head{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.fnc-name{flex:1;font-family:inherit;font-size:15px;font-weight:700;padding:9px 8px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-width:0;}
.fnc-time{width:92px;font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);}
.fni-block{padding:11px 0;border-bottom:1px solid #F5F3EA;}
.fni-block:last-of-type{border-bottom:none;}
.fni-block input,.fni-block select{font-family:inherit;font-size:14px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-width:0;}
.fni-top{display:flex;gap:8px;align-items:center;}
.fni-label{flex:1;font-weight:600;}
.fni-rule{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;}
.fni-kind{font-size:13px!important;padding:8px 4px!important;flex:0 1 auto;min-width:0;max-width:118px;}
.fni-course-sel{font-size:13px!important;padding:8px 4px!important;flex:0 1 auto;min-width:0;max-width:96px;}
.fni-amt{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;}
.fni-num{width:52px!important;flex:0 0 52px;text-align:center;font-weight:700;}
.fni-unit{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;}
.fni-preview{margin-top:8px;font-size:12.5px;color:var(--ink-soft);}
.fni-preview strong{color:var(--stamp);font-weight:800;}
.fni-dim{color:var(--muted);}
.mezze-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--line);}
.mezze-row .switch,.mezze-row label.switch{flex:1 1 auto;min-width:0;}
.mezze-row .switch-label{white-space:nowrap;}
/* v3.11.25 (his picks, 23 Oct): a function's Add-ons: the mezze boards and the tiramisu (a switch and a number), and one-offs */
.addon-row{margin:0;padding:12px 0;border-top:0;}
.addon-row + .addon-row{border-top:1px solid #F0EEE4;}
.fn-once-head{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:12px 0 4px;border-top:1px solid #F0EEE4;}
.extra-row .ing-item{min-width:0;}
.fn-once{display:inline-block;font-size:10.5px;font-weight:600;color:#7A6E4E;background:#EFE9D5;border-radius:999px;padding:2px 8px;margin-left:4px;vertical-align:1px;}
.switch-track{position:relative;display:inline-block;}
.acc-row{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid #F5F3EA;}
.acc-row:last-child{border-bottom:none;}
.acc-main{flex:1;min-width:0;}
.acc-name{font-size:15.5px;font-weight:700;}
.acc-status{font-size:11.5px;color:var(--muted);margin-top:3px;}
.acc-status.in{color:#5C7A3F;font-weight:700;}
.acc-status.waiting{color:var(--mustard);font-weight:700;}
.btn.small{width:auto;flex:0 0 auto;padding:9px 15px;font-size:10px;}
.code-box{font-size:22px;font-weight:800;letter-spacing:3px;color:var(--stamp);margin:6px 0 2px;}
.code-input-small{width:100%;max-width:170px;margin-top:6px;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:1.5px;
  padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);text-transform:uppercase;}
.code-input-small:focus{outline:none;border-color:var(--ink);}
.pub-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 2px 10px;}
.pub-head span:first-child{font-size:19px;font-weight:800;letter-spacing:-0.3px;}
.pub-meta{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.prep-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #F1EFE4;}
.prep-item:last-child{border-bottom:none;}
.prep-check{flex:0 0 auto;width:44px;height:44px;margin:-9px 0 -9px -9px;border:none;background:none;font-family:inherit;font-size:14px;
  color:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;}
.prep-check::before{content:'';position:absolute;width:26px;height:26px;border:1.5px solid var(--line);background:#F6F5EE;border-radius:8px;
  transition:background .18s ease, border-color .18s ease;}
.prep-check > *,.prep-check{z-index:0;}
.prep-check.on{color:#fff;}
.prep-check.on::before{background:var(--ink);border-color:var(--ink);}
.prep-check:active::before{background:var(--ink);border-color:var(--ink);}
.prep-check span,.prep-check{position:relative;}
.prep-text{position:relative;}
.prep-item.is-done .prep-text::after{content:'';position:absolute;left:0;top:50%;height:1.5px;background:currentColor;width:100%;
  animation:strike .22s cubic-bezier(.2,.7,.3,1) both;}
@keyframes strike{from{width:0;}to{width:100%;}}
.prep-body{flex:1;min-width:0;}
.prep-text{font-size:15px;font-weight:600;line-height:1.35;white-space:pre-wrap;word-break:break-word;}
.prep-item.is-done .prep-text{color:var(--muted);}
.prep-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.prep-recipe{flex:0 0 auto;font-family:inherit;font-size:10.5px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;color:var(--stamp);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;margin-top:1px;}
.prep-recipe:active{background:var(--stamp);border-color:var(--stamp);color:#fff;}
.prep-body.linkable{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  background:none;border:none;padding:0;margin:0;font-family:inherit;text-align:left;cursor:pointer;color:inherit;}
.prep-body.linkable:active .prep-text{color:var(--stamp);}
.chev-btn{flex:0 0 auto;width:44px;height:44px;margin:-9px -12px -9px 0;border:none;background:none;font-family:inherit;
  font-size:19px;color:var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.chev-btn:active{color:var(--stamp);transform:scale(.9);}
.icon-btn{flex:0 0 auto;width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;padding:0;
  transition:background .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;}
.icon-btn svg{width:16px;height:16px;}
.icon-btn:active{transform:scale(.92);}
.icon-btn.add{color:var(--stamp);border-color:#E8D6D2;}
.icon-btn.add:active{background:var(--stamp);border-color:var(--stamp);color:#fff;}
.icon-btn.add.on{background:#EFF3E9;border-color:#D5E0C6;color:#5C7A3F;}
.icon-btn:disabled{opacity:.5;}
.pick-row{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid #F5F3EA;cursor:pointer;}
.pick-row:last-child{border-bottom:none;}
.pick-box{flex:0 0 auto;width:24px;height:24px;border:1.5px solid var(--line);background:#F6F5EE;border-radius:7px;font-size:13px;color:transparent;display:flex;align-items:center;justify-content:center;}
.pick-row.on .pick-box{background:var(--ink);border-color:var(--ink);color:#fff;}
.pick-row.on .pick-name{font-weight:700;}
.pick-name{flex:1;font-size:15px;font-weight:600;min-width:0;}
.pitem-row{padding:8px 0;border-bottom:1px solid #F5F3EA;}
.pitem-row:last-child{border-bottom:none;}
.pitem-row .ing-row{border-bottom:none;padding:0;}
.chip-row.tight-chips{margin-top:7px;gap:5px;}
.chip-row.tight-chips .chip{padding:5px 10px;font-size:11px;}
.sticky-foot{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(to bottom, rgba(241,239,230,0) 0%, var(--paper) 34%);}

.ing-head{display:flex;gap:6px;padding:12px 0 6px;border-bottom:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);}
.ing-head span:nth-child(1){width:64px;}
.ing-head span:nth-child(2){width:60px;}
.ing-head span:nth-child(3){flex:1;}
.ing-head span:nth-child(4){width:26px;}
.ing-row{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #F5F3EA;}
.ing-row:last-child{border-bottom:none;}
.ing-row input{font-family:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-width:0;}
.ing-qty{width:64px;text-align:center;font-weight:700;}
.ing-unit{width:60px;text-align:center;}
.ing-item{flex:1;}
.step-row{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #F5F3EA;}
.step-row:last-child{border-bottom:none;}

const STORAGE_KEY = "order-chit-suppliers";

const CAT_MIGRATION_KEY = 'order-chit-cat-migrated';

/* v3.11.3 (Pluto Stage 4): Move my data. This copy's role: '' (the real copy,
   as every copy was before), 'starter' (it started empty: a new browser, or
   The Pass inside the Pluto app before his data is brought in) or 'backup'
   (he moved his data out and said so). A starter or a backup never sends its
   product list or prep list to the shared server, so it can't put its own
   over the staff app's: a starter holds only the built-in starter list. The
   rules for copying and bringing in are in move-data.js. */
const ROLE_KEY = 'order-chit-copy-role';
const IN_PLUTO = /[?&]pluto=/.test(location.search);
/* v3.11.4 (Pluto Stage 4): room mode (Pluto-Room-Contract v1 §2). Only
   inside the Pluto app (it gives the page PlutoRoomHost) and with
   ?pluto=room: the app loads the page hidden and Pluto asks it things
   (voice.js, "Pluto's Almo room"). A room draws nothing, fetches nothing
   until asked, and never sends the lists (the Almo tab does). In Chrome
   there's no PlutoRoomHost, so this is always false there. */
const ROOM = (function(){ try{ return !!(window.PlutoRoomHost && /[?&]pluto=room(&|$)/.test(location.search)); }catch(e){ return false; } })();
function copyRole(){ try{ const r = localStorage.getItem(ROLE_KEY); return r === 'starter' || r === 'backup' ? r : ''; }catch(e){ return ''; } }
function setCopyRole(r){ try{ if(r) localStorage.setItem(ROLE_KEY, r); else localStorage.removeItem(ROLE_KEY); }catch(e){} }
function syncHeld(){ return copyRole() !== '' || state.storageBroken === true || ROOM; }

/* Categories only exist so the staff app can group its list. They show up on
   the product form, nowhere else. Edit the seed here or add one from the form. */
const CATS_SEED = ['Veggies','Protein','Dry Goods'];
let categories = CATS_SEED.slice();

/* One-time backfill for the products that already existed before categories.
   Keyed on its own flag, not SEED_VERSION, so nothing gets wiped. */
const CAT_BACKFILL = {

  p7:'Protein', p8:'Protein', p9:'Protein', p10:'Protein', p11:'Protein', p35:'Protein', p40:'Protein',
  p12:'Veggies', p13:'Veggies', p14:'Veggies', p15:'Veggies', p16:'Veggies', p17:'Veggies',
  p18:'Veggies', p19:'Veggies', p20:'Veggies', p21:'Veggies', p22:'Veggies', p23:'Veggies',
  p24:'Veggies', p25:'Veggies', p26:'Veggies', p27:'Veggies', p28:'Veggies', p29:'Veggies',
  p30:'Veggies', p31:'Veggies', p32:'Veggies', p33:'Veggies', p34:'Veggies',
  p36:'Dry Goods', p37:'Dry Goods', p38:'Dry Goods', p39:'Dry Goods'

/* Week runs Wednesday 00:00 to Tuesday 23:59, local time.
   Built from local date parts on purpose: toISOString() converts to UTC, which
   in Sydney means anything logged before ~10am lands in the previous week. */
function localDateKey(d){
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}
function getCurrentWeekStart(){
  const now = new Date();
  const diff = (now.getDay() - 3 + 7) % 7;
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diff);
  return localDateKey(start);
}
function todayLabel(){
  return new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});

function buildPrepCatalogue(){
  const items = state.recipes.filter(r => r.active).map(r => ({
    id: 'r:' + r.id, name: r.name, section: r.section || '', recipe: r.id
  }));
  state.prepItems.forEach(i => items.push({ id: i.id, name: i.name, section: i.section || '', recipe: '' }));
  const order = state.recipeSections;
  items.sort((a,b)=>{
    const sa = a.section || 'Other', sb = b.section || 'Other';
    const ia = order.indexOf(a.section), ib = order.indexOf(b.section);
    const ra = ia < 0 ? 999 : ia, rb = ib < 0 ? 999 : ib;
    if(ra !== rb) return ra - rb;
    /* Anything not in the recipe section order used to land in one bucket and
       then sort by item name, which shuffled several sections together and made
       the same heading appear over and over down the screen. Sorting those by
       section name first keeps each one whole. */
    if(ra === 999 && !sameSection(sa, sb)) return sa.localeCompare(sb,'en',{sensitivity:'base'});
    return String(a.name).localeCompare(String(b.name),'en',{sensitivity:'base'});
  });
  return items;
}

/* KV can take a moment to report a tick that was only just written, so a
   background refresh could otherwise undo what you just ticked. Recent local
   ticks win over the server for a short window. */
const recentTicks = {};
/* Long enough to cover KV catching up, short enough that if someone else
   changes the same line it wins almost straight away. */
const TICK_GRACE = 12000;
function rememberTick(id, done, by){ recentTicks[id] = { done: done, by: by, at: Date.now() }; }

/* A delete takes a moment to show up in a listing too, so a poll landing just
   after "Clear completed" can hand back lines that are already gone. These
   tombstones hold them out for the same short window. */
const clearedLines = {};
function dropCleared(lines){
  const cutoff = Date.now() - TICK_GRACE;
  Object.keys(clearedLines).forEach(id => { if(clearedLines[id] < cutoff) delete clearedLines[id]; });
  return (lines||[]).filter(l => !clearedLines[l.id]);
}

/* Keeps anything added in the last few seconds that the server list hasn't
   caught up with yet. Without this a new line blinks out again on next poll. */
function mergeFresh(fromServer, local){
  const seen = {};
  fromServer.forEach(l => { seen[l.id] = true; });
  const cutoff = Date.now() - TICK_GRACE;
  (local||[]).forEach(l => { if(!seen[l.id] && (l.at||0) > cutoff) fromServer.push(l); });
  return fromServer;
}
function applyRecentTicks(lines){
  const cutoff = Date.now() - TICK_GRACE;
  return (lines||[]).map(l => {
    const r = recentTicks[l.id];
    if(!r) return l;
    if(r.at < cutoff){ delete recentTicks[l.id]; return l; }
    if(l.done === r.done) { delete recentTicks[l.id]; return l; }
    return Object.assign({}, l, { done: r.done, doneBy: r.done ? r.by : '', doneAt: r.done ? r.at : 0 });
  });
}

  line.doneAt = done ? Date.now() : 0;

    await res.json().catch(()=>({}));

/* Sections are picked, not typed, so "Sauces" and "sauces" can't both exist. */
function sameSection(a, b){
  return String(a||'').trim().toLowerCase() === String(b||'').trim().toLowerCase();
}
function prepSectionChoices(){
  const out = [];
  const add = s => {
    const v = String(s||'').trim();
    if(v && !out.some(x => sameSection(x, v))) out.push(v);
  };
  state.recipeSections.forEach(add);
  state.recipes.forEach(r => add(r.section));
  state.prepItems.forEach(i => add(i.section));
  return out;
}

/* Folds any near-duplicate sections created before this onto the canonical
   spelling, so the old ones disappear on their own. */
function mergePrepSections(){
  const canon = prepSectionChoices();
  let changed = false;
  state.prepItems.forEach(i => {
    if(!i.section) return;
    const hit = canon.find(c => sameSection(c, i.section));
    if(hit && hit !== i.section){ i.section = hit; changed = true; }
  });
  if(changed) savePrepItems();
}

const COURSE_ORDER = ['Starter','Entrée','Main','Dessert'];

/* Service day, not calendar day: before 5am still counts as last night, so a
   function doesn't vanish off the screen while you're closing down. */
function serviceDateKey(){
  const d = new Date();
  if(d.getHours() < 5) d.setDate(d.getDate() - 1);
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}

function addDaysKey(days){
  const d = new Date();
  d.setDate(d.getDate() + days);
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}

/* Two rules only:
     head — one serve shared between N people
     set  — a flat number of serves you type, whatever the head count

   Head counts round to the nearest five first, because that is how the kitchen
   portions: 32 people get 30 people's worth, 33 get 35. */
const DEFAULT_PER = 5;   // must match the value shown in the input box

function roundedPax(pax){
  const n = Math.max(0, Number(pax) || 0);
  return Math.round(n / 5) * 5;
}

function fnQty(item, pax){
  if(!item) return '';
  if(item.kind === 'set') return String(Math.max(0, Number(item.qty) || 0));
  const per = Math.max(1, Number(item.per) || DEFAULT_PER);
  return String(Math.ceil(roundedPax(pax) / per));
}

function fnRuleText(item){
  if(!item) return '';
  return item.kind === 'set'
    ? 'set amount'
    : '1 per ' + Math.max(1, Number(item.per) || DEFAULT_PER) + ' people';
}

/* Anything saved under the older rule names still reads correctly. */
function normaliseFunctions(){
  (state.functions||[]).forEach(f => {
    (f.courses||[]).forEach(c => { c.items = (c.items||[]).map(i => normaliseItem(i, c.name)); });
  });
  (state.tiers||[]).forEach(tr => { tr.items = (tr.items||[]).map(i => normaliseItem(i)); });
}

function normaliseItem(i, courseName){
  const out = Object.assign({}, i);
  if(out.kind === 'fixed' || out.kind === 'text' || out.kind === 'set'){
    out.kind = 'set';
    out.qty = Math.max(0, Number(i.qty) || 0);
    delete out.per;
  } else {
    out.kind = 'head';
    out.per = Math.max(1, Number(i.per) || DEFAULT_PER);
    delete out.qty;
  }
  delete out.perPax;
  if(!out.course && courseName) out.course = courseName;
  return out;
}

function fnDateLabel(key){
  const d = new Date(key + 'T00:00:00');
  if(isNaN(d)) return key;
  return d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' });
}

function sortCourses(courses){
  return (courses||[]).slice().sort((a,b)=>{
    const ia = COURSE_ORDER.indexOf(a.name), ib = COURSE_ORDER.indexOf(b.name);
    const sa = ia < 0 ? 50 : ia, sb = ib < 0 ? 50 : ib;
    if(sa !== sb) return sa - sb;
    return String(a.time||'').localeCompare(String(b.time||''));
  });
}

/* Turns a tier template into the course list for a new function. */
function coursesFromTier(tier){
  if(!tier) return [];
  const byCourse = {};
  (tier.items||[]).forEach(i => {
    const c = i.course || 'Main';
    if(!byCourse[c]) byCourse[c] = [];
    byCourse[c].push(normaliseItem(Object.assign({}, i, { id: 'i'+Math.random().toString(36).slice(2,7) }), c));
  });
  const names = Object.keys(byCourse).sort((a,b)=>{
    const ia = COURSE_ORDER.indexOf(a), ib = COURSE_ORDER.indexOf(b);
    return (ia<0?50:ia) - (ib<0?50:ib);
  });
  return names.map(n => ({ id:'c'+Math.random().toString(36).slice(2,7), name:n, time:'', items:byCourse[n] }));
}

async function fetchFunctions(){
  try{
    const [fr, tr] = await Promise.all([
      fetch(API + '/api/functions', {cache:'no-store', headers: chefHeaders()}),
      fetch(API + '/api/tiers', {cache:'no-store', headers: chefHeaders()})
    ]);
    if(fr.ok){
      const d = await fr.json();
      state.functions = Array.isArray(d.functions) ? d.functions : [];
    }
    if(tr.ok){
      const d = await tr.json();
      state.tiers = (Array.isArray(d.tiers) && d.tiers.length) ? d.tiers : TIER_SEED.slice();
      if(!Array.isArray(d.tiers) || !d.tiers.length) pushTiers();
    }
    state.fnLoaded = true;
    normaliseFunctions();
    pruneFunctions();
    if(fr.ok) keepFunctionsCopy();   // v3.11.22
    // never redraw over a form being filled in, or typing is lost
    const editing = state.view.name === 'fnEdit' || state.view.name === 'fnTiers';
    if(state.view.name && state.view.name.indexOf('fn') === 0) bgRender();
  }catch(e){
    if(!state.tiers.length) state.tiers = TIER_SEED.slice();
  }
}

function functionsForVoice(list, tiers){

/* v3.11.23 (his ask, 23 Oct: "see the next 4 weeks' worth of functions"): the next 4 weeks, week by
   week (Monday to Sunday; this week from today), then anything booked further out as "later"
   (before, a booking more than a month out wasn't shown anywhere). */
const FN_WEEKS = 4;
function functionWeeks(){
  const today = serviceDateKey(), mon = weekStartKey();
  const upcoming = state.functions.filter(f => f && f.date >= today)
    .sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.startTime||'').localeCompare(String(b.startTime||'')));
  const weeks = [];
  for(let k = 0; k < FN_WEEKS; k++){
    const from = shiftDateKey(mon, 7*k), to = shiftDateKey(mon, 7*k + 6);
    weeks.push({ k, from, to, list: upcoming.filter(f => f.date >= from && f.date <= to) });
  }
  const end = shiftDateKey(mon, 7*FN_WEEKS - 1);
  return { weeks, later: upcoming.filter(f => f.date > end) };
}
/* "19 – 25 Oct", "26 Oct – 1 Nov" */
function fnRangeLabel(from, to){
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const a = new Date(from + 'T12:00:00'), b = new Date(to + 'T12:00:00');
  return a.getMonth() === b.getMonth() ? a.getDate()+' – '+b.getDate()+' '+M[b.getMonth()] : a.getDate()+' '+M[a.getMonth()]+' – '+b.getDate()+' '+M[b.getMonth()];
}

function findRecipe(id){ return state.recipes.find(r => r.id === id); }

/* An ingredient that is itself a recipe becomes a link. Garlic Blitzed is an
   ingredient in ten others, so this is the difference between "make pizza
   sauce" and "make pizza sauce, oh, first make the garlic". */
function recipeByName(name){
  const n = String(name||'').trim().toLowerCase();
  if(!n) return null;
  return state.recipes.find(r => String(r.name).trim().toLowerCase() === n) || null;
}
function subRecipesOf(r){
  const out = [];
  (r.ingredients||[]).forEach(i => {
    const hit = recipeByName(i.item);
    if(hit && hit.id !== r.id && !out.some(x => x.id === hit.id)) out.push(hit);
  });
  return out;
}
function usedByRecipes(r){
  return state.recipes.filter(x => x.id !== r.id &&
    (x.ingredients||[]).some(i => String(i.item).trim().toLowerCase() === String(r.name).trim().toLowerCase()));
}

/* Keeps whatever is typed on screen when a row is added or removed. */
function applyDraftAndRerender(draft){
  const v = state.view;
  if(v.rid === 'new'){
    state.recipeDraft = draft;
  } else {
    const r = findRecipe(v.rid);
    if(r) Object.assign(r, draft);
  }
  render();
}

function recipeSlug(name){
  const base = String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'recipe';
  let id = base, n = 2;
  while(findRecipe(id)){ id = base + '-' + n; n++; }
  return id;
}

/* Data stays in grams; this is display only. 4 kg reads better than 4000 g. */
function fmtAmount(qty, unit){
  const q = Number(qty);
  if(!isFinite(q)) return '';
  if(unit === 'g' && q >= 1000){
    const kg = q / 1000;
    return { amount: (Math.round(kg*1000)/1000).toString(), unit: 'kg' };
  }
  return { amount: (Math.round(q*1000)/1000).toString(), unit: unit || '' };
}

function recipeSectionsInUse(){
  const used = [];
  state.recipes.forEach(r => { const s = r.section || 'Unsorted'; if(used.indexOf(s) < 0) used.push(s); });
  const ordered = state.recipeSections.filter(s => used.indexOf(s) > -1);
  used.forEach(s => { if(ordered.indexOf(s) < 0) ordered.push(s); });
  return ordered;
}

/* v3.9.4: the roster and the timesheet get the product list's guard (v3.9.2,
   saveData). Two open copies of The Pass each keep their own roster and
   timesheet in memory, so the older copy's next edit wrote its old one over
   the newer one. Each copy now remembers what it last read or wrote
   (rosterSeen, timesheetSeen), takes the newer one when another copy writes
   it or when it comes back on screen, and refuses a save over one it hasn't
   seen. Voice reads these from v3.10, so they must be the newest. */
function refuseStaleSave(what, refresh){
  refresh();
  render();
  // a moment later, so a caller's own toast can't cover it
  setTimeout(()=>showToast('Your other The Pass window changed the ' + what + '. Showing it now. Please do that again.'), 60);
}
let rosterSeen = null;
function rosterRaw(){
  try{
    const r = localStorage.getItem(ROSTER_KEY);
    return r === null ? null : JSON.stringify([r, localStorage.getItem(ROSTER_NEXT_KEY)]);
  }catch(e){ return null; }
}
function refreshRosterFromStorage(){
  const now = rosterRaw();
  if(now === null || now === rosterSeen) return false;
  loadRoster();
  return true;
}

/* Both weeks save together: every roster edit goes through here.
   v3.10.0: says whether it was stored (voice must never call a refused or
   failed save "done"); the screen's own callers can ignore it, as before. */
function saveRoster(){
  const now = rosterRaw();
  if(rosterSeen !== null && now !== null && now !== rosterSeen){ refuseStaleSave('roster', refreshRosterFromStorage); return false; }
  let ok = true;
  try{
    localStorage.setItem(ROSTER_KEY, JSON.stringify(state.roster));
    localStorage.setItem(ROSTER_NEXT_KEY, JSON.stringify(state.rosterNext));
  }catch(e){ ok = false; }
  rosterSeen = rosterRaw();
  return ok;
}

/* ===== This week / next week =====
   Two rosters: the week being worked and the one being planned. Next week gets
   planned before Monday, cover shifts included, so nothing may prune it early.
   On the first open of a new week the planned roster becomes this week's, and a
   fresh next week starts as a copy of it with the cover shifts left out - covers
   are one-offs, the regular shifts are what carry. */
const ROSTER_WEEK_KEY = 'order-chit-roster-week';
const ROSTER_NEXT_KEY = 'order-chit-roster-next';
/* v3.9.9: the week just worked, kept at the Monday changeover so voice can
   answer "what was last week's roster?" (owner, 11 Oct). One copy, with the
   names as they were that week, since staff can change. Before this, the
   old week was simply replaced. */
const ROSTER_PREV_KEY = 'order-chit-roster-prev';
function keepLastWeek(weekKey){
  try{
    const names = {};
    (state.staff || []).forEach(s => { names[s.id] = s.name; });
    localStorage.setItem(ROSTER_PREV_KEY, JSON.stringify({ week: weekKey, roster: cloneRoster(state.roster), names: names }));
  }catch(e){}
}

/* v3.11.18 (Pluto reads his own Almo shifts, 18 Oct): the weeks he has
   published. Next week starts as a copy of this week, so Pluto counts it only
   once he has tapped Publish for it (his pick). { "YYYY-MM-DD" (that week's
   Monday): ms }, the last 6. Not moved by Move my data (it's only a note). */
const ROSTER_PUBLISHED_KEY = 'the-pass-roster-published';
function rosterMonday(which){ return which === 'next' ? shiftDateKey(weekStartKey(), 7) : weekStartKey(); }
function markRosterPublished(which){
  try{
    const all = JSON.parse(localStorage.getItem(ROSTER_PUBLISHED_KEY) || '{}') || {};
    all[rosterMonday(which)] = Date.now();
    const keep = {};
    Object.keys(all).sort().slice(-6).forEach(k => { keep[k] = all[k]; });
    localStorage.setItem(ROSTER_PUBLISHED_KEY, JSON.stringify(keep));
  }catch(e){}
}

function rosterFor(which){ return which === 'next' ? state.rosterNext : state.roster; }

function emptyRoster(){ const r = {}; ROSTER_DAY_KEYS.forEach(d => { r[d] = {}; }); return r; }

function cloneRoster(src){
  const out = emptyRoster();
  ROSTER_DAY_KEYS.forEach(d => {
    const day = (src && src[d]) || {};
    Object.keys(day).forEach(sid => { out[d][sid] = Object.assign({}, day[sid]); });
  });
  return out;
}

function isAvailable(staffId, day){
  const st = state.staff.find(s => s.id === staffId);
  return !!(st && st.avail && st.avail[day]);
}

/* Drops shifts on days the person isn't available. Returns how many went. */
function stripCovers(roster){
  let n = 0;
  ROSTER_DAY_KEYS.forEach(day => {
    const entries = roster[day] || {};
    Object.keys(entries).forEach(sid => { if(!isAvailable(sid, day)){ delete entries[sid]; n++; } });
  });
  return n;
}

/* This week or next week as a short Wed-Sun range, e.g. "30 Sep - 4 Oct".
   Service days are Wed to Sun, so that's the range shown. */
function rosterWeekRange(which){
  const mon = new Date(weekStartKey() + 'T12:00:00');
  if(which === 'next') mon.setDate(mon.getDate() + 7);
  const wed = new Date(mon); wed.setDate(mon.getDate() + 2);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const f = d => d.getDate() + ' ' + d.toLocaleString('en-AU', {month:'short'});
  return f(wed) + ' \u2013 ' + f(sun);
}

function weeksBetween(fromKey, toKey){
  const a = new Date(fromKey + 'T12:00:00'), b = new Date(toKey + 'T12:00:00');
  if(isNaN(a) || isNaN(b)) return 0;
  return Math.round((b - a) / (7 * 24 * 3600 * 1000));
}

/* Moves the planned week into this week. A gap of two or more weeks means the
   planned covers belonged to a week that has already gone, so they drop too. */
function advanceRosterWeek(gap){
  state.roster = cloneRoster(state.rosterNext);
  if(gap >= 2) stripCovers(state.roster);
  state.rosterNext = cloneRoster(state.roster);
  const covers = stripCovers(state.rosterNext);
  saveRoster();
  return covers;
}

/* The Monday of the week the current service day falls in. Using the service
   day means a 2am Sunday finish still counts as Sunday, not as Monday. */
function weekStartKey(){
  const d = new Date(serviceDateKey() + 'T12:00:00');
  const dow = d.getDay();               // 0 Sun .. 6 Sat
  const back = dow === 0 ? 6 : dow - 1; // wind back to Monday
  d.setDate(d.getDate() - back);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* Runs on open and whenever the app comes back to the front, and does nothing
   unless the week has actually changed. Returns true if it moved the weeks. */
function rollRosterWeek(){
  const week = weekStartKey();
  let seen = null;
  try{ seen = localStorage.getItem(ROSTER_WEEK_KEY); }catch(e){}
  if(seen === week) return false;
  /* First ever run just records the week. A gap going backwards means the
     phone's clock was wrong at some point, so don't shuffle anything. */
  const gap = seen ? weeksBetween(seen, week) : 0;
  let rolled = false;
  if(gap > 0){
    keepLastWeek(seen);   // v3.9.9: before this week's roster is replaced
    const covers = advanceRosterWeek(gap);
    state.rosterRolled = { covers: covers };
    rolled = true;
  }
  try{ localStorage.setItem(ROSTER_WEEK_KEY, week); }catch(e){}
  return rolled;
}

function loadRoster(){
  let raw = null, rawNext = null;
  rosterSeen = rosterRaw();   // first, so the save below is never refused
  try{ raw = localStorage.getItem(ROSTER_KEY); rawNext = localStorage.getItem(ROSTER_NEXT_KEY); }catch(e){}
  try{ state.roster = raw ? JSON.parse(raw) : {}; }catch(e){ state.roster = {}; }
  ROSTER_DAY_KEYS.forEach(d=>{ if(!state.roster[d]) state.roster[d] = {}; });
  /* First open after this update: there is no next week yet. It starts as a full
     copy, covers and all - if the roster on this phone is already next week's
     plan, stripping anything here would lose shifts that were deliberately set. */
  try{ state.rosterNext = rawNext ? JSON.parse(rawNext) : null; }catch(e){ state.rosterNext = null; }
  if(!state.rosterNext){
    state.rosterNext = cloneRoster(state.roster);
    saveRoster();
  }
  ROSTER_DAY_KEYS.forEach(d=>{ if(!state.rosterNext[d]) state.rosterNext[d] = {}; });
}
function fmtTime(hhmm, spaced){
  if(!hhmm) return '';
  const parts = String(hhmm).split(':');
  const h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  if(isNaN(h)||isNaN(m)) return '';
  const ampm = h>=12 ? 'pm' : 'am';
  let h12 = h%12; if(h12===0) h12=12;
  const sep = spaced ? ' ' : '';
  return m===0 ? `${h12}${sep}${ampm}` : `${h12}:${String(m).padStart(2,'0')}${sep}${ampm}`;
}
function fmtTime12(hhmm){ const s = fmtTime(hhmm, true); return s.replace('am','AM').replace('pm','PM'); }
function timeFieldHTML(label, attr, id, val){
  const disp = val ? fmtTime12(val) : 'Set';
  return `<div class="rfield"><span>${label}</span><div class="tf"><span class="tf-val ${val?'':'tf-empty'}">${disp}</span><input type="time" ${attr}="${id}" value="${val||''}"></div></div>`;
}
/* The time box itself is invisible and sits over this text, so the text has to
   follow the box whenever it changes. */
function syncTimeField(el){
  const span = el && el.parentNode ? el.parentNode.querySelector('.tf-val') : null;
  if(!span) return;
  span.textContent = el.value ? fmtTime12(el.value) : 'Set';
  span.classList.toggle('tf-empty', !el.value);
}
function stationRank(s){ const i = STATIONS.indexOf(s); return i<0 ? 99 : i; }
function buildRosterText(which){
  const roster = rosterFor(which);
  const blocks = [];
  ROSTER_DAY_KEYS.forEach(k=>{
    const entries = roster[k] || {};
    let scheduled = state.staff.filter(st=> entries[st.id] && entries[st.id].start);
    if(scheduled.length===0) return;
    scheduled = scheduled.slice().sort((a,b)=>{
      const ra = stationRank(entries[a.id].station), rb = stationRank(entries[b.id].station);
      if(ra!==rb) return ra-rb;
      return (entries[a.id].start||'').localeCompare(entries[b.id].start||'');
    });
    /* Asterisks are WhatsApp's bold. This only ever goes to WhatsApp - if it
       ever goes by SMS they will show up as literal asterisks. */
    const lines = ['*' + ROSTER_DAY_FULL[k] + '*'];
    scheduled.forEach(st=>{
      const e = entries[st.id];
      const t = e.end ? `${fmtTime(e.start)} - ${fmtTime(e.end)}` : fmtTime(e.start);
      const prefix = e.station ? `${e.station}: ` : '';
      lines.push(`${prefix}${st.name} (${t})`);
    });
    blocks.push(lines.join('\n'));
  });
  if(blocks.length === 0) return '';
  return 'Hey guys,\n\nPlease find the roster for ' + (which === 'next' ? 'next week' : 'this week') + ':\n\n'
    + blocks.join('\n\n')
    + '\n\nThank you';
}

/* ===== Timesheet =====
   One timesheet, not tied to a week. It is a copy of the roster taken the
   first time it opens or when Reset to roster is tapped, and after that it
   only changes when it's edited - Monday's roster handover leaves it alone. */
const TIMESHEET_KEY = 'order-chit-timesheet';          // v3.8 and earlier: edits over the live roster
const TS_WEEKS_KEY = 'order-chit-timesheet-weeks';     // v3.8.1: edits kept per week
const TS_SHEET_KEY = 'order-chit-timesheet-sheet';     // from v3.8.2: the whole timesheet
const OLD_ROSTER_LAST_KEY = 'order-chit-roster-last';  // v3.8.1's copy of the week just worked

function shiftDateKey(key, days){ const d = new Date(key + 'T12:00:00'); d.setDate(d.getDate() + days); return localDateKey(d); }
function isPlainObj(o){ return !!o && typeof o === 'object' && !Array.isArray(o); }
function readStoredJSON(key){ try{ const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; }catch(e){ return null; } }

/* Every day filled in: an edit if there is one, otherwise the roster's start
   with a 9pm finish, otherwise off. */
function timesheetFromRoster(roster, edits){
  const rid = rabindraId();
  const out = {};
  ROSTER_DAY_KEYS.forEach(day => {
    const ov = isPlainObj(edits) ? edits[day] : null;
    if(isPlainObj(ov)){ out[day] = { start: ov.start||'', end: ov.end||'' }; return; }
    const r = roster && roster[day] && rid && roster[day][rid];
    const start = (r && r.start) || '';
    out[day] = { start: start, end: start ? '21:00' : '' };
  });
  return out;
}

/* v3.9.4: the same guard as the roster (see refuseStaleSave). */
let timesheetSeen = null;
function timesheetRaw(){ try{ return localStorage.getItem(TS_SHEET_KEY); }catch(e){ return null; } }
function refreshTimesheetFromStorage(){
  const now = timesheetRaw();
  if(now === null || now === timesheetSeen) return false;
  loadTimesheet();
  return true;
}
function saveTimesheet(){
  const now = timesheetRaw();
  if(timesheetSeen !== null && now !== null && now !== timesheetSeen){ refuseStaleSave('timesheet', refreshTimesheetFromStorage); return; }
  try{ localStorage.setItem(TS_SHEET_KEY, JSON.stringify(state.timesheet)); }catch(e){}
  timesheetSeen = timesheetRaw();
}

function loadTimesheet(){
  timesheetSeen = timesheetRaw();   // first, so the save below is never refused
  const sheet = readStoredJSON(TS_SHEET_KEY);
  if(isPlainObj(sheet)){
    state.timesheet = {};
    ROSTER_DAY_KEYS.forEach(d => {
      const e = isPlainObj(sheet[d]) ? sheet[d] : {};
      state.timesheet[d] = { start: e.start||'', end: e.end||'' };
      if(typeof e.date === 'string' && e.date) state.timesheet[d].date = e.date;   // v3.9.6
    });
    return;
  }
  /* First open of v3.8.2: keep what the old timesheet was showing. v3.8.1 kept
     last week and this week apart - this week's wins if it was edited, else
     last week's, filled from the roster that week actually had. Before that
     there was one set of edits over this week's roster. The old keys are
     left untouched as a backup. */
  const has = o => isPlainObj(o) && Object.keys(o).length > 0;
  const weeks = readStoredJSON(TS_WEEKS_KEY);
  let edits = null, roster = state.roster;
  if(isPlainObj(weeks)){
    const thisK = weekStartKey(), lastK = shiftDateKey(thisK, -7);
    if(has(weeks[thisK])) edits = weeks[thisK];
    else if(has(weeks[lastK])){
      edits = weeks[lastK];
      const rl = readStoredJSON(OLD_ROSTER_LAST_KEY);
      if(isPlainObj(rl)) roster = rl;
    }
  }
  if(!edits){ const legacy = readStoredJSON(TIMESHEET_KEY); if(has(legacy)) edits = legacy; }
  state.timesheet = timesheetFromRoster(roster, edits);
  saveTimesheet();
}
/* v3.9.6: each day remembers the date it was filled in for, so voice can
   tell this Wednesday from last Wednesday (almo-voice-brain.md 5.5). Typed
   on the screen, it's the latest date on that weekday, up to today's
   service day. Voice passes its own date; '' means unknown (as every row
   saved before v3.9.6, and Reset to roster, are). Hours, the screen and the
   text sent to accounts don't use it. */
function tsDayDate(day){
  const want = ['sun','mon','tue','wed','thu','fri','sat'].indexOf(day);
  if(want < 0) return '';
  const d = new Date(serviceDateKey() + 'T12:00:00');
  d.setDate(d.getDate() - (d.getDay() - want + 7) % 7);
  return localDateKey(d);
}
function setTsDay(day, val){
  const date = val.date !== undefined ? val.date : tsDayDate(day);
  state.timesheet[day] = { start: val.start||'', end: val.end||'' };
  if(date) state.timesheet[day].date = date;
  saveTimesheet();
}
function rabindraId(){
  const r = state.staff.find(s => (s.name||'').trim().toLowerCase()==='rabindra');
  if(r) return r.id;
  return state.staff[0] ? state.staff[0].id : null;
}
function hoursBetween(startHHMM, endHHMM){
  if(!startHHMM || !endHHMM) return 0;
  const [sh,sm] = startHHMM.split(':').map(Number);
  const [eh,em] = endHHMM.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins < 0) mins += 24*60;
  return mins/60;
}
function fmtNum(x){ return String(parseFloat(x.toFixed(2))); }
function effectiveTs(day){
  const e = (state.timesheet && state.timesheet[day]) || {};
  return { start: e.start||'', end: e.end||'' };
}
function buildTimesheetText(){
  const rid = rabindraId();
  const meObj = state.staff.find(s=>s.id===rid);
  const name = meObj ? meObj.name : 'Rabindra';
  const dayLabels = [['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];
  const lines = [name+':', ''];
  let total = 0, any = false;
  dayLabels.forEach(([k,lbl])=>{
    const e = effectiveTs(k);
    if(!e.start) return;
    any = true;
    if(e.end){
      const h = hoursBetween(e.start, e.end);
      total += h;
      lines.push(`${lbl}: ${fmtTime(e.start,true)} - ${fmtTime(e.end,true)} (${fmtNum(h)})`);
    } else {
      lines.push(`${lbl}: ${fmtTime(e.start,true)}`);
    }
  });
  if(!any) return '';
  lines.push('');
  lines.push(`Total hours: ${fmtNum(total)} hrs`);
  return lines.join('\n');
}

/* ===== Deni Foods -> Two Providores (Sep 2026) =====
   Runs once, on its own flag, never through SEED_VERSION - that would wipe every
   product edit on the phone. Products move with their ids, so staff orders,
   the staff app catalogue and Repeat Last Order all keep pointing at them. */
const DENI_MOVE_KEY = 'order-chit-deni-moved';
function moveDeniToTwoProvidores(){
  let done = false;
  try{ done = localStorage.getItem(DENI_MOVE_KEY) === '1'; }catch(e){}
  if(done) return null;
  const isDeni = s => s && (s.id === 's5' || /\bdeni\b/i.test(s.name || ''));
  const deni = state.suppliers.find(isDeni);
  let result = null;
  if(deni){
    let two = state.suppliers.find(s => s !== deni && (s.id === 's8' || /two\s*prov/i.test(s.name || '')));
    if(!two){
      const tpl = seed.find(s => s.id === 's8');
      two = { id: state.suppliers.some(s => s.id === 's8') ? 's' + uid() : 's8', name: tpl.name,
              contactType: tpl.contactType, contact: tpl.contact, address: '',
              products: [], template: JSON.parse(JSON.stringify(tpl.template)) };
      state.suppliers.push(two);
    }
    if(!Array.isArray(two.products)) two.products = [];
    const have = {};
    two.products.forEach(p => { have[String(p.name || '').trim().toLowerCase()] = true; });
    let moved = 0, skipped = 0;
    (deni.products || []).forEach(p => {
      const k = String(p.name || '').trim().toLowerCase();
      if(have[k]){ skipped++; return; }
      have[k] = true;
      two.products.push(p);
      moved++;
    });
    /* Deni's last order becomes part of Two Providores' so Repeat Last Order
       still brings those products back. Existing Two Providores entries win. */
    const dl = getLastOrder(deni.id);
    if(dl && Object.keys(dl).length){
      const tl = getLastOrder(two.id) || {};
      Object.keys(dl).forEach(pid => {
        if(!(pid in tl) && two.products.some(p => p.id === pid)) tl[pid] = dl[pid];
      });
      try{ localStorage.setItem(lastOrderKey(two.id), JSON.stringify(tl)); }catch(e){}
    }
    try{ localStorage.removeItem(lastOrderKey(deni.id)); localStorage.removeItem(lastSentKey(deni.id)); }catch(e){}
    state.suppliers = state.suppliers.filter(s => s !== deni);
    saveData();
    result = { moved: moved, skipped: skipped, to: two.name };
  }
  try{ localStorage.setItem(DENI_MOVE_KEY, '1'); }catch(e){}
  return result;
}

      ? JSON.parse(JSON.stringify(mf.template)) : defaultTemplate('sms');
    tpl.greeting = 'Hi mate,';
    aziz = { id: state.suppliers.some(s => s.id === 's9') ? 's' + uid() : 's9', name: 'Aziz Supplier',
             contactType: 'sms', contact: '0401565860', address: '', products: [], template: tpl };
    state.suppliers.push(aziz);
  }
  const leaving = state.suppliers.filter(s => !isKept(s) && s !== aziz);

  /* Everything Aziz could inherit: his own products plus the leaving suppliers'. */
  const pool = (aziz.products || []).slice();
  leaving.forEach(s => (s.products || []).forEach(p => pool.push(p)));
  const used = new Set();
  const take = (ids, names) => {
    let hit = pool.find(p => !used.has(p) && ids.indexOf(p.id) > -1);
    if(!hit) hit = pool.find(p => !used.has(p) && names.indexOf(normProductName(p.name)) > -1);
    if(hit) used.add(hit);
    return hit;
  };
  let added = 0, kept = 0;
  aziz.products = AZIZ_PRODUCTS.map(a => {
    const names = a.slice(1, 2).concat(a.slice(4)).map(normProductName);
    const old = take([a[0]], names);
    if(old){ kept++; return Object.assign(old, { name: a[1], cat: a[3] }); }
    added++;
    const clash = state.suppliers.some(s => (s.products||[]).some(p => p.id === a[0]));
    return { id: clash ? 'p' + uid() : a[0], name: a[1], unit: a[2], qty: 0, inc: a[0]==='p35' ? 2 : 1, cat: a[3] };
  });
  const dropped = pool.filter(p => !used.has(p)).map(p => p.name);

  /* Repeat Last Order: carry across anything that's still one of Aziz's products. */
  const ids = new Set(aziz.products.map(p => p.id));
  const al = {};
  [aziz].concat(leaving).forEach(s => {
    const ol = getLastOrder(s.id);
    if(ol) Object.keys(ol).forEach(pid => { if(ids.has(pid) && !(pid in al)) al[pid] = ol[pid]; });
  });
  try{ localStorage.setItem(lastOrderKey(aziz.id), JSON.stringify(al)); }catch(e){}
  leaving.forEach(s => { try{ localStorage.removeItem(lastOrderKey(s.id)); localStorage.removeItem(lastSentKey(s.id)); }catch(e){} });

  /* Staff app sections the new products use. */
  ['Dairy','Frozen'].forEach(c => { if(categories.indexOf(c) < 0) categories.push(c); });
  saveCategories();

  rememberRetired(leaving);
  state.suppliers = state.suppliers.filter(s => leaving.indexOf(s) < 0);
  saveData();
  try{ localStorage.setItem(AZIZ_V2_KEY, '1'); localStorage.setItem(AZIZ_MOVE_KEY, '1'); }catch(e){}
  if(dropped.length){ try{ localStorage.setItem('order-chit-aziz-dropped', JSON.stringify(dropped)); }catch(e){} }
  return (created || leaving.length || added) ? { removed: leaving.length, added: added, kept: kept, dropped: dropped } : null;
}

function ordinal(day){
  const suf = (day>3 && day<21) ? 'th' : ['th','st','nd','rd'][day%10 > 3 ? 0 : day%10];
  return day + suf;
}
function formatDate(d){
  return ordinal(d.getDate()) + ' ' + d.toLocaleString('en-AU', {month:'long'});
}
function nextWeekday(name){
  const names = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const target = names.indexOf(String(name||'').toLowerCase());
  if(target < 0) return null;
  const now = new Date();
  let diff = (target - now.getDay() + 7) % 7;
  if(diff === 0) diff = 7;
  const d = new Date(now);
  d.setDate(now.getDate() + diff);
  return d;
}
