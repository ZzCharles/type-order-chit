  });

  /* Updated stamp handler: clear order after send */
  const stampBtn = document.getElementById('send-stamp');
  if(stampBtn){
    stampBtn.addEventListener('click', (e)=>{
      e.preventDefault();
      const s = findSupplier(stampBtn.dataset.supplier);
      saveLastOrder(s);
      s.products.forEach(p => { p.qty = 0; });
      saveData();
      showToast('Order sent & cleared');
      stampBtn.classList.add('sent');
      setTimeout(() => {
        window.location.href = stampBtn.getAttribute('href');
      }, 100);
    });
  }

  const copyBtn = document.getElementById('copy-btn');
  if(copyBtn){
    copyBtn.addEventListener('click', async ()=>{
      const s = findSupplier(copyBtn.dataset.supplier);
      const items = s.products.filter(p=>p.qty>0);
      const text = buildMessage(s, items, ticketDateWord);
      try{
        await navigator.clipboard.writeText(text);
        showToast('Copied to clipboard');
      }catch(e){
        const area = document.getElementById('copy-area');
        area.style.display = 'block';
        area.value = text;
        area.select();
        showToast('Select & copy manually');
      }
    });
  }

  /* Invoice handlers */
  const chefSave = document.getElementById('chef-key-save');
  if(chefSave){
    chefSave.addEventListener('click', async ()=>{
      const v = (document.getElementById('chef-key-input').value || '').trim();
      if(!v){ showToast('Enter the key first'); return; }
      setChefKey(v);
      state.invoiceSync = null;
      render();
      await fetchInvoices();
      publishCatalogue(true);
    });
  }
  document.querySelectorAll('[data-chef-reset]').forEach(btn => {
    btn.addEventListener('click', ()=>{
      setChefKey('');
      state.invoiceSync = null;
      render();
    });
  });
  const invClear = document.getElementById('inv-clear');
  if(invClear){
    invClear.addEventListener('click', ()=>{
      if(!confirm('Clear every invoice logged this week? Your archive elsewhere is untouched.')) return;
      clearInvoiceWeek();
    });
  }
  document.querySelectorAll('[data-invoice-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const supplierId = btn.dataset.invoiceAdd;
      const input = document.getElementById('inv-amount-'+supplierId);
      if(!input) return;
      const amount = parseFloat(input.value);
      if(isNaN(amount) || amount <= 0) { showToast('Enter a valid amount'); return; }
      const weekKey = getCurrentWeekStart();
      if(!state.invoices[weekKey]) state.invoices[weekKey] = {};
      if(!state.invoices[weekKey][supplierId]) state.invoices[weekKey][supplierId] = [];
      state.invoices[weekKey][supplierId].push({
        amount: Math.round(amount*100)/100,
        date: todayLabel(),
        timestamp: new Date().toISOString()
      });
      saveInvoices();
      render();
    });
  });

  document.querySelectorAll('[data-invoice-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const supplierId = btn.dataset.invoiceDel;
      const index = parseInt(btn.dataset.index, 10);
      const weekKey = getCurrentWeekStart();
      const weekData = state.invoices[weekKey];
      if(weekData && weekData[supplierId]) {
        weekData[supplierId].splice(index, 1);
        saveInvoices();
        render();
      }
    });
  });



  document.querySelectorAll('[data-group]').forEach(b => {
    b.addEventListener('click', ()=>{
      const k = b.dataset.group;
      state.homeOpen = state.homeOpen === k ? null : k;
      render();
    });
  });

  // ---- Prep ----
  document.querySelectorAll('[data-tick]').forEach(b => {
    b.addEventListener('click', ()=> tickPrepLine(b.dataset.tick, b.dataset.done !== '1'));
  });

  const pubClear = document.getElementById('prep-pub-clear');
  if(pubClear){
    pubClear.addEventListener('click', async ()=>{
      if(!confirm('Clear the published prep list for everyone?')) return;
      pubClear.disabled = true;
      try{
        const res = await fetch(API + '/api/prep/published/clear', {
          method:'POST', headers: chefHeaders({'Content-Type':'application/json'}), body:'{}'
        });
        if(!res.ok) throw new Error();
        state.published = null;
        state.prepDraft = null;
        render();
        showToast('Prep list cleared');
      }catch(e){ pubClear.disabled = false; showToast('No connection. Nothing was cleared.'); }
    });
  }

  function readExtras(){
    const out = [];
    document.querySelectorAll('[data-extra]').forEach(inp => {
      const v = (inp.value||'').trim();
      if(v) out.push(v);
    });
    return out;
  }

  document.querySelectorAll('[data-pick]').forEach(row => {
    row.addEventListener('click', ()=>{
      const d = ensurePrepDraft();
      d.extras = readExtras();
      const id = row.dataset.pick;
      if(d.chosen[id]) delete d.chosen[id]; else d.chosen[id] = true;
      render();
    });
  });

  const pSearch = document.getElementById('prep-search');
  if(pSearch){
    pSearch.addEventListener('input', ()=>{
      const d = ensurePrepDraft();
      d.extras = readExtras();
      state.prepSearch = pSearch.value;
      const pos = pSearch.selectionStart;
      render();
      const again = document.getElementById('prep-search');
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    });
  }
  const pClear = document.getElementById('prep-search-clear');
  if(pClear){
    pClear.addEventListener('click', ()=>{
      const d = ensurePrepDraft();
      d.extras = readExtras();
      state.prepSearch = '';
      render();
    });
  }

  const extraAdd = document.getElementById('extra-add');
  if(extraAdd){
    extraAdd.addEventListener('click', ()=>{
      const d = ensurePrepDraft();
      d.extras = readExtras();
      d.extras.push('');
      render();
      const inputs = document.querySelectorAll('[data-extra]');
      if(inputs.length) inputs[inputs.length-1].focus();
    });
  }
  document.querySelectorAll('[data-extra-del]').forEach(b => {
    b.addEventListener('click', ()=>{
      const d = ensurePrepDraft();
      const ex = readExtras();
      ex.splice(parseInt(b.dataset.extraDel,10), 1);
      d.extras = ex;
      render();
    });
  });

  const doPublish = document.getElementById('prep-publish');
  if(doPublish){
    doPublish.addEventListener('click', ()=>{
      const d = ensurePrepDraft();
      d.extras = readExtras();
      const cat = buildPrepCatalogue();
      const lines = [];
      cat.forEach(c => {
        if(!d.chosen[c.id]) return;
        lines.push({ id: c.id, text: c.name, section: c.section || 'Other', recipe: c.recipe || '' });
      });
      d.extras.forEach((x, i) => {
        if(!x.trim()) return;
        lines.push({ id: 'x'+i+'-'+Math.random().toString(36).slice(2,6), text: x.trim(), section: 'Anything else', recipe: '' });
      });
      if(lines.length === 0){ showToast('Nothing ticked'); return; }
      doPublish.disabled = true;
      doPublish.textContent = 'Publishing…';
      publishPrep(lines);
    });
  }

  document.querySelectorAll('[data-add-line]').forEach(b => {
    b.addEventListener('click', async ()=>{
      const id = b.dataset.addLine;
      const already = (state.published ? state.published.lines : []).some(l => l.id === id);
      if(already){ showToast('Already on the list'); return; }
      savePrepItemEdits();
      const line = { id: id, text: b.dataset.name, section: b.dataset.sec || 'Other', recipe: b.dataset.recipe || '' };
      if(!line.text){ showToast('Give it a name first'); return; }
      b.disabled = true;
      const lines = (state.published ? state.published.lines.slice() : []).concat([line]);
      try{
        const res = await fetch(API + '/api/prep/published', {
          method:'POST', headers: chefHeaders({'Content-Type':'application/json'}),
          body: JSON.stringify({ lines: lines })
        });
        if(!res.ok) throw new Error();
        state.published = { lines: lines, publishedAt: state.published ? state.published.publishedAt : Date.now() };
        render();
        showToast(line.text + ' added to the list');
      }catch(e){
        b.disabled = false;
        showToast('No connection. Not added.');
      }
    });
  });

  // ---- Prep items ----
  const pitemAdd = document.getElementById('pitem-add');
  if(pitemAdd){
    pitemAdd.addEventListener('click', ()=>{
      savePrepItemEdits();
      state.prepItems.push({ id:'s:'+uid(), name:'', section:'' });
      savePrepItems();
      render();
      const inputs = document.querySelectorAll('[data-pitem]');
      if(inputs.length) inputs[inputs.length-1].focus();
    });
  }
  document.querySelectorAll('[data-pitem-del]').forEach(b => {
    b.addEventListener('click', ()=>{
      savePrepItemEdits();
      state.prepItems = state.prepItems.filter(i => i.id !== b.dataset.pitemDel);
      savePrepItems();
      render();
    });
  });
  document.querySelectorAll('[data-pitem]').forEach(inp => {
    inp.addEventListener('change', ()=>{ savePrepItemEdits(); savePrepItems(); });
  });
  document.querySelectorAll('[data-pitem-sec]').forEach(inp => {
    inp.addEventListener('change', ()=>{ savePrepItemEdits(); savePrepItems(); });
  });

  // ---- Recipes ----
  document.querySelectorAll('[data-open-recipe]').forEach(el => {
    el.addEventListener('click', ()=> goto({name:'recipe', rid: el.dataset.openRecipe, from: el.dataset.from || 'recipes'}));
  });

  const rSearch = document.getElementById('recipe-search');
  if(rSearch){
    rSearch.addEventListener('input', ()=>{
      state.recipeSearch = rSearch.value;
      const pos = rSearch.selectionStart;
      render();
      const again = document.getElementById('recipe-search');
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    });
  }
  const rClear = document.getElementById('recipe-search-clear');
  if(rClear){
    rClear.addEventListener('click', ()=>{ state.recipeSearch=''; render(); const a=document.getElementById('recipe-search'); if(a) a.focus(); });
  }
  document.querySelectorAll('[data-rfilter]').forEach(b => {
    b.addEventListener('click', ()=>{ state.recipeFilter = b.dataset.rfilter || null; render(); });
  });

  const notesOn = document.getElementById('r-notes-on');
  if(notesOn){
    notesOn.addEventListener('change', ()=>{
      const ta = document.getElementById('r-notes');
      if(!ta) return;
      ta.hidden = !notesOn.checked;
      if(notesOn.checked) ta.focus(); else ta.value = '';
    });
  }

  document.querySelectorAll('[data-recipe-toggle]').forEach(b => {
    b.addEventListener('change', ()=>{
      const r = findRecipe(b.dataset.recipeToggle);
      if(!r) return;
      r.active = !r.active;
      r.updated = localDateKey(new Date());
      saveRecipes();
      render();

  document.querySelectorAll('[data-rsec-chip]').forEach(el => {

      const f = document.getElementById('r-section');
      if(f) f.value = el.dataset.rsecChip;
      document.querySelectorAll('[data-rsec-chip]').forEach(c=>c.classList.remove('chip-on'));
      el.classList.add('chip-on');
    });

  const rsecNew = document.querySelector('[data-rsec-new]');
  if(rsecNew){
    rsecNew.addEventListener('click', ()=>{
      const name = (prompt('Name the new section') || '').trim().slice(0,60);
      if(!name) return;
      if(state.recipeSections.indexOf(name) < 0){ state.recipeSections.push(name); saveRecipes(); }
      const f = document.getElementById('r-section');
      if(f) f.value = name;
      render();
    });
  }

  // draft edits are read straight off the inputs, so nothing is lost on re-render
  function readRecipeDraft(){
    const ings = [];
    document.querySelectorAll('[data-ing-item]').forEach(inp => {
      const idx = inp.dataset.ingItem;
      const qtyEl = document.querySelector('[data-ing-qty="'+idx+'"]');
      const unitEl = document.querySelector('[data-ing-unit="'+idx+'"]');
      const item = (inp.value||'').trim();
      if(!item) return;
      const q = parseFloat(qtyEl ? qtyEl.value : '0');
      ings.push({ qty: isFinite(q)?q:0, unit: (unitEl && unitEl.value.trim()) || 'g', item: item });
    });
    const steps = [];
    document.querySelectorAll('[data-step]').forEach(ta => {
      const v = (ta.value||'').trim();
      if(v) steps.push(v);
    });
    const allerg = (document.getElementById('r-allergens').value||'')
      .split(',').map(s=>s.trim()).filter(Boolean);
    const notesOn = document.getElementById('r-notes-on');
    return {
      name: (document.getElementById('r-name').value||'').trim(),
      section: (document.getElementById('r-section').value||'').trim(),
      notes: (notesOn && !notesOn.checked) ? '' : (document.getElementById('r-notes').value||'').trim(),
      allergens: allerg,
      ingredients: ings,
      method: steps
    };
  }

  const ingAdd = document.getElementById('ing-add');
  if(ingAdd){
    ingAdd.addEventListener('click', ()=>{
      const d = readRecipeDraft();
      d.ingredients.push({qty:0, unit:'g', item:''});
      applyDraftAndRerender(d);
    });
  }
  const stepAdd = document.getElementById('step-add');
  if(stepAdd){
    stepAdd.addEventListener('click', ()=>{
      const d = readRecipeDraft();
      d.method.push('');
      applyDraftAndRerender(d);
    });
  }
  document.querySelectorAll('[data-ing-del]').forEach(b => {
    b.addEventListener('click', ()=>{
      const d = readRecipeDraft();
      d.ingredients.splice(parseInt(b.dataset.ingDel,10), 1);
      applyDraftAndRerender(d);
    });
  });
  document.querySelectorAll('[data-step-del]').forEach(b => {
    b.addEventListener('click', ()=>{
      const d = readRecipeDraft();
      d.method.splice(parseInt(b.dataset.stepDel,10), 1);
      applyDraftAndRerender(d);
    });
  });

  document.querySelectorAll('[data-recipe-save]').forEach(b => {
    b.addEventListener('click', ()=>{
      const id = b.dataset.recipeSave;
      const d = readRecipeDraft();
      if(!d.name){ showToast('Recipe name required'); return; }
      if(id === 'new'){
        const rec = Object.assign({ id: recipeSlug(d.name), active:true, updated: localDateKey(new Date()) }, d);
        state.recipes.push(rec);
        saveRecipes();
        goto({name:'recipe', rid: rec.id});
        showToast('Recipe added');
      } else {
        const r = findRecipe(id);
        if(!r) return;
        Object.assign(r, d, { updated: localDateKey(new Date()) });
        saveRecipes();
        goto({name:'recipe', rid: id});
        showToast('Recipe saved');
      }
    });
  });

  document.querySelectorAll('[data-recipe-del]').forEach(b => {
    b.addEventListener('click', ()=>{
      const r = findRecipe(b.dataset.recipeDel);
      if(!r) return;
      if(!confirm('Delete "'+r.name+'"? This cannot be undone.')) return;
      state.recipes = state.recipes.filter(x => x.id !== r.id);
      saveRecipes();
      goto({name:'recipes'});
      showToast('Recipe deleted');
    });
  });

  const importGo = document.getElementById('import-go');
  if(importGo){
    importGo.addEventListener('click', ()=>{
      const raw = (document.getElementById('import-json').value||'').trim();
      if(!raw){ showToast('Paste the JSON first'); return; }
      let data;
      try{ data = JSON.parse(raw); }catch(e){ showToast('That is not valid JSON'); return; }
      const incoming = Array.isArray(data) ? data : data.recipes;
      if(!Array.isArray(incoming) || incoming.length === 0){ showToast('No recipes found in that JSON'); return; }
      if(state.recipes.length && !confirm('Replace all '+state.recipes.length+' recipes with '+incoming.length+' from this file?')) return;

      state.recipes = incoming.map(r => ({
        id: String(r.id || '').trim() || recipeSlug(r.name),
        name: String(r.name||'').trim(),
        section: String(r.section||'').trim(),
        active: r.active !== false,
        batch: String(r.batch || r.yield || '').trim(),
        ingredients: Array.isArray(r.ingredients) ? r.ingredients.map(i => ({
          qty: isFinite(Number(i.qty)) ? Number(i.qty) : 0,
          unit: String(i.unit||'g').trim(),
          item: String(i.item||'').trim()
        })).filter(i => i.item) : [],
        method: Array.isArray(r.method) ? r.method.map(s=>String(s).trim()).filter(Boolean) : [],
        notes: String(r.notes||'').trim(),
        allergens: Array.isArray(r.allergens) ? r.allergens.map(s=>String(s).trim()).filter(Boolean) : [],
        updated: String(r.updated||'').trim()
      })).filter(r => r.name);

      if(Array.isArray(data.sections) && data.sections.length){
        state.recipeSections = data.sections.map(s=>String(s).trim()).filter(Boolean);
      } else {
        const secs = [];
        state.recipes.forEach(r => { if(r.section && secs.indexOf(r.section) < 0) secs.push(r.section); });
        state.recipeSections = secs;
      }
      state.recipesLoaded = true;
      saveRecipes();
      goto({name:'recipes'});
      showToast('Imported '+state.recipes.length+' recipes');
    });
  }

  // ---- Bell button ----
  const bellBtn = document.querySelector('[data-bell]');
  if(bellBtn){
    bellBtn.addEventListener('click', ()=>{
      goto({name:"notifications"});
      fetchOrders();
    });
  }

  // ---- Staff orders ----
  document.querySelectorAll('[data-order-apply]').forEach(btn => {
    btn.addEventListener('click', async ()=>{
      const order = state.orders.find(o => o.id === btn.dataset.orderApply);
      if(!order) return;
      btn.disabled = true;
      let added = 0, missed = 0;
      for(const [pid, qty] of Object.entries(order.items || {})){
        const hit = lookupProduct(pid);
        if(hit){ hit.product.qty = Math.round(((hit.product.qty || 0) + Number(qty)) * 100) / 100; added++; }
        else missed++;
      }
      saveData();
      const ok = await clearOrder(order.id, true);
      if(!ok){ btn.disabled = false; showToast('Added to cart, but it stayed in the list'); render(); return; }
      showToast(missed
        ? `Added ${added} item${added===1?'':'s'}, ${missed} not on file`
        : `Added ${order.sender ? order.sender + "'s" : 'the'} order to your cart`);
      if(state.orders.length === 0) goto({name:"list"}); else render();
    });
  });

  document.querySelectorAll('[data-order-clear]').forEach(btn => {
    btn.addEventListener('click', async ()=>{
      btn.disabled = true;
      const ok = await clearOrder(btn.dataset.orderClear, true);
      if(!ok){ btn.disabled = false; return; }
      showToast('Cleared');
      if(state.orders.length === 0) goto({name:"home"}); else render();
    });
  });

  const resync = document.querySelector('[data-resync]');
  if(resync){
    resync.addEventListener('click', async ()=>{
      resync.textContent = 'Sending…';
      const ok = await publishCatalogue(true);
      if(!ok){ showToast('Still no connection'); const b = document.querySelector('[data-resync]'); if(b) b.textContent = 'Retry now'; }
    });
  }

  // ---- Prep list ----


}

/* ===== Worker calls ===== */

async function fetchOrders(){
  try{
    const res = await fetch(API + '/api/orders', {cache:'no-store'});
    const data = await res.json();
    state.orders = Array.isArray(data.orders) ? data.orders : [];
    render();
  }catch(e){ /* keep whatever we already had */ }
}

async function clearOrder(id, silent){
  const before = state.orders;
  state.orders = state.orders.filter(o => o.id !== id);
  try{
    const res = await fetch(API + '/api/orders/clear', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: id })
    });
    if(!res.ok) throw new Error();
    return true;
  }catch(e){
    state.orders = before;
    render();
    if(!silent) showToast('No connection. Order is still waiting.');
    else showToast('No connection. Order is still waiting.');
    return false;
  }
}




function refreshFromServer(){ fetchOrders(); publishCatalogue(false); fetchInvoices(); fetchRecipes(); refreshPrep(); pushPrepCatalogue(); }

try{ history.replaceState({view:{name:'home'}}, ''); }catch(e){}
window.addEventListener('popstate', (e)=>{
  state.view = (e.state && e.state.view) ? e.state.view : {name:'home'};
  render();
});

loadData();
refreshFromServer();

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') refreshFromServer();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
