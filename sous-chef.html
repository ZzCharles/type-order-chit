<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sous Chef · The Pass</title>
<meta name="theme-color" content="#F1EFE6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sous Chef">
<!-- Inline manifest so the PWA works without an external file -->
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Sous%20Chef%22%2C%22short_name%22%3A%22Sous%22%2C%22start_url%22%3A%22.%2Fsous-chef.html%22%2C%22display%22%3A%22standalone%22%2C%22theme_color%22%3A%22%23F1EFE6%22%2C%22background_color%22%3A%22%23F1EFE6%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D'http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg'%2520viewBox%253D'0%25200%2520100%2520100'%253E%253Ccircle%2520cx%253D'50'%2520cy%253D'50'%2520r%253D'48'%2520fill%253D'%2523A5372F'%252F%253E%253Ctext%2520x%253D'50'%2520y%253D'68'%2520text-anchor%253D'middle'%2520fill%253D'white'%2520font-size%253D'48'%2520font-family%253D'sans-serif'%253E%25E2%259A%2594%253C%252Ftext%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22100x100%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<style>
:root{--paper:#F1EFE6;--ink:#262319;--muted:#8A8677;--stamp:#A5372F;--line:#E7E4D7;--card:#FFFFFF;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--paper);font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);margin:0;display:flex;justify-content:center;min-height:100vh;}
#app{width:100%;max-width:460px;padding:16px 16px 46px;}
.brand{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;}
.brand h1{font-size:20px;font-weight:800;margin:0;}
.tag{font-size:10px;color:var(--muted);}
.btn{font-family:inherit;border:none;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;letter-spacing:0.6px;padding:13px 20px;font-size:11px;cursor:pointer;text-transform:uppercase;width:100%;}
.btn:active{background:#000;}
.section-title{font-size:14px;font-weight:800;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.product-line{display:flex;align-items:center;padding:12px 8px;border-bottom:1px solid #F1EFE4;gap:8px;}
.product-info{flex:1;min-width:0;}
.product-name{font-size:15px;font-weight:600;}
.product-unit{font-size:11px;color:var(--muted);}
.stepper{display:flex;align-items:center;gap:5px;}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#F6F5EE;color:var(--ink);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.stepper button:active{background:var(--ink);color:#fff;}
.stepper .qty-input{width:32px;height:34px;border:none;background:transparent;font-size:16px;font-weight:700;text-align:center;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:11px;z-index:50;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
// ====== PRODUCT CATALOGUE ======
// Every product is listed here, grouped by category.
// IDs match the main app's supplier products.
const products = [
  // VEGGIES
  {id:"p12", name:"Sliced Button Mushroom", unit:"kg", cat:"Veggies", inc:1},
  {id:"p13", name:"Flat White Mushrooms", unit:"kg", cat:"Veggies", inc:1},
  {id:"p14", name:"Green Capsicum", unit:"kg", cat:"Veggies", inc:1},
  {id:"p15", name:"Pineapple", unit:"each", cat:"Veggies", inc:1},
  {id:"p16", name:"Peeled Garlic", unit:"kg", cat:"Veggies", inc:1},
  {id:"p17", name:"Royal Blue Potatoes", unit:"kg", cat:"Veggies", inc:1},
  {id:"p18", name:"Peeled White Onions", unit:"kg", cat:"Veggies", inc:1},
  {id:"p19", name:"Lemon", unit:"kg", cat:"Veggies", inc:1},
  {id:"p20", name:"Black Garlic", unit:"pkt", cat:"Veggies", inc:1},
  {id:"p21", name:"Chives", unit:"market bunch", cat:"Veggies", inc:1},
  {id:"p22", name:"Red Cherry Tomatoes", unit:"punnet", cat:"Veggies", inc:1},
  {id:"p23", name:"Vine Tomatoes", unit:"kg", cat:"Veggies", inc:1},
  {id:"p24", name:"Rocket", unit:"kg", cat:"Veggies", inc:0.5},
  {id:"p25", name:"Leb. Cucumber", unit:"kg", cat:"Veggies", inc:1},
  {id:"p26", name:"Parsley", unit:"market bunch", cat:"Veggies", inc:1},
  {id:"p27", name:"Salad Burnette", unit:"punnet", cat:"Veggies", inc:1},
  {id:"p28", name:"Spanish Onions", unit:"kg", cat:"Veggies", inc:1},
  {id:"p29", name:"Brown Onions", unit:"kg", cat:"Veggies", inc:1},
  {id:"p30", name:"Celery", unit:"each", cat:"Veggies", inc:1},
  {id:"p31", name:"Carrots", unit:"kg", cat:"Veggies", inc:1},
  {id:"p32", name:"Rosemary", unit:"bunch", cat:"Veggies", inc:1},
  {id:"p33", name:"Whole Garlic", unit:"kg", cat:"Veggies", inc:0.5},
  {id:"p34", name:"Fennel Bulb", unit:"each", cat:"Veggies", inc:1},
  // PROTEIN
  {id:"p1",  name:"Chicken Thigh", unit:"kg", cat:"Protein", inc:5},
  {id:"p2",  name:"Raw Frozen Prawns", unit:"pkt", cat:"Protein", inc:1},
  {id:"p3",  name:"Loligo Squid", unit:"box", cat:"Protein", inc:1},
  {id:"p4",  name:"Speck", unit:"pkt", cat:"Protein", inc:1},
  {id:"p5",  name:"Beef Mince", unit:"kg", cat:"Protein", inc:1},
  {id:"p6",  name:"Beef Cheeks", unit:"kg", cat:"Protein", inc:1},
  {id:"p7",  name:"Kransky Sausage", unit:"pkt", cat:"Protein", inc:1},
  {id:"p8",  name:"Pork Mince", unit:"kg", cat:"Protein", inc:1},
  {id:"p9",  name:"Italian Style Thick Sausages Mix", unit:"kg", cat:"Protein", inc:1},
  {id:"p10", name:"Mortadella", unit:"kg", cat:"Protein", inc:1},
  {id:"p11", name:"Pork Belly (no bone)", unit:"kg", cat:"Protein", inc:1},
  {id:"p35", name:"Fior di Latte", unit:"kg", cat:"Protein", inc:2},
  {id:"p40", name:"Pepperoni", unit:"box", cat:"Protein", inc:1},
  // DRY GOODS
  {id:"p36", name:"Fresh Lasagna Sheets", unit:"kg", cat:"Dry Goods", inc:1},
  {id:"p37", name:"Gastronomi Gnocchi", unit:"kg", cat:"Dry Goods", inc:1},
  {id:"p38", name:"Squid Ink Spaghetti", unit:"kg", cat:"Dry Goods", inc:1},
  {id:"p39", name:"Calamarata Pasta", unit:"kg", cat:"Dry Goods", inc:1}
];

// ====== APP STATE ======
let cart = {};  // { productId: quantity }
const STORAGE_KEY = 'sous-chef-cart';

function loadCart(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); cart = raw ? JSON.parse(raw) : {}; } catch(e){ cart = {}; }
}
function saveCart(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); } catch(e){} }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

function render(){
  const app = document.getElementById('app');
  const cats = ['Veggies', 'Dry Goods', 'Protein'];
  let html = `<div class="brand"><h1>Sous Chef</h1><span class="tag">v1.0</span></div>`;
  cats.forEach(cat => {
    const prods = products.filter(p => p.cat === cat);
    if(prods.length === 0) return;
    html += `<div class="section-title">${cat}</div>`;
    prods.forEach(p => {
      const qty = cart[p.id] || 0;
      html += `
        <div class="product-line">
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-unit">${p.unit}</div>
          </div>
          <div class="stepper">
            <button data-dec="${p.id}">−</button>
            <input class="qty-input" data-input="${p.id}" value="${qty}" inputmode="decimal">
            <button data-inc="${p.id}">+</button>
          </div>
        </div>`;
    });
  });
  html += `
    <div style="margin-top:30px;">
      <button class="btn" id="send-btn">Send Order to Kitchen</button>
    </div>`;
  app.innerHTML = html;
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-inc]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.inc;
      const prod = products.find(p => p.id === id);
      const inc = prod ? (prod.inc || 1) : 1;
      cart[id] = Math.round(((cart[id] || 0) + inc) * 100) / 100;
      saveCart(); render();
    });
  });
  document.querySelectorAll('[data-dec]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.dec;
      const prod = products.find(p => p.id === id);
      const inc = prod ? (prod.inc || 1) : 1;
      cart[id] = Math.max(0, Math.round(((cart[id] || 0) - inc) * 100) / 100);
      saveCart(); render();
    });
  });
  document.querySelectorAll('[data-input]').forEach(input => {
    input.addEventListener('change', () => {
      const id = input.dataset.input;
      let v = parseFloat(input.value);
      if (isNaN(v) || v < 0) v = 0;
      cart[id] = Math.round(v * 100) / 100;
      saveCart(); render();
    });
  });

  const sendBtn = document.getElementById('send-btn');
  if(sendBtn){
    sendBtn.addEventListener('click', async () => {
      const items = {};
      for(const [id, qty] of Object.entries(cart)){
        if(qty > 0) items[id] = qty;
      }
      if(Object.keys(items).length === 0){
        showToast('Nothing to send');
        return;
      }
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';
      try{
        // This URL is your Cloudflare Worker.
        const res = await fetch('https://orders.charlesbobby253.workers.dev/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items })
        });
        if(res.ok){
          showToast('Order sent!');
        } else {
          showToast('Failed to send');
        }
      } catch(e){
        showToast('No connection');
      }
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send Order to Kitchen';
    });
  }
}

loadCart();
render();

// Basic service worker for offline caching (inline)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('data:application/javascript,self.addEventListener(%22install%22,()=>{self.skipWaiting()});self.addEventListener(%22activate%22,()=>{clients.claim()});self.addEventListener(%22fetch%22,(e)=>{e.respondWith(caches.match(e.request).then((r)=>r||fetch(e.request)))})');
  });
}
</script>
</body>
</html>
